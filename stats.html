<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Statistik • Smart Presence</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* ===== STYLE SAMA KAYAK SEBELUMNYA ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 20% 30%, #0f172a, #020617);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            padding-bottom: 100px;
        }
        .aurora-bg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0;
            background: linear-gradient(-45deg, #0a0f1e, #1a1040, #0d1b2a, #1a0f2a);
            background-size: 400% 400%;
            animation: aurora 15s ease infinite;
        }
        @keyframes aurora {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .particles {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 4px; height: 4px;
            background: rgba(168, 85, 247, 0.3);
            border-radius: 50%;
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        .glass-card {
            position: relative;
            z-index: 1;
            max-width: 480px;
            width: 100%;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 28px 24px 32px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .page-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        .page-header .back-btn {
            background: rgba(255,255,255,0.06);
            border: none;
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .page-header .back-btn:active { transform: scale(0.95); }
        .page-header h1 {
            font-size: 22px;
            font-weight: 800;
            color: white;
            letter-spacing: -0.3px;
        }
        .page-header .sub {
            font-size: 12px;
            color: #64748b;
            font-weight: 500;
        }

        .refresh-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 8px 12px;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
        }
        .refresh-bar .last-update {
            font-size: 11px;
            color: #64748b;
        }
        .refresh-bar .refresh-btn {
            background: rgba(168,85,247,0.15);
            border: none;
            color: #a855f7;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }
        .refresh-bar .refresh-btn:active { transform: scale(0.95); }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat-card-big {
            background: rgba(0,0,0,0.25);
            border-radius: 20px;
            padding: 16px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .stat-card-big .num {
            font-size: 32px;
            font-weight: 800;
            color: white;
        }
        .stat-card-big .label {
            font-size: 11px;
            color: #64748b;
            font-weight: 500;
            margin-top: 2px;
        }
        .stat-card-big .num.hadir { color: #34d399; }
        .stat-card-big .num.telat { color: #fb923c; }
        .stat-card-big .num.alfa { color: #f87171; }
        .stat-card-big .num.persen { color: #60a5fa; }

        .chart-container {
            background: rgba(0,0,0,0.25);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .chart-container h3 {
            font-size: 14px;
            font-weight: 700;
            color: white;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chart-bar {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .chart-bar-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chart-bar-item .day {
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            width: 36px;
            flex-shrink: 0;
        }
        .chart-bar-item .bar-track {
            flex: 1;
            height: 8px;
            background: rgba(255,255,255,0.06);
            border-radius: 4px;
            overflow: hidden;
        }
        .chart-bar-item .bar-track .bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .chart-bar-item .bar-track .bar-fill.green { background: linear-gradient(90deg, #10b981, #34d399); }
        .chart-bar-item .bar-track .bar-fill.orange { background: linear-gradient(90deg, #f59e0b, #fb923c); }
        .chart-bar-item .bar-track .bar-fill.red { background: linear-gradient(90deg, #ef4444, #f87171); }
        .chart-bar-item .pct {
            font-size: 12px;
            font-weight: 700;
            color: white;
            width: 40px;
            text-align: right;
            flex-shrink: 0;
        }

        .daily-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .daily-list::-webkit-scrollbar { width: 3px; }
        .daily-list::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 10px; }
        .daily-list::-webkit-scrollbar-thumb { background: #a855f7; border-radius: 10px; }

        .daily-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 12px;
            background: rgba(0,0,0,0.15);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.03);
        }
        .daily-item .left {
            font-size: 13px;
            font-weight: 600;
            color: white;
        }
        .daily-item .left .date-sub {
            font-size: 11px;
            color: #64748b;
            font-weight: 400;
        }
        .daily-item .right {
            text-align: right;
        }
        .daily-item .right .jam {
            font-size: 12px;
            color: #94a3b8;
        }
        .daily-item .right .status-badge {
            font-size: 10px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 10px;
            display: inline-block;
            margin-top: 2px;
        }
        .daily-item .right .status-badge.hadir { background: rgba(16,185,129,0.15); color: #34d399; }
        .daily-item .right .status-badge.telat { background: rgba(251,146,60,0.15); color: #fb923c; }
        .daily-item .right .status-badge.alfa { background: rgba(239,68,68,0.1); color: #64748b; }
        .daily-item .right .status-badge.liburan { background: rgba(96,165,250,0.15); color: #60a5fa; }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding: 8px 16px;
            padding-bottom: max(8px, env(safe-area-inset-bottom));
            display: flex;
            justify-content: space-around;
            z-index: 50;
            max-width: 480px;
            margin: 0 auto;
            border-radius: 28px 28px 0 0;
        }
        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 14px;
            background: none;
            border: none;
            color: #64748b;
            font-family: 'Inter', sans-serif;
            font-size: 9px;
            font-weight: 600;
            min-width: 50px;
            text-decoration: none;
        }
        .bottom-nav .nav-item i { font-size: 18px; transition: all 0.2s; }
        .bottom-nav .nav-item.active { color: #a855f7; }
        .bottom-nav .nav-item.active i { transform: translateY(-2px); }
        .bottom-nav .nav-item .dot {
            width: 4px; height: 4px; border-radius: 50%;
            background: #a855f7; opacity: 0;
            transition: all 0.2s;
        }
        .bottom-nav .nav-item.active .dot { opacity: 1; }

        .toast-container {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            max-width: 90%;
            width: 400px;
        }
        .toast {
            background: rgba(15,23,42,0.92);
            backdrop-filter: blur(20px);
            padding: 12px 20px;
            border-radius: 18px;
            color: white;
            font-weight: 600;
            font-size: 13px;
            text-align: center;
            border-left: 4px solid #10b981;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            animation: slideUp 0.4s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .toast.error { border-left-color: #ef4444; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media (max-width: 480px) {
            body { padding: 12px; padding-bottom: 90px; }
            .glass-card { padding: 18px 14px 22px; border-radius: 32px; }
            .page-header h1 { font-size: 18px; }
            .stat-card-big .num { font-size: 26px; }
            .chart-bar-item .day { width: 28px; font-size: 10px; }
            .chart-bar-item .pct { width: 32px; font-size: 10px; }
            .daily-item { padding: 8px 10px; }
            .daily-item .left { font-size: 12px; }
            .refresh-bar { flex-wrap: wrap; gap: 6px; }
            .refresh-bar .last-update { font-size: 10px; }
        }
    </style>
</head>
<body>

<div class="aurora-bg"></div>
<div class="particles" id="particles"></div>

<div class="glass-card">
    <div class="page-header">
        <button class="back-btn" onclick="window.location.href='index.html'">
            <i class="fas fa-arrow-left"></i>
        </button>
        <div>
            <h1>📊 Statistik</h1>
            <div class="sub">Rekap kehadiran Anda</div>
        </div>
    </div>

    <div class="refresh-bar">
        <span class="last-update" id="lastUpdate">🔄 Terakhir: --:--</span>
        <button class="refresh-btn" onclick="refreshStats()">
            <i class="fas fa-sync-alt"></i> Refresh
        </button>
    </div>

    <div class="stat-grid" id="statGrid">
        <div class="stat-card-big">
            <div class="num hadir" id="totalHadir">0</div>
            <div class="label">✅ Total Hadir</div>
        </div>
        <div class="stat-card-big">
            <div class="num telat" id="totalTelat">0</div>
            <div class="label">⏰ Total Telat</div>
        </div>
        <div class="stat-card-big">
            <div class="num alfa" id="totalAlfa">0</div>
            <div class="label">❌ Total Alfa</div>
        </div>
        <div class="stat-card-big">
            <div class="num persen" id="persenKehadiran">0%</div>
            <div class="label">📈 Persentase</div>
        </div>
    </div>

    <div class="chart-container">
        <h3><i class="fas fa-chart-bar" style="color:#a855f7;"></i> Grafik 7 Hari Terakhir</h3>
        <div class="chart-bar" id="chartBar">
            <div style="text-align:center;color:#64748b;padding:16px 0;font-size:13px;">
                <i class="fas fa-spinner fa-pulse"></i> Memuat data...
            </div>
        </div>
    </div>

    <div class="chart-container">
        <h3><i class="fas fa-list" style="color:#34d399;"></i> Riwayat Harian</h3>
        <div class="daily-list" id="dailyList">
            <div style="text-align:center;color:#64748b;padding:16px 0;font-size:13px;">
                <i class="fas fa-spinner fa-pulse"></i> Memuat data...
            </div>
        </div>
    </div>
</div>

<div class="bottom-nav">
    <a href="index.html" class="nav-item">
        <i class="fas fa-home"></i> Home <div class="dot"></div>
    </a>
    <a href="stats.html" class="nav-item active">
        <i class="fas fa-chart-bar"></i> Statistik <div class="dot"></div>
    </a>
    <a href="history.html" class="nav-item">
        <i class="fas fa-history"></i> Riwayat <div class="dot"></div>
    </a>
    <a href="#" class="nav-item" onclick="doLogout(event)">
        <i class="fas fa-sign-out-alt"></i> Keluar <div class="dot"></div>
    </a>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
    // ============================================================
    // KONFIGURASI SUPABASE
    // ============================================================
    const SUPABASE_URL = 'https://zcaqqybonpfishwkmffg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpjYXFxeWJvbnBmaXNod2ttZmZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2Mjc2NDgsImV4cCI6MjEwMzIwMzY0OH0.pBk5nwJI3u9n08onTNmvcOFxtCXQvv-ipYIu2f_iAiQ';

    // ============================================================
    // DATA USER
    // ============================================================
    let user = null;
    try {
        const raw = localStorage.getItem('user_pelem_5');
        if (!raw) throw new Error();
        user = JSON.parse(raw);
        if (!user.id) throw new Error();
    } catch(e) {
        window.location.href = "login.html";
    }

    // ============================================================
    // VARIABEL
    // ============================================================
    let hariLiburMap = {};

    // ============================================================
    // 1. LOAD HARI LIBUR
    // ============================================================
    async function loadHariLibur() {
        try {
            const response = await fetch(
                `${SUPABASE_URL}/rest/v1/hari_libur?select=tanggal,divisi`,
                {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    }
                }
            );
            const data = await response.json();
            hariLiburMap = {};
            data.forEach(item => {
                const key = item.tanggal + '|' + item.divisi;
                hariLiburMap[key] = true;
            });
        } catch(e) {
            hariLiburMap = {};
        }
    }

    function isTanggalLibur(tanggal, divisi) {
        const key = tanggal + '|' + divisi;
        return hariLiburMap[key] || false;
    }

    // ============================================================
    // 2. TOAST
    // ============================================================
    function showToast(msg, type = 'success') {
        const container = document.getElementById('toastContainer');
        container.innerHTML = '';
        const toast = document.createElement('div');
        toast.className = 'toast' + (type !== 'success' ? ' ' + type : '');
        const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
        toast.innerHTML = `<span>${icons[type] || 'ℹ️'}</span> ${msg}`;
        container.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateY(20px)';
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }

    // ============================================================
    // 3. PARTICLES
    // ============================================================
    function createParticles() {
        const container = document.getElementById('particles');
        for (let i = 0; i < 20; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.width = (Math.random() * 3 + 2) + 'px';
            p.style.height = p.style.width;
            p.style.animationDuration = (Math.random() * 15 + 10) + 's';
            p.style.animationDelay = (Math.random() * 10) + 's';
            p.style.opacity = Math.random() * 0.4 + 0.1;
            container.appendChild(p);
        }
    }
    createParticles();

    // ============================================================
    // 4. CACHE
    // ============================================================
    function getCache(key) {
        try {
            const raw = localStorage.getItem(key);
            if (!raw) return null;
            const data = JSON.parse(raw);
            if (Date.now() - data.timestamp > data.duration) {
                localStorage.removeItem(key);
                return null;
            }
            return data.value;
        } catch(e) { return null; }
    }

    function setCache(key, value, duration) {
        try {
            localStorage.setItem(key, JSON.stringify({
                timestamp: Date.now(),
                duration: duration,
                value: value
            }));
        } catch(e) {}
    }

    // ============================================================
    // 5. LOAD STATS DARI SUPABASE
    // ============================================================
    async function loadStats(forceRefresh = false) {
        const cacheKey = 'cache_stats_' + user.id;
        
        if (!forceRefresh) {
            const cached = getCache(cacheKey);
            if (cached) {
                console.log('📦 Stats from cache');
                renderStats(cached);
                updateLastUpdate();
                return;
            }
        }

        console.log('🌐 Stats from Supabase');
        try {
            await loadHariLibur();

            const response = await fetch(
                `${SUPABASE_URL}/rest/v1/absensi?select=*&karyawan_id=eq.${user.id}&order=tanggal.desc&limit=30`,
                {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    }
                }
            );
            const absensi = await response.json();

            let totalHadir = 0, totalTelat = 0, totalAlfa = 0;
            const daily = [];

            absensi.forEach(item => {
                const isLibur = isTanggalLibur(item.tanggal, user.divisi);
                let status = item.jam_pulang ? 'hadir' : (item.jam_masuk ? 'telat' : 'alfa');
                let statusLabel = status === 'hadir' ? 'Hadir' : status === 'telat' ? 'Telat' : 'Alfa';

                if (isLibur) {
                    status = 'libur';
                    statusLabel = '🔵 Libur';
                } else if (status === 'hadir') {
                    totalHadir++;
                } else if (status === 'telat') {
                    totalTelat++;
                } else {
                    totalAlfa++;
                }

                daily.push({
                    tanggal: item.tanggal,
                    jamMasuk: item.jam_masuk || '-',
                    jamPulang: item.jam_pulang || '-',
                    status: status,
                    statusLabel: statusLabel,
                    isLibur: isLibur
                });
            });

            const total = totalHadir + totalTelat + totalAlfa;
            const persentase = total > 0 ? ((totalHadir + totalTelat) / total) * 100 : 0;

            const chart = [];
            const today = new Date();
            for (let i = 6; i >= 0; i--) {
                const d = new Date(today);
                d.setDate(d.getDate() - i);
                const tglStr = d.toISOString().split('T')[0];
                const hari = d.toLocaleDateString('id-ID', { weekday: 'short' });
                
                const found = absensi.filter(a => a.tanggal === tglStr);
                const isLibur = isTanggalLibur(tglStr, user.divisi);
                
                let hadir = 0;
                if (isLibur) {
                    hadir = found.length;
                } else {
                    hadir = found.filter(f => f.jam_pulang).length;
                }
                const totalHari = found.length || 1;
                const persen = (hadir / totalHari) * 100;
                
                chart.push({
                    hari: hari,
                    persen: Math.min(100, persen),
                    isLibur: isLibur
                });
            }

            const result = {
                total: { hadir: totalHadir, telat: totalTelat, alfa: totalAlfa },
                persentase: persentase,
                chart: chart,
                daily: daily
            };

            setCache(cacheKey, result, 300000);
            renderStats(result);
            updateLastUpdate();

        } catch(e) {
            console.error('Load stats error:', e);
            showToast('Gagal memuat statistik', 'error');
            const oldCache = localStorage.getItem(cacheKey);
            if (oldCache) {
                const parsed = JSON.parse(oldCache);
                renderStats(parsed.value);
                showToast('📡 Menggunakan data terakhir', 'warning');
            }
        }
    }

    // ============================================================
    // 6. RENDER STATS
    // ============================================================
    function renderStats(data) {
        document.getElementById('totalHadir').textContent = data.total?.hadir || 0;
        document.getElementById('totalTelat').textContent = data.total?.telat || 0;
        document.getElementById('totalAlfa').textContent = data.total?.alfa || 0;
        document.getElementById('persenKehadiran').textContent = Math.round(data.persentase || 0) + '%';

        const chartContainer = document.getElementById('chartBar');
        const chart = data.chart || [];

        if (chart.length === 0) {
            chartContainer.innerHTML = `
                <div style="text-align:center;color:#64748b;padding:16px 0;font-size:13px;">
                    <i class="fas fa-inbox"></i> Belum ada data chart
                </div>
            `;
        } else {
            let html = '';
            chart.forEach(item => {
                const color = item.isLibur ? 'blue' : (item.persen >= 80 ? 'green' : item.persen >= 50 ? 'orange' : 'red');
                const barColor = item.isLibur ? 'background: linear-gradient(90deg, #60a5fa, #93bbfc);' : '';
                const label = item.isLibur ? '🔵 Libur' : Math.round(item.persen) + '%';
                html += `
                    <div class="chart-bar-item">
                        <div class="day">${item.hari}</div>
                        <div class="bar-track">
                            <div class="bar-fill ${color}" style="width:${Math.min(100, item.persen)}%;${barColor}"></div>
                        </div>
                        <div class="pct" style="${item.isLibur ? 'color:#60a5fa;' : ''}">${label}</div>
                    </div>
                `;
            });
            chartContainer.innerHTML = html;
        }

        const dailyContainer = document.getElementById('dailyList');
        const daily = data.daily || [];

        if (daily.length === 0) {
            dailyContainer.innerHTML = `
                <div style="text-align:center;color:#64748b;padding:16px 0;font-size:13px;">
                    <i class="fas fa-inbox"></i> Belum ada riwayat harian
                </div>
            `;
        } else {
            let html = '';
            daily.forEach(item => {
                const statusClass = item.isLibur ? 'liburan' : (item.status === 'hadir' ? 'hadir' : item.status === 'telat' ? 'telat' : 'alfa');
                const statusLabel = item.isLibur ? '🔵 Libur' : item.statusLabel;
                html += `
                    <div class="daily-item">
                        <div class="left">
                            ${item.tanggal}
                            <div class="date-sub">${item.jamMasuk} → ${item.jamPulang}</div>
                        </div>
                        <div class="right">
                            <div class="status-badge ${statusClass}">${statusLabel}</div>
                        </div>
                    </div>
                `;
            });
            dailyContainer.innerHTML = html;
        }
    }

    // ============================================================
    // 7. UPDATE LAST UPDATE
    // ============================================================
    function updateLastUpdate() {
        const now = new Date();
        const el = document.getElementById('lastUpdate');
        el.textContent = '🔄 Terakhir: ' + now.toLocaleTimeString();
    }

    // ============================================================
    // 8. REFRESH
    // ============================================================
    async function refreshStats() {
        showToast('🔄 Memperbarui data...', 'info');
        await loadStats(true);
        showToast('✅ Data diperbarui!', 'success');
    }

    // ============================================================
    // 9. LOGOUT
    // ============================================================
    function doLogout(event) {
        if (event && event.currentTarget) {
            document.querySelectorAll('.bottom-nav .nav-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }
        if (confirm('Yakin ingin keluar?')) {
            localStorage.removeItem('user_pelem_5');
            window.location.href = 'login.html';
        }
    }

    // ============================================================
    // 10. INIT - 🔥 FIXED! PAKAI IIFE
    // ============================================================
    (async function() {
        await loadHariLibur();
        loadStats(false);
        setTimeout(() => { loadStats(true); }, 500);
        setInterval(() => { loadStats(true); }, 300000);
        console.log('📊 Stats page loaded for:', user.nama);
    })();
</script>
