<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login • Smart Presence</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 20% 30%, #0f172a, #020617);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 40px 32px;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }
        .logo-area { text-align: center; margin-bottom: 32px; }
        .logo-icon {
            width: 72px; height: 72px;
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            border-radius: 28px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 10px 25px rgba(168, 85, 247, 0.3);
        }
        .logo-icon i { font-size: 32px; color: white; }
        h1 {
            font-size: 28px; font-weight: 800; color: white;
            letter-spacing: -0.5px;
        }
        .subtitle { color: #64748b; font-size: 14px; font-weight: 500; }
        .input-group {
            margin-bottom: 20px; position: relative;
        }
        .input-group i {
            position: absolute; left: 20px; top: 50%;
            transform: translateY(-50%);
            color: #475569; font-size: 18px;
        }
        .input-group input {
            width: 100%; padding: 16px 20px 16px 54px;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 28px;
            font-size: 15px; font-family: 'Inter', sans-serif;
            color: white; outline: none;
            transition: all 0.2s;
        }
        .input-group input:focus {
            border-color: #a855f7;
            background: rgba(15,23,42,0.8);
            box-shadow: 0 0 0 4px rgba(168,85,247,0.25);
        }
        .input-group input::placeholder { color: #475569; }
        .btn-login {
            width: 100%; padding: 18px;
            background: linear-gradient(135deg, #10b981, #059669);
            border: none; border-radius: 28px;
            font-size: 16px; font-weight: 800; color: white;
            cursor: pointer; transition: all 0.2s;
            box-shadow: 0 10px 20px -5px rgba(16,185,129,0.4);
            font-family: 'Inter', sans-serif;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 12px 24px -3px rgba(16,185,129,0.5); }
        .btn-login:active { transform: translateY(1px); }
        .btn-login:disabled {
            background: #1e293b; color: #475569;
            box-shadow: none; transform: none; cursor: not-allowed;
            opacity: 0.7;
        }
        .spinner {
            display: inline-block; width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white; border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 8px; vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .footer-note {
            text-align: center; margin-top: 32px;
            color: #475569; font-size: 12px; font-weight: 500;
        }
        .toast {
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%);
            background: rgba(15,23,42,0.9);
            backdrop-filter: blur(20px);
            padding: 14px 28px; border-radius: 40px;
            color: white; font-weight: 600; font-size: 14px;
            z-index: 1000; animation: slideUp 0.3s ease;
            box-shadow: 0 10px 20px -5px rgba(0,0,0,0.5);
            max-width: 90%; white-space: nowrap;
            border-left: 4px solid #10b981;
            font-family: 'Inter', sans-serif;
        }
        .toast.error { border-left-color: #ef4444; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(30px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        @media (max-width: 480px) {
            .glass-card { padding: 30px 20px; border-radius: 32px; }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="glass-card">
        <div class="logo-area">
            <div class="logo-icon"><i class="fas fa-fingerprint"></i></div>
            <h1>Selamat Datang</h1>
            <div class="subtitle">Absensi Relawan SPPG Pelem 5</div>
        </div>

        <div class="input-group">
            <i class="fas fa-id-card"></i>
            <input type="text" id="id" placeholder="ID Karyawan" autocomplete="off" autofocus>
        </div>

        <div class="input-group">
            <i class="fas fa-lock"></i>
            <input type="password" id="pin" placeholder="PIN (4 digit angka)">
        </div>

        <button class="btn-login" id="btn" onclick="doLogin()">
            <span id="btn-text">MASUK</span>
        </button>

        <div class="footer-note">
            <i class="fas fa-shield-alt"></i> Sistem Absensi Terenkripsi
        </div>
    </div>

    <script>
        // ============================================================
        // KONFIGURASI SUPABASE (FIXED!)
        // ============================================================
        const SUPABASE_URL = 'https://zcaqgybonpfishwkmffg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpjYXFneWJvbnBmaXNod2ttZmZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2Mjc2NDgsImV4cCI6MjEwMzIwMzY0OH0.pBk5nwJI3u9n08onTNmvcOFxtCXQvv-ipYIu2f_iAiQ';

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(msg, isError = false) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            
            const toast = document.createElement('div');
            toast.className = 'toast' + (isError ? ' error' : '');
            toast.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-triangle' : 'fa-check-circle'}"></i> ${msg}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // ============================================================
        // AUTO LOGIN
        // ============================================================
        function checkAutoLogin() {
            try {
                const raw = localStorage.getItem('user_pelem_5');
                if (raw) {
                    const user = JSON.parse(raw);
                    if (user && user.id) {
                        console.log('🔄 Auto login for:', user.id);
                        window.location.href = 'index.html';
                        return true;
                    }
                }
            } catch(e) {}
            return false;
        }

        // ============================================================
        // FUNGSI LOGIN - PAKAI SUPABASE!
        // ============================================================
        async function doLogin() {
            const idInput = document.getElementById('id').value.trim().toUpperCase();
            const pinInput = document.getElementById('pin').value;
            const btn = document.getElementById('btn');
            const btnText = document.getElementById('btn-text');

            // Validasi
            if (!idInput) { showToast('Masukkan ID Relawan!', true); return; }
            if (idInput.length < 3) { showToast('ID minimal 3 karakter!', true); return; }
            if (!pinInput) { showToast('Masukkan PIN!', true); return; }
            if (pinInput.length < 4) { showToast('PIN minimal 4 digit!', true); return; }
            if (!/^\d+$/.test(pinInput)) { showToast('PIN harus berupa angka!', true); return; }

            btn.disabled = true;
            btnText.innerHTML = '<span class="spinner"></span> Verifikasi...';

            try {
                console.log('🔑 Login attempt for:', idInput);
                
                // ✅ PAKAI SUPABASE!
                const response = await fetch(
                    `${SUPABASE_URL}/rest/v1/karyawan?select=*&id=eq.${idInput}&pin=eq.${pinInput}`,
                    {
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                        }
                    }
                );
                
                const data = await response.json();
                console.log('📦 Data from Supabase:', data);

                if (data.length === 0) {
                    showToast('ID atau PIN salah!', true);
                    btn.disabled = false;
                    btnText.innerText = 'MASUK';
                    return;
                }

                const user = data[0];
                
                // Format user data
                const userData = {
                    id: user.id,
                    nama: user.nama || user.id,
                    divisi: user.divisi || 'Relawan',
                    foto: user.foto || '',
                    jamMasuk: user.jam_masuk || '08:00',
                    jamPulang: user.jam_pulang || '17:00'
                };
                
                localStorage.setItem('user_pelem_5', JSON.stringify(userData));
                
                showToast('✅ Login berhasil!');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 300);

            } catch(e) {
                console.error('Login error:', e);
                showToast('❌ Koneksi error, cek internet Anda.', true);
                btn.disabled = false;
                btnText.innerText = 'MASUK';
            }
        }

        // ============================================================
        // ENTER KEY
        // ============================================================
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') doLogin();
            });
        });

        // ============================================================
        // AUTO LOGIN CHECK
        // ============================================================
        if (!checkAutoLogin()) {
            console.log('🔐 Silakan login');
        }
    </script>
</body>
</html>
