<div class="container">

                <option value="0">Minggu Ini (Sabtu - Jumat)</option>

<script>
    var SUPABASE_URL = 'https://zcaqqybonpfishwkmffg.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpjYXFxeWJvbnBmaXNod2ttZmZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2Mjc2NDgsImV4cCI6MjEwMzIwMzY0OH0.pBk5nwJI3u9n08onTNmvcOFxtCXQvv-ipYIu2f_iAiQ';

    if (!localStorage.getItem('admin_logged_in')) {
        window.location.href = 'admin_login.html';
    }
    document.getElementById('adminName').textContent = localStorage.getItem('admin_username') || 'Admin';

    var hariNama = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
    var hariNamaLower = ['minggu', 'senin', 'selasa', 'rabu', 'kamis', 'jumat', 'sabtu'];
    var bulanNama = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

    function getDateIndonesia(date) {
        var offset = 7 * 60 * 60 * 1000;
        return new Date(date.getTime() + offset).toISOString().split('T')[0];
    }
    function parseDateIndonesia(dateStr) {
        var parts = dateStr.split('-');
        return new Date(parts[0], parts[1] - 1, parts[2]);
    }

    function toggleTheme() {
        document.body.classList.toggle('light-mode');
        var icon = document.getElementById('themeIcon');
        icon.className = document.body.classList.contains('light-mode') ? 'fas fa-sun' : 'fas fa-moon';
    }
    function showToast(msg, type) {
        type = type || 'success';
        var existing = document.querySelector('.toast-custom');
        if (existing) existing.remove();
        var toast = document.createElement('div');
        toast.className = 'toast-custom';
        var colors = { success: '#10b981', error: '#ef4444', warning: '#f59e0b', info: '#3b82f6' };
        toast.style.borderLeftColor = colors[type] || '#10b981';
        var icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
        toast.innerHTML = (icons[type] || 'ℹ️') + ' ' + msg;
        document.body.appendChild(toast);
        setTimeout(function() {
            toast.style.opacity = '0';
            toast.style.transform = 'translateX(-50%) translateY(20px)';
            setTimeout(function() { toast.remove(); }, 300);
        }, 3000);
    }
    function doLogout() {
        if (confirm('Yakin ingin keluar?')) {
            localStorage.removeItem('admin_logged_in');
            localStorage.removeItem('admin_username');
            window.location.href = 'admin_login.html';
        }
    }

    // Hitung range Sabtu s/d Jumat
    function getRangeSabtuJumat(mingguOffset) {
        var now = new Date();
        var offset = 7 * 60 * 60 * 1000;
        var localNow = new Date(now.getTime() + offset);
        var dayOfWeek = localNow.getDay(); // 0=Minggu, 6=Sabtu
        
        // Cari Sabtu terakhir
        var sabtu = new Date(localNow);
        var selisih = (dayOfWeek - 6 + 7) % 7;
        sabtu.setDate(sabtu.getDate() - selisih);
        
        // Mundur sesuai mingguOffset
        sabtu.setDate(sabtu.getDate() - (mingguOffset * 7));
        
        var jumat = new Date(sabtu);
        jumat.setDate(jumat.getDate() + 6);
        
        return { sabtu: sabtu, jumat: jumat };
    }

    async function loadFilterSatpam() {
        try {
            var response = await fetch(
                SUPABASE_URL + '/rest/v1/karyawan?select=id,nama,divisi&divisi=eq.SATPAM&order=nama.asc',
                { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY } }
            );
            var data = await response.json();
            var select = document.getElementById('filterSatpam');
            select.innerHTML = '<option value="">-- Pilih Satpam --</option>';
            data.forEach(function(k) {
                select.innerHTML += '<option value="' + k.id + '">' + k.nama + '</option>';
            });
        } catch(e) { console.error('Gagal load satpam:', e); }
    }
    loadFilterSatpam();

    function hitungTotalJam(jamMasuk, jamPulang) {
        if (!jamMasuk || !jamPulang || jamMasuk === '-' || jamPulang === '-') return '-';
        // Format: "HH:MM" atau "HH.MM"
        var masuk = jamMasuk.replace('.', ':');
        var pulang = jamPulang.replace('.', ':');
        var partsM = masuk.split(':');
        var partsP = pulang.split(':');
        if (partsM.length !== 2 || partsP.length !== 2) return '-';
        
        var mMenit = parseInt(partsM[0]) * 60 + parseInt(partsM[1]);
        var pMenit = parseInt(partsP[0]) * 60 + parseInt(partsP[1]);
        
        // Kalau pulang < masuk, berarti lewat tengah malam (shift malam)
        if (pMenit < mMenit) pMenit += 24 * 60;
        
        var totalMenit = pMenit - mMenit;
        var jam = Math.floor(totalMenit / 60);
        var menit = totalMenit % 60;
        return jam + ' jam ' + menit + ' mnt';
    }

    async function loadRekap() {
        var mingguOffset = parseInt(document.getElementById('filterPeriode').value);
        var satpamId = document.getElementById('filterSatpam').value;

        if (!satpamId) { showToast('Pilih satpam dulu!', 'warning'); return; }

        var range = getRangeSabtuJumat(mingguOffset);
        var startStr = getDateIndonesia(range.sabtu);
        var endStr = getDateIndonesia(range.jumat);

        var container = document.getElementById('laporanContainer');
        container.innerHTML = '<div class="loading-text"><i class="fas fa-spinner fa-pulse"></i> Memuat data...</div>';

        try {
            // Fetch info satpam
            var satpamRes = await fetch(
                SUPABASE_URL + '/rest/v1/karyawan?select=id,nama,divisi&id=eq.' + encodeURIComponent(satpamId),
                { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY } }
            );
            var satpamData = await satpamRes.json();
            if (!satpamData || satpamData.length === 0) {
                container.innerHTML = '<div class="empty-text">Satpam tidak ditemukan</div>';
                return;
            }
            var satpam = satpamData[0];

            // Fetch absensi di range
            var absenRes = await fetch(
                SUPABASE_URL + '/rest/v1/absensi?select=*&karyawan_id=eq.' + encodeURIComponent(satpamId) + '&tanggal=gte.' + startStr + '&tanggal=lte.' + endStr + '&order=tanggal.asc',
                { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY } }
            );
            var absensi = await absenRes.json();

            var absenMap = {};
            absensi.forEach(function(a) { absenMap[a.tanggal] = a; });

            // Build 7 hari (Sabtu s/d Jumat)
            var rows = [];
            for (var i = 0; i < 7; i++) {
                var d = new Date(range.sabtu);
                d.setDate(d.getDate() + i);
                var tglStr = getDateIndonesia(d);
                var tglFormatted = hariNama[d.getDay()] + ', ' + d.getDate() + ' ' + bulanNama[d.getMonth()] + ' ' + d.getFullYear();

                var abs = absenMap[tglStr];
                var jamMasuk = '-', jamPulang = '-', status = 'alfa', statusText = 'Alfa', totalJam = '-';

                if (abs) {
                    jamMasuk = abs.jam_masuk || '-';
                    jamPulang = abs.jam_pulang || '-';
                    var sDb = String(abs.status || '').toLowerCase().trim();
                    if (sDb === 'izin' || sDb === 'sakit' || sDb === 'dinas') {
                        status = 'izin'; statusText = 'Izin';
                    } else if (sDb === 'telat') {
                        status = 'telat'; statusText = 'Telat';
                    } else if (sDb === 'hadir' || sDb === 'pulang' || jamMasuk !== '-') {
                        status = 'hadir'; statusText = 'Hadir';
                    }
                    totalJam = hitungTotalJam(jamMasuk, jamPulang);
                }

                rows.push({
                    hariTanggal: tglFormatted,
                    jamMasuk: jamMasuk,
                    jamPulang: jamPulang,
                    totalJam: totalJam,
                    status: status,
                    statusText: statusText
                });
            }

            var periodeLabel = 'Periode: ' + startStr + ' s/d ' + endStr;
            renderLaporan(rows, satpam, periodeLabel);

        } catch(e) {
            console.error('Error:', e);
            container.innerHTML = '<div class="empty-text">Gagal memuat data</div>';
            showToast('Gagal memuat data!', 'error');
        }
    }

    function renderLaporan(rows, satpam, periodeLabel) {
        var container = document.getElementById('laporanContainer');
        var logoUrl = 'https://zcaqqybonpfishwkmffg.supabase.co/storage/v1/object/public/logo/Logo_Badan_Gizi_Nasional_(2024)%20(1).png';

        var now = new Date();
        var tglCetak = now.getDate() + ' ' + bulanNama[now.getMonth()] + ' ' + now.getFullYear();

        var html = '<div class="laporan-preview" id="laporanContent">';

        html += '<div class="kop">';
        html += '<div class="header-wrapper">';
        html += '<div class="logo-container">';
        html += '<img src="' + logoUrl + '" alt="Logo" class="logo-img" onerror="this.style.display=\'none\'">';
        html += '</div>';
        html += '<div class="teks">';
        html += '<div class="instansi">SATUAN PELAYANAN PEMENUHAN GIZI</div>';
        html += '<div class="instansi-2">SPPG KEDIRI PARE PELEM 5</div>';
        html += '<div class="yayasan-sub">YAYASAN RIHLAH CAHAYA BANGSA</div>';
        html += '<div class="alamat">Jl Langkat, Singgahan Pelem Kec. Pare, Kab. Kediri, Prov. Jatim 64212</div>';
        html += '<div class="email">Email : sppgpelem10@gmail.com</div>';
        html += '</div>';
        html += '</div>';
        html += '<div class="garis-kop"></div>';
        html += '<div class="judul">REKAP KERJA SATPAM</div>';
        html += '<div class="periode">' + periodeLabel + '</div>';
        html += '<div class="tgl-cetak">Nama: ' + satpam.nama + ' | Dicetak pada: ' + tglCetak + '</div>';
        html += '</div>';

        html += '<table>';
        html += '<thead><tr>';
        html += '<th style="width:30px;">No</th>';
        html += '<th style="width:220px;">Hari/Tanggal</th>';
        html += '<th style="width:80px;">Jam Masuk</th>';
        html += '<th style="width:80px;">Jam Pulang</th>';
        html += '<th style="width:110px;">Total Jam Kerja</th>';
        html += '<th style="width:80px;">Status</th>';
        html += '</tr></thead><tbody>';

        rows.forEach(function(r, idx) {
            html += '<tr>';
            html += '<td>' + (idx + 1) + '</td>';
            html += '<td class="hari-tanggal">' + r.hariTanggal + '</td>';
            html += '<td>' + r.jamMasuk + '</td>';
            html += '<td>' + r.jamPulang + '</td>';
            html += '<td>' + r.totalJam + '</td>';
            html += '<td><span class="status-label ' + r.status + '">' + r.statusText + '</span></td>';
            html += '</tr>';
        });

        html += '</tbody></table>';

        html += '<div class="ttd">';
        html += '<div class="ttd-box">';
        html += '<div class="label">Mengetahui,</div>';
        html += '<div class="jabatan">Kepala SPPG Pelem 5</div>';
        html += '<div class="line"></div>';
        html += '<div class="nama">Daryanto Hasan</div>';
        html += '</div>';
        html += '<div class="ttd-box">';
        html += '<div class="label">Dibuat Oleh,</div>';
        html += '<div class="jabatan">Asisten Lapangan 2</div>';
        html += '<div class="line"></div>';
        html += '<div class="nama">Ikhwanul Muchlisin</div>';
        html += '</div>';
        html += '</div>';

        html += '<div class="footer">Pencatatan dilakukan secara realtime</div>';
        html += '</div>';

        container.innerHTML = html;
    }

    function cetakLaporan() {
        if (!document.getElementById('laporanContent')) {
            showToast('Tampilkan laporan terlebih dahulu sebelum mencetak!', 'warning');
            return;
        }
        window.print();
    }
</script>
