<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifikasi Izin & Edit Absensi - RelawanTrack</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

  <div class="max-w-7xl mx-auto px-4 py-8">
    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">Kelola Izin & Edit Presensi</h1>
        <p class="text-slate-500 text-sm">Verifikasi pengajuan izin karyawan atau sesuaikan rekaman jam hadir secara manual</p>
      </div>
      <a href="admin_dashboard.html" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg text-sm font-medium transition w-fit">
        ← Kembali ke Dashboard
      </a>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- Form Pengajuan / Edit Manual -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 h-fit">
        <h2 class="text-base font-bold text-slate-900 mb-4 pb-2 border-b">Form Input Izin / Edit Presensi</h2>
        
        <form id="formIzin" onsubmit="simpanIzinManual(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Pilih Karyawan</label>
            <select id="selectKaryawan" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="">-- Pilih Karyawan --</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Tanggal</label>
            <input type="date" id="inputTanggal" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Kategori Status</label>
            <select id="selectStatus" onchange="toggleJamInput()" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="Izin">Izin</option>
              <option value="Sakit">Sakit</option>
              <option value="Dinas">Dinas Luar</option>
              <option value="Hadir">Hadir Manual (Edit Jam)</option>
            </select>
          </div>

          <!-- Section Input Jam (Opsional jika pilih Hadir Manual) -->
          <div id="sectionJam" class="hidden grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Jam Masuk</label>
              <input type="time" id="inputJamMasuk" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Jam Pulang</label>
              <input type="time" id="inputJamPulang" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Keterangan / Alasan</label>
            <textarea id="inputKeterangan" rows="3" placeholder="Alasan izin / catatan penyesuaian..." class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
          </div>

          <button type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg text-sm transition">
            Simpan & Verifikasi
          </button>
        </form>
      </div>

      <!-- Tabel Daftar Pengajuan & Riwayat Izin -->
      <div class="lg:col-span-2 space-y-6">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
          <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
            <h2 class="text-sm font-bold text-slate-800">Daftar Pengajuan & Verifikasi Presensi</h2>
            <input type="date" id="filterTanggal" onchange="fetchDaftarIzin()" class="px-3 py-1.5 border rounded-lg text-xs outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-left text-sm">
              <thead class="bg-slate-100 border-b border-slate-200 text-slate-600 font-semibold uppercase text-xs">
                <tr>
                  <th class="p-4">Tanggal</th>
                  <th class="p-4">Karyawan</th>
                  <th class="p-4">Status</th>
                  <th class="p-4">Jam</th>
                  <th class="p-4">Keterangan</th>
                  <th class="p-4 text-center">Persetujuan</th>
                </tr>
              </thead>
              <tbody id="tabelIzinBody" class="divide-y divide-slate-100">
                <tr><td colspan="6" class="p-4 text-center text-slate-400">Memuat data...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // Config Supabase menggunakan variabel 'db' agar aman dari konflik objek global
    const SUPABASE_URL = 'https://zcaqqybonpfishwkmffg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpjYXFxeWJvbnBmaXNod2ttZmZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2Mjc2NDgsImV4cCI6MjEwMzIwMzY0OH0.pBk5nwJI3u9n08onTNmvcOFxtCXQvv-ipYIu2f_iAiQ';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let listKaryawan = [];

    document.addEventListener("DOMContentLoaded", () => {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('inputTanggal').value = today;
      initData();
    });

    async function initData() {
      await fetchKaryawanOptions();
      await fetchDaftarIzin();
    }

    // Load Dropdown Karyawan - Menggunakan db
    async function fetchKaryawanOptions() {
      const { data, error } = await db.from('karyawan').select('id, nama, divisi').order('nama');
      if (error) return alert("Gagal memuat karyawan: " + error.message);
      
      listKaryawan = data || [];
      const select = document.getElementById('selectKaryawan');
      select.innerHTML = '<option value="">-- Pilih Karyawan --</option>';
      listKaryawan.forEach(k => {
        select.innerHTML += `<option value="${k.id}">${k.nama} (${k.divisi || '-'})</option>`;
      });
    }

    function toggleJamInput() {
      const status = document.getElementById('selectStatus').value;
      const sectionJam = document.getElementById('sectionJam');
      if (status === 'Hadir') {
        sectionJam.classList.remove('hidden');
      } else {
        sectionJam.classList.add('hidden');
      }
    }

    // Simpan data izin / edit absensi - Menggunakan db
    async function simpanIzinManual(e) {
      e.preventDefault();
      const karyawan_id = document.getElementById('selectKaryawan').value;
      const tanggal = document.getElementById('inputTanggal').value;
      const status = document.getElementById('selectStatus').value;
      const jam_masuk = document.getElementById('inputJamMasuk').value || null;
      const jam_pulang = document.getElementById('inputJamPulang').value || null;
      const keterangan = document.getElementById('inputKeterangan').value;

      let targetTable = 'absensi';
      let payload = {};

      if (status === 'Hadir') {
        targetTable = 'absensi';
        payload = {
          karyawan_id,
          tanggal,
          status,
          jam_masuk,
          jam_pulang,
          keterangan,
          is_verified: true
        };
      } else {
        targetTable = 'izin';
        payload = {
          karyawan_id,
          tanggal,
          status,
          keterangan,
          is_verified: true
        };
      }

      const { error } = await db
        .from(targetTable)
        .upsert([payload], { onConflict: 'karyawan_id, tanggal' });

      if (error) {
        alert("Gagal menyimpan data: " + error.message);
      } else {
        alert("Data persetujuan/edit absensi berhasil disimpan!");
        document.getElementById('formIzin').reset();
        document.getElementById('sectionJam').classList.add('hidden');
        fetchDaftarIzin();
      }
    }

    // Fetch Daftar Absensi/Izin - Menggunakan db
    async function fetchDaftarIzin() {
      const filterTgl = document.getElementById('filterTanggal').value;
      const tbody = document.getElementById('tabelIzinBody');

      let query = db
        .from('absensi')
        .select(`
          id,
          tanggal,
          status,
          jam_masuk,
          jam_pulang,
          keterangan,
          is_verified,
          karyawan ( nama, divisi )
        `)
        .order('tanggal', { ascending: false });

      if (filterTgl) {
        query = query.eq('tanggal', filterTgl);
      }

      const { data, error } = await query.limit(30);

      if (error) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-rose-500">Error: ${error.message}</td></tr>`;
        return;
      }

      if (!data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400">Belum ada catatan pengajuan/absensi.</td></tr>`;
        return;
      }

      tbody.innerHTML = data.map(row => {
        const namaKaryawan = row.karyawan?.nama || 'N/A';
        const divisi = row.karyawan?.divisi || '-';
        const badgeColor = 
          row.status === 'Hadir' ? 'bg-emerald-100 text-emerald-700' :
          row.status === 'Sakit' ? 'bg-amber-100 text-amber-700' :
          row.status === 'Izin' ? 'bg-blue-100 text-blue-700' : 'bg-purple-100 text-purple-700';

        return `
          <tr class="hover:bg-slate-50 transition">
            <td class="p-4 text-xs text-slate-600">${row.tanggal}</td>
            <td class="p-4 font-medium">${namaKaryawan} <span class="text-xs font-normal text-slate-400">(${divisi})</span></td>
            <td class="p-4">
              <span class="inline-block px-2 py-0.5 rounded text-xs font-semibold ${badgeColor}">
                ${row.status}
              </span>
            </td>
            <td class="p-4 text-xs text-slate-600">
              ${row.jam_masuk || '--:--'} - ${row.jam_pulang || '--:--'}
            </td>
            <td class="p-4 text-xs text-slate-500 max-w-xs truncate">${row.keterangan || '-'}</td>
            <td class="p-4 text-center">
              ${row.is_verified 
                ? '<span class="text-xs font-semibold text-emerald-600">✓ Disetujui</span>' 
                : `<button onclick="verifikasiLanjut('${row.id}')" class="px-2 py-1 bg-blue-600 text-white text-xs rounded hover:bg-blue-700">Setujui</button>`
              }
            </td>
          </tr>
        `;
      }).join('');
    }

    // Verifikasi cepat pengajuan izin karyawan - Menggunakan db
    async function verifikasiLanjut(absensiId) {
      const { error } = await db
        .from('absensi')
        .update({ is_verified: true })
        .eq('id', absensiId);

      if (error) alert("Gagal memperbarui verifikasi: " + error.message);
      else fetchDaftarIzin();
    }
  </script>
</body>
</html>
