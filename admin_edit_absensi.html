<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Edit Absensi & Izin • Smart Presence</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* ===== STYLE (sama kayak sebelumnya, tambahan untuk tabs & izin) ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            min-height: 100vh;
            color: #e2e8f0;
            padding: 20px;
        }
        body.light-mode { background: #f1f5f9; color: #1e293b; }
        
        .navbar {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 16px;
            max-width: 1400px;
            margin: 0 auto 20px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        body.light-mode .navbar { background: rgba(255,255,255,0.85); border-color: rgba(0,0,0,0.06); }
        
        .logo h2 {
            font-size: 20px;
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .logo span { font-size: 12px; color: #64748b; }
        
        .nav-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .nav-actions button {
            padding: 8px 16px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .nav-actions button:active { transform: scale(0.95); }
        .btn-logout { background: #ef4444; color: white; }
        .btn-logout:hover { background: #dc2626; }
        .btn-back { background: #6366f1; color: white; }
        .btn-back:hover { background: #4f46e5; }
        .btn-theme { background: #1e293b; color: #e2e8f0; }
        body.light-mode .btn-theme { background: #e2e8f0; color: #1e293b; }
        
        .container { max-width: 1200px; margin: 0 auto; }
        
        /* TABS */
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.04);
            border-radius: 14px;
            padding: 4px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        body.light-mode .tabs { background: #f1f5f9; border-color: #e2e8f0; }
        .tabs button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: #94a3b8;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }
        .tabs button:hover { color: white; }
        body.light-mode .tabs button:hover { color: #1e293b; }
        .tabs button.active {
            background: #a855f7;
            color: white;
            box-shadow: 0 4px 15px rgba(168,85,247,0.3);
        }
        body.light-mode .tabs button.active { background: #a855f7; color: white; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* ===== FORM CARD ===== */
        .form-card {
            background: rgba(255,255,255,0.04);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 20px;
        }
        body.light-mode .form-card { background: white; border-color: rgba(0,0,0,0.06); }
        
        .form-card .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        body.light-mode .form-card .info-bar { border-bottom-color: #e2e8f0; }
        .form-card .info-bar .nama {
            font-size: 20px;
            font-weight: 800;
            color: white;
        }
        body.light-mode .form-card .info-bar .nama { color: #1e293b; }
        .form-card .info-bar .tanggal {
            font-size: 14px;
            color: #94a3b8;
        }
        .form-card .info-bar .status-badge {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
        }
        .form-card .info-bar .status-badge.hadir { background: rgba(16,185,129,0.2); color: #34d399; }
        .form-card .info-bar .status-badge.telat { background: rgba(251,146,60,0.2); color: #fb923c; }
        .form-card .info-bar .status-badge.alfa { background: rgba(239,68,68,0.2); color: #f87171; }
        .form-card .info-bar .status-badge.izin { background: rgba(96,165,250,0.2); color: #60a5fa; }
        .form-card .info-bar .status-badge.libur { background: rgba(168,85,247,0.2); color: #a855f7; }
        .form-card .info-bar .status-badge.kosong { background: rgba(100,116,139,0.2); color: #94a3b8; }
        
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            color: #94a3b8;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .form-group select, .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.3);
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
        }
        body.light-mode .form-group select, body.light-mode .form-group input, body.light-mode .form-group textarea {
            background: #f1f5f9;
            color: #1e293b;
            border-color: #cbd5e1;
        }
        .form-group select:focus, .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #a855f7;
        }
        .form-group textarea { resize: vertical; min-height: 60px; }
        .form-group .form-hint {
            font-size: 11px;
            color: #64748b;
            margin-top: 4px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,0.06);
            flex-wrap: wrap;
        }
        body.light-mode .form-actions { border-top-color: #e2e8f0; }
        .form-actions .btn-save {
            padding: 12px 32px;
            background: #10b981;
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
        }
        .form-actions .btn-save:hover { background: #059669; }
        .form-actions .btn-delete {
            padding: 12px 32px;
            background: #ef4444;
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
        }
        .form-actions .btn-delete:hover { background: #dc2626; }
        .form-actions .btn-reset {
            padding: 12px 32px;
            background: #f59e0b;
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
        }
        .form-actions .btn-reset:hover { background: #d97706; }
        .form-actions .btn-cancel {
            padding: 12px 32px;
            background: #1e293b;
            border: none;
            border-radius: 10px;
            color: #94a3b8;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
        }
        body.light-mode .form-actions .btn-cancel { background: #e2e8f0; color: #64748b; }
        .form-actions .btn-cancel:hover { background: #334155; }
        body.light-mode .form-actions .btn-cancel:hover { background: #cbd5e1; }
        
        /* ===== TABLE ===== */
        .table-container {
            background: rgba(255,255,255,0.04);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.06);
            overflow-x: auto;
        }
        body.light-mode .table-container { background: white; border-color: rgba(0,0,0,0.06); }
        .table-container h3 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.06); }
        body.light-mode th, body.light-mode td { border-bottom-color: #e2e8f0; }
        
        th {
            font-weight: 600;
            color: #94a3b8;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: sticky;
            top: 0;
            background: rgba(15,23,42,0.95);
        }
        body.light-mode th { background: #f8fafc; color: #64748b; }
        
        td .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        td .status-badge.pending { background: rgba(245,158,11,0.2); color: #f59e0b; }
        td .status-badge.disetujui { background: rgba(16,185,129,0.2); color: #34d399; }
        td .status-badge.ditolak { background: rgba(239,68,68,0.2); color: #f87171; }
        
        td .btn-setuju {
            padding: 4px 12px;
            background: #10b981;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }
        td .btn-setuju:hover { background: #059669; }
        td .btn-tolak {
            padding: 4px 12px;
            background: #ef4444;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }
        td .btn-tolak:hover { background: #dc2626; }
        td .btn-edit-small {
            padding: 4px 12px;
            background: #6366f1;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }
        td .btn-edit-small:hover { background: #4f46e5; }
        
        .filter-card {
            background: rgba(255,255,255,0.04);
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.06);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }
        body.light-mode .filter-card { background: white; border-color: rgba(0,0,0,0.06); }
        .filter-card label { font-size: 13px; font-weight: 600; color: #94a3b8; }
        .filter-card select, .filter-card input {
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.3);
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            min-width: 150px;
        }
        body.light-mode .filter-card select, body.light-mode .filter-card input {
            background: #f1f5f9;
            color: #1e293b;
            border-color: #cbd5e1;
        }
        .filter-card select:focus, .filter-card input:focus {
            outline: none;
            border-color: #a855f7;
        }
        .filter-card .btn-primary {
            padding: 10px 24px;
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
        }
        .filter-card .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(168,85,247,0.4); }
        .filter-card .btn-refresh {
            padding: 10px 20px;
            background: #6366f1;
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
        }
        .filter-card .btn-refresh:hover { background: #4f46e5; }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #64748b;
        }
        .empty-state .icon { font-size: 48px; display: block; margin-bottom: 12px; color: #475569; }
        .empty-state h3 { font-size: 18px; font-weight: 700; color: white; margin-bottom: 4px; }
        body.light-mode .empty-state h3 { color: #1e293b; }
        .empty-state p { font-size: 13px; }
        
        .loading-text { text-align: center; color: #64748b; padding: 20px 0; font-size: 14px; }
        
        .toast-custom {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: white;
            padding: 14px 28px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 14px;
            z-index: 9999;
            border-left: 4px solid #10b981;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            animation: slideUp 0.3s ease;
            max-width: 90%;
            font-family: 'Inter', sans-serif;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(30px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        
        /* MODAL TOLAK */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .modal-overlay.active { display: flex; }
        
        .modal-card {
            background: #1e293b;
            border-radius: 24px;
            padding: 32px;
            width: 90%;
            max-width: 480px;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        body.light-mode .modal-card { background: white; border-color: rgba(0,0,0,0.06); }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .modal-header h2 { font-size: 20px; font-weight: 700; color: #f87171; }
        .modal-close {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 24px;
            cursor: pointer;
        }
        .modal-close:hover { color: white; }
        
        .modal-footer {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,0.06);
            justify-content: flex-end;
        }
        .modal-footer button {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: all 0.2s;
        }
        .modal-footer button:active { transform: scale(0.95); }
        .btn-danger-modal { background: #ef4444; color: white; }
        .btn-danger-modal:hover { background: #dc2626; }
        .btn-cancel { background: #1e293b; color: #94a3b8; }
        .btn-cancel:hover { background: #334155; }
        body.light-mode .btn-cancel { background: #e2e8f0; color: #64748b; }
        body.light-mode .btn-cancel:hover { background: #cbd5e1; }
        
        @media (max-width: 768px) {
            .navbar { flex-wrap: wrap; gap: 10px; padding: 12px 16px; }
            .filter-card { flex-direction: column; align-items: stretch; }
            .filter-card select, .filter-card input { width: 100%; min-width: auto; }
            .form-row { grid-template-columns: 1fr; }
            .form-actions { flex-direction: column; }
            .form-actions button { width: 100%; }
            .nav-actions { flex-wrap: wrap; }
            .tabs { flex-direction: column; }
            .tabs button { text-align: center; }
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="logo">
        <h2>📋 RelawanTrack</h2>
        <span>Edit Absensi & Izin</span>
    </div>
    <div class="nav-actions">
        <button class="btn-back" onclick="window.location.href='admin_dashboard.html'">
            <i class="fas fa-arrow-left"></i> Dashboard
        </button>
        <button class="btn-theme" onclick="toggleTheme()">
            <i class="fas fa-moon" id="themeIcon"></i>
        </button>
        <span id="adminName" style="font-weight:600;font-size:14px;">Admin</span>
        <button class="btn-logout" onclick="doLogout()">
            <i class="fas fa-sign-out-alt"></i> Keluar
        </button>
    </div>
</nav>

<div class="container">

    <!-- TABS -->
    <div class="tabs">
        <button class="active" onclick="switchTab('tabAbsensi', this)">📋 Absensi</button>
        <button onclick="switchTab('tabIzin', this)">📝 Manajemen Izin</button>
    </div>

    <!-- ============================================================
         TAB 1: ABSENSI
         ============================================================ -->
    <div class="tab-content active" id="tabAbsensi">

        <div class="filter-card">
            <label><i class="fas fa-user"></i> Karyawan:</label>
            <select id="pilihKaryawan">
                <option value="">-- Pilih Karyawan --</option>
            </select>
            
            <label><i class="fas fa-calendar-alt"></i> Tanggal:</label>
            <input type="date" id="pilihTanggal">
            
            <button class="btn-primary" onclick="loadAbsensi()">
                <i class="fas fa-search"></i> Cari
            </button>
        </div>

        <div id="formContainer">
            <div class="empty-state">
                <span class="icon">📝</span>
                <h3>Pilih Karyawan & Tanggal</h3>
                <p>Pilih karyawan dan tanggal di atas untuk mulai edit absensi</p>
            </div>
        </div>
    </div>

    <!-- ============================================================
         TAB 2: MANAJEMEN IZIN
         ============================================================ -->
    <div class="tab-content" id="tabIzin">

        <div class="filter-card">
            <label><i class="fas fa-user"></i> Karyawan:</label>
            <select id="filterIzinKaryawan">
                <option value="">Semua Karyawan</option>
            </select>
            
            <label><i class="fas fa-tag"></i> Status:</label>
            <select id="filterIzinStatus">
                <option value="">Semua Status</option>
                <option value="pending">⏳ Pending</option>
                <option value="disetujui">✅ Disetujui</option>
                <option value="ditolak">❌ Ditolak</option>
            </select>
            
            <button class="btn-primary" onclick="loadIzin()">
                <i class="fas fa-search"></i> Tampilkan
            </button>
            <button class="btn-refresh" onclick="refreshIzin()">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>

        <!-- Pending Izin -->
        <div class="table-container" style="margin-bottom:20px;border-color:rgba(245,158,11,0.3);">
            <h3><i class="fas fa-clock" style="color:#f59e0b;"></i> Pending Izin <span id="pendingCount" style="font-size:13px;color:#f59e0b;font-weight:400;">(0)</span></h3>
            <div id="pendingIzinWrapper">
                <div class="loading-text"><i class="fas fa-spinner fa-pulse"></i> Memuat data...</div>
            </div>
        </div>

        <!-- Riwayat Izin -->
        <div class="table-container">
            <h3><i class="fas fa-history" style="color:#a855f7;"></i> Riwayat Izin</h3>
            <div id="riwayatIzinWrapper">
                <div class="loading-text"><i class="fas fa-spinner fa-pulse"></i> Memuat data...</div>
            </div>
        </div>
    </div>

</div>

<!-- MODAL TOLAK IZIN -->
<div class="modal-overlay" id="modalTolakIzin">
    <div class="modal-card">
        <div class="modal-header">
            <h2><i class="fas fa-times-circle"></i> Tolak Izin</h2>
            <button class="modal-close" onclick="closeModalTolak()">&times;</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="tolakIzinId">
            
            <div class="form-group">
                <label>Karyawan</label>
                <input type="text" id="tolakNama" disabled style="opacity:0.7;">
            </div>
            <div class="form-group">
                <label>Tanggal Izin</label>
                <input type="text" id="tolakTanggal" disabled style="opacity:0.7;">
            </div>
            <div class="form-group">
                <label>Alasan Izin</label>
                <input type="text" id="tolakAlasan" disabled style="opacity:0.7;">
            </div>
            <div class="form-group">
                <label>Alasan Penolakan <span style="color:#ef4444;">*</span></label>
                <textarea id="tolakAlasanPenolakan" placeholder="Masukkan alasan penolakan izin..." rows="3"></textarea>
                <div class="form-hint">Alasan ini akan dikirim ke karyawan</div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-cancel" onclick="closeModalTolak()">Batal</button>
            <button class="btn-danger-modal" onclick="confirmTolakIzin()">
                <i class="fas fa-times"></i> Tolak Izin
            </button>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // KONFIGURASI SUPABASE

    function getTodayIndonesia() {
        var now = new Date();
        var offset = 7 * 60 * 60 * 1000;
        return new Date(now.getTime() + offset).toISOString().split('T')[0];
    }

    function formatTanggalDisplay(dateStr) {
        var d = new Date(dateStr + 'T00:00:00');
        var bulan = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
        var hari = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
        return hari[d.getDay()] + ', ' + d.getDate() + ' ' + bulan[d.getMonth()] + ' ' + d.getFullYear();
    }

        document.getElementById('pilihTanggal').value = getTodayIndonesia();

    function showToast(msg, type) {
        type = type || 'success';
        var existing = document.querySelector('.toast-custom');
        if (existing) existing.remove();
        var toast = document.createElement('div');
        toast.className = 'toast-custom';
        var colors = { success: '#10b981', error: '#ef4444', warning: '#f59e0b', info: '#3b82f6' };
        toast.style.borderLeftColor = colors[type] || '#10b981';
        var icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
        toast.innerHTML = (icons[type] || 'ℹ️') + ' ' + msg;
        document.body.appendChild(toast);
        setTimeout(function() {
            toast.style.opacity = '0';
            toast.style.transform = 'translateX(-50%) translateY(20px)';
            setTimeout(function() { toast.remove(); }, 300);
        }, 3000);
    }

    // ============================================================
    // TAB 1: SIMPAN ABSENSI
    // ============================================================
    async function simpanAbsensi() {
        var karyawanId = document.getElementById('pilihKaryawan').value;
        var tanggal = document.getElementById('pilihTanggal').value;
        var status = document.getElementById('editStatus').value;
        var jamMasuk = document.getElementById('editJamMasuk').value || null;
        var jamPulang = document.getElementById('editJamPulang').value || null;

        if (!karyawanId || !tanggal) {
            showToast('Data tidak lengkap!', 'error');
            return;
        }

        if (status === 'hadir' || status === 'telat') {
            if (!jamMasuk) { showToast('Jam masuk harus diisi!', 'error'); return; }
        }
        if (status === 'pulang') {
            if (!jamMasuk || !jamPulang) { showToast('Jam masuk dan pulang harus diisi!', 'error'); return; }
        }
        if (status === 'alfa' || status === 'izin' || status === 'libur') {
            jamMasuk = null;
            jamPulang = null;
        }

        var payload = {
            karyawan_id: karyawanId,
            tanggal: tanggal,
            jam_masuk: jamMasuk,
            jam_pulang: jamPulang,
            status: status === 'pulang' ? 'pulang' : (status === 'izin' ? 'izin' : 'hadir')
        };

        try {
            showToast('🔄 Menyimpan...', 'info');

            var method = 'POST';
            var url = SUPABASE_URL + '/rest/v1/absensi';
            var body = payload;

            if (currentData) {
                method = 'PATCH';
                url = SUPABASE_URL + '/rest/v1/absensi?id=eq.' + currentData.id;
                body = {
                    jam_masuk: jamMasuk,
                    jam_pulang: jamPulang,
                    status: status === 'pulang' ? 'pulang' : (status === 'izin' ? 'izin' : 'hadir')
                };
            }

            var response = await fetch(url, {
                method: method,
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body)
            });

            if (response.ok) {
                showToast('✅ Data berhasil disimpan!', 'success');
                loadAbsensi();
            } else {
                var text = await response.text();
                showToast('❌ Gagal: ' + text, 'error');
            }
        } catch(e) {
            console.error('Save error:', e);
            showToast('❌ Gagal koneksi ke server!', 'error');
        }
    }

    function resetForm() {
        if (currentData) {
            document.getElementById('editStatus').value = currentStatusFromData(currentData);
            document.getElementById('editJamMasuk').value = currentData.jam_masuk || '';
            document.getElementById('editJamPulang').value = currentData.jam_pulang || '';
        } else {
            document.getElementById('editStatus').value = 'alfa';
            document.getElementById('editJamMasuk').value = '';
            document.getElementById('editJamPulang').value = '';
        }
        showToast('🔄 Form direset', 'info');
    }

    function currentStatusFromData(d) {
        if (d.status === 'izin') return 'izin';
        if (d.jam_masuk && d.jam_pulang) return 'pulang';
        if (d.jam_masuk) {
            var target = currentKaryawan?.jam_masuk || '08:00';
            return d.jam_masuk <= target ? 'hadir' : 'telat';
        }
        return 'alfa';
    }

        var wrapperPending = document.getElementById('pendingIzinWrapper');

                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }

        document.getElementById('tolakTanggal').value = formatTanggalDisplay(tanggal);
        document.getElementById('tolakAlasan').value = alasan;
        document.getElementById('tolakAlasanPenolakan').value = '';
        document.getElementById('modalTolakIzin').classList.add('active');
    }

    function closeModalTolak() {
        document.getElementById('modalTolakIzin').classList.remove('active');
        tolakIzinId = null;
    }

    async function confirmTolakIzin() {
        var id = document.getElementById('tolakIzinId').value;
        var alasanPenolakan = document.getElementById('tolakAlasanPenolakan').value.trim();

        if (!alasanPenolakan) {
            showToast('Masukkan alasan penolakan!', 'error');
            return;
        }

        try {
            var response = await fetch(
                SUPABASE_URL + '/rest/v1/izin?id=eq.' + id,
                {
                    method: 'PATCH',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        status: 'ditolak',
                        alasan_tolak: alasanPenolakan,
                        updated_at: new Date().toISOString()
                    })
                }
            );

            if (response.ok) {
                showToast('❌ Izin ditolak!', 'warning');
                closeModalTolak();

                // Ambil data izin untuk kirim notifikasi
                var izinData = allIzin.find(function(item) { return item.id === parseInt(id); });
                if (izinData) {
                    var nama = izinData.karyawan_id?.nama || 'Karyawan';
                    await sendTelegram('📢 <b>IZIN DITOLAK</b>\n👤 ' + nama + '\n📅 ' + (izinData.tanggal || '-') + '\n📝 ' + (izinData.alasan || '-') + '\n❌ Alasan: ' + alasanPenolakan);
                }

                loadIzin();
            } else {
                var text = await response.text();
                showToast('❌ Gagal: ' + text, 'error');
            }
        } catch(e) {
            showToast('❌ Gagal koneksi!', 'error');
        }
    }

    // ============================================================
    // REFRESH IZIN
    // ============================================================
    function refreshIzin() {
        showToast('🔄 Memperbarui data...', 'info');
        loadIzin();
        setTimeout(function() {
            showToast('✅ Data diperbarui!', 'success');
        }, 500);
    }

    // ============================================================
    // CEK SESSION STORAGE (dari admin_riwayat)
    // ============================================================
    function checkEditRedirect() {
        var karyawanId = sessionStorage.getItem('edit_karyawan_id');
        var tanggal = sessionStorage.getItem('edit_tanggal');
        if (karyawanId && tanggal) {
            sessionStorage.removeItem('edit_karyawan_id');
            sessionStorage.removeItem('edit_tanggal');
            document.getElementById('pilihKaryawan').value = karyawanId;
            document.getElementById('pilihTanggal').value = tanggal;
            loadAbsensi();
        }
    }

    // ============================================================
    // INIT
    // ============================================================
    loadKaryawan();
    setTimeout(function() {
        checkEditRedirect();
    }, 300);

    // Set default di tab izin
    document.getElementById('filterIzinStatus').value = '';

    console.log('✏️ Edit Absensi & Izin loaded!');
</script>

</body>
</html>
