<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Login • Smart Presence</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 20% 30%, #0f172a, #020617);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 40px 32px;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }
        .logo-area { text-align: center; margin-bottom: 32px; }
        .logo-icon {
            width: 72px; height: 72px;
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            border-radius: 28px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 10px 25px rgba(168, 85, 247, 0.3);
        }
        .logo-icon i { font-size: 32px; color: white; }
        h1 {
            font-size: 28px; font-weight: 800; color: white;
            letter-spacing: -0.5px;
        }
        .subtitle { color: #64748b; font-size: 14px; font-weight: 500; }
        .badge-admin {
            display: inline-block;
            background: rgba(168, 85, 247, 0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            color: #a855f7;
            margin-top: 10px;
        }
        .input-group {
            margin-bottom: 20px; position: relative;
        }
        .input-group i {
            position: absolute; left: 20px; top: 50%;
            transform: translateY(-50%);
            color: #475569; font-size: 18px;
        }
        .input-group input {
            width: 100%; padding: 16px 20px 16px 54px;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 28px;
            font-size: 15px; font-family: 'Inter', sans-serif;
            color: white; outline: none;
            transition: all 0.2s;
        }
        .input-group input:focus {
            border-color: #a855f7;
            background: rgba(15,23,42,0.8);
            box-shadow: 0 0 0 4px rgba(168,85,247,0.25);
        }
        .input-group input::placeholder { color: #475569; }
        .btn-login {
            width: 100%; padding: 18px;
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            border: none; border-radius: 28px;
            font-size: 16px; font-weight: 800; color: white;
            cursor: pointer; transition: all 0.2s;
            box-shadow: 0 10px 20px -5px rgba(168,85,247,0.4);
            font-family: 'Inter', sans-serif;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 12px 24px -3px rgba(168,85,247,0.5); }
        .btn-login:active { transform: translateY(1px); }
        .btn-login:disabled {
            background: #1e293b; color: #475569;
            box-shadow: none; transform: none; cursor: not-allowed;
            opacity: 0.7;
        }
        .spinner {
            display: inline-block; width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white; border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 8px; vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .toast {
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%);
            background: rgba(15,23,42,0.9);
            backdrop-filter: blur(20px);
            padding: 14px 28px; border-radius: 40px;
            color: white; font-weight: 600; font-size: 14px;
            z-index: 1000; animation: slideUp 0.3s ease;
            box-shadow: 0 10px 20px -5px rgba(0,0,0,0.5);
            max-width: 90%; white-space: nowrap;
            border-left: 4px solid #a855f7;
            font-family: 'Inter', sans-serif;
        }
        .toast.error { border-left-color: #ef4444; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(30px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        @media (max-width: 480px) {
            .glass-card { padding: 30px 20px; border-radius: 32px; }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="glass-card">
        <div class="logo-area">
            <div class="logo-icon"><i class="fas fa-shield-alt"></i></div>
            <h1>Admin Panel</h1>
            <div class="subtitle">Akses Khusus Pengelola</div>
            <div class="badge-admin"><i class="fas fa-lock"></i> Terenkripsi</div>
        </div>

        <div class="input-group">
            <i class="fas fa-user-cog"></i>
            <input type="text" id="username" placeholder="Username Admin" autocomplete="off">
        </div>

        <div class="input-group">
            <i class="fas fa-key"></i>
            <input type="password" id="password" placeholder="Password">
        </div>

        <button class="btn-login" onclick="doAdminLogin()">
            <span id="btnText">MASUK DASHBOARD</span>
        </button>
    </div>

    <script>
        // ============================================================
        // KONFIGURASI - GANTI DENGAN KREDENSIAL ADMIN
        // ============================================================
        const ADMIN_CREDENTIALS = {
            username: 'admin',
            password: 'relawan123'
        };

        function showToast(msg, isError = false) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            
            const toast = document.createElement('div');
            toast.className = 'toast' + (isError ? ' error' : '');
            toast.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-triangle' : 'fa-check-circle'}"></i> ${msg}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        async function doAdminLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.querySelector('.btn-login');
            const btnText = document.getElementById('btnText');

            if (!username || !password) {
                showToast('Isi username dan password!', true);
                return;
            }

            btn.disabled = true;
            btnText.innerHTML = '<span class="spinner"></span> Verifikasi...';

            setTimeout(() => {
                if (username === ADMIN_CREDENTIALS.username && password === ADMIN_CREDENTIALS.password) {
                    localStorage.setItem('admin_logged_in', 'true');
                    localStorage.setItem('admin_username', username);
                    showToast('✅ Login berhasil! Mengarahkan...');
                    setTimeout(() => {
                        window.location.href = 'admin_dashboard.html';
                    }, 800);
                } else {
                    showToast('❌ Username atau password salah!', true);
                    btn.disabled = false;
                    btnText.innerHTML = 'MASUK DASHBOARD';
                }
            }, 500);
        }

        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') doAdminLogin();
            });
        });
    </script>
</body>
</html>
