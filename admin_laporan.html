    var SUPABASE_URL = 'https://zcaqqybonpfishwkmffg.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpjYXFxeWJvbnBmaXNod2ttZmZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2Mjc2NDgsImV4cCI6MjEwMzIwMzY0OH0.pBk5nwJI3u9n08onTNmvcOFxtCXQvv-ipYIu2f_iAiQ';

    // ============================================================
    // CEK LOGIN
    // ============================================================
    if (!localStorage.getItem('admin_logged_in')) {
        window.location.href = 'admin_login.html';
    }
    document.getElementById('adminName').textContent = localStorage.getItem('admin_username') || 'Admin';

    // ============================================================
    // VARIABLES
    // ============================================================
    var allData = [];
    var dateList = [];
    var hariLiburMap = {};

    // ⭐ URUTAN DIVISI YANG LO MAU
    var urutanDivisi = [
        'Aslap',
        'Kepala Chef',
        'Pengolahan',
        'Persiapan',
        'Pemorsian',
        'Cuci Foodtray',
        'Distribusi',
        'Satpam',
        'Kebersihan'
    ];

    // ⭐ MAPPING DIVISI (biar konsisten dari database)
    var mappingDivisi = {
        'Asisten Lapangan': 'Aslap',
        'Asisten lapangan': 'Aslap',
        'aslap': 'Aslap',
        'ASLAP': 'Aslap',
        'Kepala Chef': 'Kepala Chef',
        'Kepala chef': 'Kepala Chef',
        'Pengolahan': 'Pengolahan',
        'pengolahan': 'Pengolahan',
        'Persiapan': 'Persiapan',
        'persiapan': 'Persiapan',
        'Pemorsian': 'Pemorsian',
        'pemorsian': 'Pemorsian',
        'Cuci Foodtray': 'Cuci Foodtray',
        'Cuci foodtray': 'Cuci Foodtray',
        'cuci foodtray': 'Cuci Foodtray',
        'Distribusi': 'Distribusi',
        'distribusi': 'Distribusi',
        'Satpam': 'Satpam',
        'satpam': 'Satpam',
        'Kebersihan': 'Kebersihan',
        'kebersihan': 'Kebersihan'
    };

    // ============================================================
    // FUNGSI TANGGAL
    // ============================================================
    function getTodayIndonesia() {
        var now = new Date();
        var offset = 7 * 60 * 60 * 1000;
        return new Date(now.getTime() + offset).toISOString().split('T')[0];
    }

    function getDateIndonesia(date) {
        var offset = 7 * 60 * 60 * 1000;
        return new Date(date.getTime() + offset).toISOString().split('T')[0];
    }

    function parseDateIndonesia(dateStr) {
        var parts = dateStr.split('-');
        return new Date(parts[0], parts[1] - 1, parts[2]);
    }

    function setDefaultDates() {
        var todayStr = getTodayIndonesia();
        var end = todayStr;
        var today = new Date();
        var offset = 7 * 60 * 60 * 1000;
        var localToday = new Date(today.getTime() + offset);
        var startDate = new Date(localToday);
        startDate.setDate(startDate.getDate() - 29);
        var start = getDateIndonesia(startDate);
        document.getElementById('startDate').value = start;
        document.getElementById('endDate').value = end;
    }
    setDefaultDates();

    // ============================================================
    // UPDATE LIVE LOGO STYLE
    // ============================================================
    function updateLogoStyle() {
        var url = document.getElementById('logoUrlInput').value.trim();
        var size = document.getElementById('logoSizeRange').value;
        var pos = document.getElementById('logoPosRange').value;

        document.getElementById('sizeVal').textContent = size;
        document.getElementById('posVal').textContent = pos;

        var logoContainers = document.querySelectorAll('.logo-container');
        var logoImgs = document.querySelectorAll('.logo-img');

        logoContainers.forEach(function(container) {
            container.style.left = pos + 'px';
        });

        logoImgs.forEach(function(img) {
            img.style.height = size + 'px';
            if (url) {
                img.style.display = 'block';
                img.src = url;
            } else {
                img.style.display = 'none';
            }
        });
    }

    function resetLogoConfig() {
        document.getElementById('logoSizeRange').value = 65;
        document.getElementById('logoPosRange').value = 25;
        updateLogoStyle();
    }

    // ============================================================
    // THEME
    // ============================================================
    function toggleTheme() {
        document.body.classList.toggle('light-mode');
        var icon = document.getElementById('themeIcon');
        icon.className = document.body.classList.contains('light-mode') ? 'fas fa-sun' : 'fas fa-moon';
    }

    // ============================================================
    // TOAST
    // ============================================================
    function showToast(msg, type) {
        type = type || 'success';
        var existing = document.querySelector('.toast-custom');
        if (existing) existing.remove();
        var toast = document.createElement('div');
        toast.className = 'toast-custom';
        var colors = { success: '#10b981', error: '#ef4444', warning: '#f59e0b', info: '#3b82f6' };
        toast.style.borderLeftColor = colors[type] || '#10b981';
        var icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
        toast.innerHTML = (icons[type] || 'ℹ️') + ' ' + msg;
        document.body.appendChild(toast);
        setTimeout(function() {
            toast.style.opacity = '0';
            toast.style.transform = 'translateX(-50%) translateY(20px)';
            setTimeout(function() { toast.remove(); }, 300);
        }, 3000);
    }

    // ============================================================
    // LOGOUT
    // ============================================================
    function doLogout() {
        if (confirm('Yakin ingin keluar?')) {
            localStorage.removeItem('admin_logged_in');
            localStorage.removeItem('admin_username');
            window.location.href = 'admin_login.html';
        }
    }

    // ============================================================
    // LOAD HARI LIBUR
    // ============================================================
    async function loadHariLibur() {
        try {
            var response = await fetch(
                SUPABASE_URL + '/rest/v1/hari_libur?select=tanggal,divisi',
                {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
                    }
                }
            );
            var data = await response.json();
            hariLiburMap = {};
            data.forEach(function(item) {
                var key = item.tanggal + '|' + item.divisi;
                hariLiburMap[key] = true;
            });
        } catch(e) {
            hariLiburMap = {};
        }
    }

    function isTanggalLibur(tanggal, divisi) {
        var key = tanggal + '|' + divisi;
        return hariLiburMap[key] || false;
    }

    // ============================================================
    // LOAD FILTER OPTIONS - ⭐ UDAH DIPERBAIKI
    // ============================================================
    async function loadFilterOptions() {
        try {
            var response = await fetch(SUPABASE_URL + '/rest/v1/karyawan?select=divisi', {
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
            });
            var karyawan = await response.json();

            var divisiSet = new Set();
            karyawan.forEach(function(k) {
                if (k.divisi) {
                    // Mapping divisi ke format standar
                    var mapped = mappingDivisi[k.divisi] || k.divisi;
                    divisiSet.add(mapped);
                }
            });

            // Urutkan berdasarkan urutanDivisi
            var sortedDivisi = [];
            urutanDivisi.forEach(function(d) {
                if (divisiSet.has(d)) {
                    sortedDivisi.push(d);
                    divisiSet.delete(d);
                }
            });
            divisiSet.forEach(function(d) {
                sortedDivisi.push(d);
            });

            var select = document.getElementById('filterDivisi');
            select.innerHTML = '<option value="">Semua Divisi</option>';
            sortedDivisi.forEach(function(d) {
                select.innerHTML += '<option value="' + d + '">' + d + '</option>';
            });

        } catch(e) {
            console.error('Gagal load filter:', e);
        }
    }
    loadFilterOptions();

    // ============================================================
    // LOAD LAPORAN - ⭐ UDAH DIPERBAIKI
    // ============================================================
    async function loadLaporan() {
        var start = document.getElementById('startDate').value;
        var end = document.getElementById('endDate').value;
        var divisiFilter = document.getElementById('filterDivisi').value;

        if (!start || !end) {
            showToast('Pilih tanggal dulu!', 'warning');
            return;
        }

        var container = document.getElementById('laporanContainer');
        container.innerHTML = '<div class="loading-text"><i class="fas fa-spinner fa-pulse"></i> Memuat data...</div>';

        try {
            await loadHariLibur();

            var karyawanQuery = SUPABASE_URL + '/rest/v1/karyawan?select=id,nama,divisi,jam_masuk,jam_pulang';
            if (divisiFilter) {
                karyawanQuery += '&divisi=eq.' + encodeURIComponent(divisiFilter);
            }
            karyawanQuery += '&order=nama';

            var karyawanRes = await fetch(karyawanQuery, {
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
            });
            var karyawan = await karyawanRes.json();

            if (!karyawan || karyawan.length === 0) {
                container.innerHTML = '<div class="empty-text"><i class="fas fa-inbox"></i> Tidak ada karyawan</div>';
                return;
            }

            var absenRes = await fetch(
                SUPABASE_URL + '/rest/v1/absensi?select=*&tanggal=gte.' + start + '&tanggal=lte.' + end,
                {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
                }
            );
            var absensi = await absenRes.json();

            var absenMap = {};
            absensi.forEach(function(a) {
                var key = a.karyawan_id + '|' + a.tanggal;
                absenMap[key] = a;
            });

            dateList = [];
            var dStart = parseDateIndonesia(start);
            var dEnd = parseDateIndonesia(end);
            for (var d = new Date(dStart); d <= dEnd; d.setDate(d.getDate() + 1)) {
                dateList.push(getDateIndonesia(d));
            }

            allData = [];
            var totalMasuk = 0, totalAlfa = 0, totalIzin = 0;

            karyawan.forEach(function(k) {
                // ⭐ Mapping divisi ke format standar
                var divisiMapped = mappingDivisi[k.divisi] || k.divisi || '-';
                
                var row = {
                    id: k.id,
                    nama: k.nama || k.id,
                    divisi: divisiMapped,
                    divisiAsli: k.divisi || '-',
                    targetMasuk: k.jam_masuk || '08:00',
                    targetPulang: k.jam_pulang || '17:00',
                    dates: [],
                    masuk: 0,
                    alfa: 0,
                    izin: 0
                };

                dateList.forEach(function(tgl) {
                    var isLibur = isTanggalLibur(tgl, divisiMapped);
                    var key = k.id + '|' + tgl;
                    var abs = absenMap[key];
                    
                    var status = 'alfa';
                    var statusLabel = '❌';
                    var jamMasuk = '-';
                    var jamPulang = '-';

                    if (isLibur) {
                        status = 'libur';
                        statusLabel = '🔵';
                    } else if (abs) {
                        jamMasuk = abs.jam_masuk || '-';
                        jamPulang = abs.jam_pulang || '-';
                        
                        if (abs.status === 'izin') {
                            status = 'izin';
                            statusLabel = '📝';
                            row.izin++;
                            totalIzin++;
                        } else if (jamMasuk !== '-') {
                            status = 'hadir';
                            statusLabel = '✅';
                            row.masuk++;
                            totalMasuk++;
                        } else {
                            status = 'alfa';
                            statusLabel = '❌';
                            row.alfa++;
                            totalAlfa++;
                        }
                    } else {
                        status = 'alfa';
                        statusLabel = '❌';
                        row.alfa++;
                        totalAlfa++;
                    }
                    
                    row.dates.push({
                        tanggal: tgl,
                        status: status,
                        statusLabel: statusLabel,
                        jamMasuk: jamMasuk,
                        jamPulang: jamPulang,
                        isLibur: isLibur
                    });
                });

                allData.push(row);
            });

            // ⭐ URUTKAN BERDASARKAN URUTAN DIVISI + NAMA ASISTEN LAPANGAN DI ATAS
            allData.sort(function(a, b) {
                // Cek apakah Asisten Lapangan (LUKI & IKHWANUL)
                var isAslapA = a.divisi === 'Aslap';
                var isAslapB = b.divisi === 'Aslap';
                
                // Kalo dua-duanya Aslap, urutkan berdasarkan nama (LUKI dulu)
                if (isAslapA && isAslapB) {
                    if (a.nama.includes('LUKI') && !b.nama.includes('LUKI')) return -1;
                    if (!a.nama.includes('LUKI') && b.nama.includes('LUKI')) return 1;
                    return a.nama.localeCompare(b.nama);
                }
                
                // Aslap selalu di atas
                if (isAslapA && !isAslapB) return -1;
                if (!isAslapA && isAslapB) return 1;
                
                // Urutkan berdasarkan urutanDivisi
                var indexA = urutanDivisi.indexOf(a.divisi);
                var indexB = urutanDivisi.indexOf(b.divisi);
                if (indexA === -1) indexA = 999;
                if (indexB === -1) indexB = 999;
                return indexA - indexB;
            });

            renderLaporan(totalMasuk, totalAlfa, totalIzin);

        } catch(e) {
            console.error('Error:', e);
            container.innerHTML = '<div class="empty-text"><i class="fas fa-exclamation-triangle"></i> Gagal memuat data</div>';
            showToast('Gagal memuat data!', 'error');
        }
    }

    // ============================================================
    // RENDER LAPORAN
    // ============================================================
    function renderLaporan(totalMasuk, totalAlfa, totalIzin) {
        var container = document.getElementById('laporanContainer');

        var start = document.getElementById('startDate').value;
        var end = document.getElementById('endDate').value;
        var divisiFilter = document.getElementById('filterDivisi').value;
        var logoUrl = document.getElementById('logoUrlInput').value.trim();
        var logoSize = document.getElementById('logoSizeRange').value;
        var logoPos = document.getElementById('logoPosRange').value;

        var dStart = parseDateIndonesia(start);
        var dEnd = parseDateIndonesia(end);
        var bulan = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
        var periode = dStart.getDate() + ' ' + bulan[dStart.getMonth()] + ' ' + dStart.getFullYear() + ' - ' + dEnd.getDate() + ' ' + bulan[dEnd.getMonth()] + ' ' + dEnd.getFullYear();

        var now = new Date();
        var tglCetak = now.getDate() + ' ' + bulan[now.getMonth()] + ' ' + now.getFullYear();

        var totalKaryawan = allData.length;

        // Build table HTML
        var tableHtml = '<table><thead><tr>';
        tableHtml += '<th>No</th><th>Nama</th><th>Divisi</th>';

        dateList.forEach(function(tgl) {
            var d = parseDateIndonesia(tgl);
            tableHtml += '<th>' + d.getDate() + '/' + (d.getMonth()+1) + '</th>';
        });

        tableHtml += '<th>Total</th></tr></thead><tbody>';

        allData.forEach(function(row, idx) {
            tableHtml += '<tr>';
            tableHtml += '<td>' + (idx + 1) + '</td>';
            tableHtml += '<td style="text-align:left;font-weight:600;">' + row.nama + '</td>';
            tableHtml += '<td>' + row.divisi + '</td>';

            row.dates.forEach(function(d) {
                var cls = d.status;
                var label = d.statusLabel;
                tableHtml += '<td><span class="status-label ' + cls + '">' + label + '</span></td>';
            });

            var total = row.masuk + row.izin;
            tableHtml += '<td><strong>' + total + '</strong></td>';
            tableHtml += '</tr>';
        });

        tableHtml += '</tbody></table>';

        var html = '';
        html += '<div class="laporan-preview" id="laporanContent">';

        html += '<div class="kop">';
        html += '<div class="header-wrapper">';
        
        html += '<div class="logo-container" style="left: ' + logoPos + 'px;">';
        if (logoUrl) {
            html += '<img src="' + logoUrl + '" alt="Logo" class="logo-img" style="height: ' + logoSize + 'px;" onerror="this.style.display=\'none\'">';
        } else {
            html += '<img src="" alt="" class="logo-img" style="display:none; height: ' + logoSize + 'px;">';
        }
        html += '</div>';

        html += '<div class="teks">';
        html += '<div class="instansi">SATUAN PELAYANAN PEMENUHAN GIZI</div>';
        html += '<div class="instansi-2">SPPG KEDIRI PARE PELEM 5</div>';
        html += '<div class="yayasan-sub">YAYASAN RIHLAH CAHAYA BANGSA</div>';
        html += '<div class="alamat">Jl Langkat, Singgahan Pelem Kec. Pare, Kab. Kediri, Prov. Jatim 64212</div>';
        html += '<div class="email">Email : sppgpelem10@gmail.com</div>';
        html += '</div>';

        html += '</div>';
        
        html += '<div class="garis-kop"></div>';
        html += '<div class="judul">LAPORAN REKAPITULASI ABSENSI</div>';
        html += '<div class="periode">Periode: ' + periode + '</div>';
        html += '<div class="tgl-cetak">Dicetak pada: ' + tglCetak + (divisiFilter ? ' | Divisi: ' + divisiFilter : '') + '</div>';
        html += '</div>';

        // Summary items
        html += '<div class="summary">';
        html += '<div class="summary-item"><div class="num total">' + totalKaryawan + '</div><div class="label">Relawan</div></div>';
        html += '<div class="summary-item"><div class="num hadir">' + totalMasuk + '</div><div class="label">Masuk</div></div>';
        html += '<div class="summary-item"><div class="num izin">' + totalIzin + '</div><div class="label">Izin</div></div>';
        html += '<div class="summary-item"><div class="num alfa">' + totalAlfa + '</div><div class="label">Alfa</div></div>';
        html += '</div>';

        // Legenda
        html += '<div class="legenda">';
        html += '<div class="legenda-item"><span class="dot hadir"></span> Masuk</div>';
        html += '<div class="legenda-item"><span class="dot izin"></span> Izin</div>';
        html += '<div class="legenda-item"><span class="dot alfa"></span> Alfa</div>';
        html += '<div class="legenda-item"><span class="dot libur"></span> Libur</div>';
        html += '</div>';

        html += tableHtml;

        // TTD
        html += '<div class="ttd">';
        html += '<div class="ttd-box">';
        html += '<div class="label">Mengetahui,</div>';
        html += '<div class="jabatan">Kepala SPPG Pelem 5</div>';
        html += '<div class="line"></div>';
        html += '<div class="nama"> Faisal Eko Cahyono </div>';
        html += '</div>';
        html += '<div class="ttd-box">';
        html += '<div class="label">Dibuat Oleh,</div>';
        html += '<div class="jabatan">Asisten Lapangan 2</div>';
        html += '<div class="line"></div>';
        html += '<div class="nama">' + (localStorage.getItem('admin_username') || 'Ikhwanul Muchlisin') + '</div>';
        html += '</div>';
        html += '</div>';

        html += '<div class="footer">Pencatatan dilakukan secara realtime</div>';
        html += '</div>';

        container.innerHTML = html;
    }

    function cetakLaporan() {
        if (allData.length === 0) {
            showToast('Tampilkan laporan terlebih dahulu sebelum mencetak!', 'warning');
            return;
        }
        window.print();
    }

    function refreshData() {
        setDefaultDates();
        loadFilterOptions();
        document.getElementById('laporanContainer').innerHTML = '<div class="loading-text"><i class="fas fa-spinner fa-pulse"></i> Silakan pilih periode dan klik Tampilkan</div>';
        showToast('Data di-refresh', 'info');
    }
</script>
