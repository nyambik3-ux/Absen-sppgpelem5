<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penggajian Harian • Smart Presence</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            min-height: 100vh;
            color: #e2e8f0;
            padding: 20px;
        }
        body.light-mode { background: #f1f5f9; color: #1e293b; }
        
        .navbar {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 16px;
            max-width: 1400px;
            margin: 0 auto 20px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        body.light-mode .navbar { background: rgba(255,255,255,0.85); border-color: rgba(0,0,0,0.06); }
        
        .logo h2 {
            font-size: 20px;
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .logo span { font-size: 12px; color: #64748b; }
        
        .nav-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .nav-actions button {
            padding: 8px 16px; border: none; border-radius: 12px; cursor: pointer;
            font-size: 13px; font-weight: 600; transition: all 0.2s; font-family: 'Inter', sans-serif;
        }
        .nav-actions button:active { transform: scale(0.95); }
        .btn-logout { background: #ef4444; color: white; }
        .btn-logout:hover { background: #dc2626; }
        .btn-back { background: #6366f1; color: white; }
        .btn-back:hover { background: #4f46e5; }
        .btn-theme { background: #1e293b; color: #e2e8f0; }
        body.light-mode .btn-theme { background: #e2e8f0; color: #1e293b; }
        
        .container { max-width: 1200px; margin: 0 auto; }
        
        .filter-card {
            background: rgba(255,255,255,0.04);
            border-radius: 16px; padding: 20px 24px; margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.06);
            display: flex; flex-wrap: wrap; align-items: center; gap: 14px;
        }
        body.light-mode .filter-card { background: white; border-color: rgba(0,0,0,0.06); }
        
        .filter-card label { font-size: 13px; font-weight: 600; color: #94a3b8; }
        .filter-card input[type="date"],
        .filter-card select {
            padding: 10px 14px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.3); color: white;
            font-family: 'Inter', sans-serif; font-size: 14px;
        }
        body.light-mode .filter-card input[type="date"],
        body.light-mode .filter-card select { background: #f1f5f9; color: #1e293b; border-color: #cbd5e1; }
        .filter-card input:focus, .filter-card select:focus { outline: none; border-color: #a855f7; }
        
        .filter-card .btn-primary {
            padding: 10px 24px;
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            border: none; border-radius: 10px; color: white;
            font-weight: 700; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 14px;
        }
        .filter-card .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(168,85,247,0.4); }
        .filter-card .btn-print {
            padding: 10px 20px; background: #f59e0b; border: none; border-radius: 10px;
            color: white; font-weight: 700; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 13px;
        }
        .filter-card .btn-print:hover { background: #d97706; }
        
        .laporan-preview {
            background: white; color: #1e293b; border-radius: 16px;
            padding: 40px; max-width: 1100px; margin: 0 auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            font-family: 'Times New Roman', Times, serif;
        }
        body.light-mode .laporan-preview { box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        
        .laporan-preview .kop { text-align: center; }
        .laporan-preview .kop .header-wrapper {
            display: flex; align-items: center; justify-content: flex-start;
            gap: 20px; margin-bottom: 4px; position: relative; min-height: 75px;
        }
        .laporan-preview .kop .header-wrapper .logo-container {
            position: absolute; left: 10px; top: 50%; transform: translateY(-50%); z-index: 5;
        }
        .laporan-preview .kop .header-wrapper .logo-img {
            height: 65px; width: auto; object-fit: contain; display: block;
        }
        .laporan-preview .kop .header-wrapper .teks { text-align: center; width: 100%; }
        .laporan-preview .kop .header-wrapper .teks .instansi {
            font-size: 13px; font-weight: 700; letter-spacing: 0.5px; color: #0f172a; line-height: 1.2;
        }
        .laporan-preview .kop .header-wrapper .teks .instansi-2 {
            font-size: 15px; font-weight: 800; letter-spacing: 1px; color: #0f172a; margin-top: 1px; line-height: 1.2;
        }
        .laporan-preview .kop .header-wrapper .teks .yayasan-sub {
            font-size: 12px; font-weight: 700; color: #334155; margin-top: 1px; line-height: 1.2;
        }
        .laporan-preview .kop .header-wrapper .teks .alamat {
            font-size: 11px; color: #334155; margin-top: 2px; line-height: 1.2;
        }
        .laporan-preview .kop .header-wrapper .teks .email {
            font-size: 11px; color: #334155; margin-top: 1px; line-height: 1.2;
        }
        .laporan-preview .kop .garis-kop { border-bottom: 3px double #1e293b; margin-top: 12px; margin-bottom: 16px; }
        .laporan-preview .kop .judul {
            font-size: 20px; font-weight: 800; letter-spacing: 2px; color: #0f172a; margin-top: 4px;
        }
        .laporan-preview .kop .periode { font-size: 13px; color: #475569; margin-top: 4px; }
        .laporan-preview .kop .tgl-cetak { font-size: 11px; color: #94a3b8; margin-top: 2px; }
        
        .hari-section { margin-top: 22px; }
        .hari-section .hari-header {
            background: #1e293b; color: white;
            padding: 8px 14px; font-weight: 700; font-size: 13px;
            border-radius: 6px 6px 0 0;
            display: flex; justify-content: space-between; align-items: center;
        }
        .hari-section .hari-header .hari-label {
            font-size: 11px; font-weight: 500; opacity: 0.85;
        }
        
        .laporan-preview table {
            width: 100%; border-collapse: collapse; margin: 0 0 8px; font-size: 11px;
        }
        .laporan-preview th, .laporan-preview td {
            padding: 5px 6px; border: 1px solid #cbd5e1;
            text-align: center; vertical-align: middle;
        }
        .laporan-preview th {
            background: #f1f5f9; font-weight: 700; font-size: 10px;
            text-transform: uppercase; letter-spacing: 0.3px;
        }
        .laporan-preview td.nama { text-align: left; font-weight: 600; }
        .laporan-preview td.divisi { font-size: 10px; }
        .laporan-preview td.gaji { font-family: 'Courier New', monospace; letter-spacing: 1px; font-size: 12px; }
        
        .laporan-preview td .status-label {
            display: inline-block; padding: 1px 6px; border-radius: 3px;
            font-weight: 600; font-size: 9px; min-width: 40px;
        }
        .laporan-preview td .status-label.hadir { background: #d1fae5; color: #059669; }
        .laporan-preview td .status-label.alfa { background: #fee2e2; color: #b91c1c; }
        .laporan-preview td .status-label.izin { background: #ede9fe; color: #7c3aed; }
        .laporan-preview td .status-label.libur { background: #dbeafe; color: #2563eb; }
        
        .laporan-preview .ttd {
            display: flex; justify-content: space-between; margin-top: 30px;
            padding-top: 16px; border-top: 1px solid #cbd5e1;
        }
        .laporan-preview .ttd-box { text-align: center; width: 45%; }
        .laporan-preview .ttd-box .label { font-size: 10px; color: #64748b; margin-bottom: 2px; }
        .laporan-preview .ttd-box .nama { font-size: 12px; font-weight: 700; margin-top: 2px; }
        .laporan-preview .ttd-box .jabatan { font-size: 10px; color: #475569; }
        .laporan-preview .ttd-box .line {
            width: 180px; border-bottom: 1px solid #1e293b;
            margin: 32px auto 2px; max-width: 100%;
        }
        .laporan-preview .footer {
            text-align: center; font-size: 9px; color: #94a3b8;
            margin-top: 12px; padding-top: 10px; border-top: 1px solid #e2e8f0;
        }
        
        .loading-text { text-align: center; color: #64748b; padding: 40px 0; font-size: 14px; }
        .empty-text { text-align: center; color: #64748b; padding: 30px 0; font-size: 14px; }
        
        .toast-custom {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #1e293b; color: white; padding: 14px 28px; border-radius: 16px;
            font-weight: 600; font-size: 14px; z-index: 9999;
            border-left: 4px solid #10b981; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            animation: slideUp 0.3s ease; max-width: 90%; font-family: 'Inter', sans-serif;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(30px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        
        @media (max-width: 768px) {
            .navbar { flex-wrap: wrap; gap: 10px; padding: 12px 16px; }
            .filter-card { flex-direction: column; align-items: stretch; }
            .filter-card input[type="date"], .filter-card select { width: 100%; }
            .laporan-preview { padding: 20px; }
            .laporan-preview table { font-size: 9px; }
            .laporan-preview th, .laporan-preview td { padding: 2px 3px; }
            .laporan-preview .kop .header-wrapper { position: static; display: flex; flex-direction: column; align-items: center; }
            .laporan-preview .kop .header-wrapper .logo-container { position: static; transform: none; margin-bottom: 10px; text-align: center; }
            .laporan-preview .kop .header-wrapper .logo-img { margin: 0 auto; }
            .laporan-preview .kop .judul { font-size: 16px; }
            .nav-actions { flex-wrap: wrap; }
            .laporan-preview .ttd { flex-direction: column; gap: 20px; align-items: center; }
            .laporan-preview .ttd-box { width: 100%; }
        }
        
        @media print {
            body { background: white; padding: 0; }
            .navbar { display: none; }
            .filter-card { display: none; }
            .laporan-preview { box-shadow: none; padding: 20px 30px; border-radius: 0; }
            .laporan-preview .ttd-box .line { margin: 32px auto 2px; }
            .toast-custom { display: none; }
            .hari-section { page-break-inside: avoid; }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="logo">
        <h2>📋 RelawanTrack</h2>
        <span>Laporan Penggajian Harian</span>
    </div>
    <div class="nav-actions">
        <button class="btn-back" onclick="window.location.href='admin_dashboard.html'">
            <i class="fas fa-arrow-left"></i> Dashboard
        </button>
        <button class="btn-theme" onclick="toggleTheme()">
            <i class="fas fa-moon" id="themeIcon"></i>
        </button>
        <span id="adminName" style="font-weight:600;font-size:14px;">Admin</span>
        <button class="btn-logout" onclick="doLogout()">
            <i class="fas fa-sign-out-alt"></i> Keluar
        </button>
    </div>
</nav>

<div class="container">
    <div class="filter-card">
        <div style="display: flex; gap: 10px; flex-wrap: wrap; width: 100%; align-items: center;">
            <div>
                <label style="display:block; margin-bottom:4px;"><i class="fas fa-calendar-alt"></i> Mulai Tanggal (7 Hari):</label>
                <input type="date" id="startDate">
            </div>
            <div>
                <label style="display:block; margin-bottom:4px;"><i class="fas fa-users"></i> Divisi:</label>
                <select id="filterDivisi">
                    <option value="">Semua Divisi</option>
                </select>
            </div>
            <div style="margin-top: 18px;">
                <button class="btn-primary" onclick="loadLaporan()">
                    <i class="fas fa-search"></i> Tampilkan
                </button>
                <button class="btn-print" onclick="cetakLaporan()">
                    <i class="fas fa-print"></i> Cetak / PDF
                </button>
            </div>
        </div>
    </div>

    <div id="laporanContainer">
        <div class="loading-text"><i class="fas fa-spinner fa-pulse"></i> Silakan pilih tanggal mulai dan klik Tampilkan</div>
    </div>
</div>

<script>
    // ============================================================
    // KONFIGURASI SUPABASE
    // ============================================================
    var SUPABASE_URL = 'https://zcaqqybonpfishwkmffg.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpjYXFxeWJvbnBmaXNod2ttZmZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2Mjc2NDgsImV4cCI6MjEwMzIwMzY0OH0.pBk5nwJI3u9n08onTNmvcOFxtCXQvv-ipYIu2f_iAiQ';

    if (!localStorage.getItem('admin_logged_in')) {
        window.location.href = 'admin_login.html';
    }
    document.getElementById('adminName').textContent = localStorage.getItem('admin_username') || 'Admin';

    // ============================================================
    // VARIABLES
    // ============================================================
    var hariLiburMap = {};
    var hariNama = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
    var hariNamaLower = ['minggu', 'senin', 'selasa', 'rabu', 'kamis', 'jumat', 'sabtu'];
    var bulanNama = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

    var urutanDivisi = [
        'ASISTEN LAPANGAN', 'KEPALA CHEF', 'PENGOLAHAN', 'TIM PERSIAPAN BAHAN',
        'PEMORSIAN MAKANAN', 'CUCI ALAT MAKAN', 'DISTRIBUSI', 'KEBERSIHAN', 'SATPAM'
    ];

    // ============================================================
    // FUNGSI TANGGAL
    // ============================================================
    function getTodayIndonesia() {
        var now = new Date();
        var offset = 7 * 60 * 60 * 1000;
        return new Date(now.getTime() + offset).toISOString().split('T')[0];
    }
    function getDateIndonesia(date) {
        var offset = 7 * 60 * 60 * 1000;
        return new Date(date.getTime() + offset).toISOString().split('T')[0];
    }
    function parseDateIndonesia(dateStr) {
        var parts = dateStr.split('-');
        return new Date(parts[0], parts[1] - 1, parts[2]);
    }
    function setDefaultDates() {
        document.getElementById('startDate').value = getTodayIndonesia();
    }
    setDefaultDates();

    // ============================================================
    // THEME, TOAST, LOGOUT
    // ============================================================
    function toggleTheme() {
        document.body.classList.toggle('light-mode');
        var icon = document.getElementById('themeIcon');
        icon.className = document.body.classList.contains('light-mode') ? 'fas fa-sun' : 'fas fa-moon';
    }
    function showToast(msg, type) {
        type = type || 'success';
        var existing = document.querySelector('.toast-custom');
        if (existing) existing.remove();
        var toast = document.createElement('div');
        toast.className = 'toast-custom';
        var colors = { success: '#10b981', error: '#ef4444', warning: '#f59e0b', info: '#3b82f6' };
        toast.style.borderLeftColor = colors[type] || '#10b981';
        var icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
        toast.innerHTML = (icons[type] || 'ℹ️') + ' ' + msg;
        document.body.appendChild(toast);
        setTimeout(function() {
            toast.style.opacity = '0';
            toast.style.transform = 'translateX(-50%) translateY(20px)';
            setTimeout(function() { toast.remove(); }, 300);
        }, 3000);
    }
    function doLogout() {
        if (confirm('Yakin ingin keluar?')) {
            localStorage.removeItem('admin_logged_in');
            localStorage.removeItem('admin_username');
            window.location.href = 'admin_login.html';
        }
    }

    // ============================================================
    // LOAD HARI LIBUR
    // ============================================================
    async function loadHariLibur() {
        try {
            var response = await fetch(
                SUPABASE_URL + '/rest/v1/hari_libur?select=tanggal,divisi',
                { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY } }
            );
            var data = await response.json();
            hariLiburMap = {};
            data.forEach(function(item) {
                hariLiburMap[item.tanggal + '|' + item.divisi] = true;
            });
        } catch(e) { hariLiburMap = {}; }
    }
    function isTanggalLibur(tanggal, divisi) {
        return hariLiburMap[tanggal + '|' + divisi] || false;
    }

    // ============================================================
    // LOAD FILTER OPTIONS
    // ============================================================
    async function loadFilterOptions() {
        try {
            var response = await fetch(SUPABASE_URL + '/rest/v1/karyawan?select=divisi', {
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
            });
            var karyawan = await response.json();
            var divisiSet = new Set();
            karyawan.forEach(function(k) { if (k.divisi) divisiSet.add(k.divisi); });
            var sortedDivisi = [];
            urutanDivisi.forEach(function(d) {
                if (divisiSet.has(d)) { sortedDivisi.push(d); divisiSet.delete(d); }
            });
            divisiSet.forEach(function(d) { sortedDivisi.push(d); });
            var select = document.getElementById('filterDivisi');
            select.innerHTML = '<option value="">Semua Divisi</option>';
            sortedDivisi.forEach(function(d) {
                select.innerHTML += '<option value="' + d + '">' + d + '</option>';
            });
        } catch(e) { console.error('Gagal load filter:', e); }
    }
    loadFilterOptions();

    // ============================================================
    // HITUNG 7 HARI KERJA BERDASARKAN hari_masuk
    // ============================================================
    function getHariKerja7(hariMasukArr) {
        // Normalisasi ke lowercase
        var list = (hariMasukArr || []).map(function(h) { return String(h).toLowerCase().trim(); });
        if (list.length === 0) list = ['senin','selasa','rabu','kamis','jumat','sabtu'];
        return list;
    }

    function hitungTanggal7Hari(hari1Tanggal, hariMasukArr) {
        // hari1Tanggal: Date object
        // Return: array of { hariKe: 1..7, tanggal: Date }
        var listHari = getHariKerja7(hariMasukArr);
        var hasil = [];
        var current = new Date(hari1Tanggal);
        var counter = 1;
        var maxLoop = 60; // safety

        while (hasil.length < 7 && maxLoop-- > 0) {
            var namaHari = hariNamaLower[current.getDay()];
            if (listHari.indexOf(namaHari) !== -1) {
                hasil.push({
                    hariKe: counter,
                    tanggal: new Date(current),
                    namaHari: hariNama[current.getDay()]
                });
                counter++;
            }
            current.setDate(current.getDate() + 1);
        }
        return hasil;
    }

    // ============================================================
    // LOAD LAPORAN
    // ============================================================
    async function loadLaporan() {
        var start = document.getElementById('startDate').value;
        var divisiFilter = document.getElementById('filterDivisi').value;

        if (!start) { showToast('Pilih tanggal mulai dulu!', 'warning'); return; }

        var container = document.getElementById('laporanContainer');
        container.innerHTML = '<div class="loading-text"><i class="fas fa-spinner fa-pulse"></i> Memuat data...</div>';

        try {
            await loadHariLibur();

            // 1. Fetch karyawan
            var karyawanQuery = SUPABASE_URL + '/rest/v1/karyawan?select=id,nama,divisi,hari_masuk';
            if (divisiFilter) {
                karyawanQuery += '&divisi=eq.' + encodeURIComponent(divisiFilter);
            }
            var karyawanRes = await fetch(karyawanQuery, {
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
            });
            var karyawan = await karyawanRes.json();

            if (!karyawan || karyawan.length === 0) {
                container.innerHTML = '<div class="empty-text"><i class="fas fa-inbox"></i> Tidak ada karyawan</div>';
                return;
            }

            // 2. Cari "Hari 1" = MIN tanggal absensi untuk divisi yang paling awal absen
            var absenQuery = SUPABASE_URL + '/rest/v1/absensi?select=tanggal,karyawan_id&order=tanggal.asc';
            if (divisiFilter) {
                // Filter per divisi: ambil karyawan_id di divisi itu dulu
                var ids = karyawan.map(function(k) { return k.id; });
                absenQuery += '&karyawan_id=in.(' + ids.join(',') + ')';
            }
            var absenAllRes = await fetch(absenQuery, {
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
            });
            var absenAll = await absenAllRes.json();

            if (!absenAll || absenAll.length === 0) {
                container.innerHTML = '<div class="empty-text"><i class="fas fa-inbox"></i> Belum ada data absensi</div>';
                return;
            }

            // Cari tanggal MIN
            var tglMin = absenAll[0].tanggal;
            absenAll.forEach(function(a) {
                if (a.tanggal < tglMin) tglMin = a.tanggal;
            });

            var hari1Date = parseDateIndonesia(tglMin);
            var periode7 = hitungTanggal7Hari(hari1Date, ['senin','selasa','rabu','kamis','jumat','sabtu','minggu']);

            // 3. Fetch absensi & izin dalam range 7 hari (pakai tanggal min s/d max dari periode7)
            var tglAkhir = getDateIndonesia(periode7[periode7.length - 1].tanggal);
            // Extend range biar aman (karena per orang bisa beda tanggal akhir)
            var extendEnd = new Date(periode7[periode7.length - 1].tanggal);
            extendEnd.setDate(extendEnd.getDate() + 14);
            var tglAkhirExtended = getDateIndonesia(extendEnd);

            var absenRes = await fetch(
                SUPABASE_URL + '/rest/v1/absensi?select=*&tanggal=gte.' + tglMin + '&tanggal=lte.' + tglAkhirExtended,
                { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY } }
            );
            var absensi = await absenRes.json();

            var izinRes = await fetch(
                SUPABASE_URL + '/rest/v1/izin?select=*&tanggal=gte.' + tglMin + '&tanggal=lte.' + tglAkhirExtended,
                { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY } }
            );
            var listIzin = await izinRes.json();

            var absenMap = {};
            absensi.forEach(function(a) { absenMap[a.karyawan_id + '|' + a.tanggal] = a; });
            listIzin.forEach(function(i) {
                absenMap[i.karyawan_id + '|' + i.tanggal] = {
                    karyawan_id: i.karyawan_id, tanggal: i.tanggal,
                    status: 'izin', jam_masuk: '-', jam_pulang: '-',
                    keterangan: i.keterangan || i.alasan || '-'
                };
            });

            // 4. Sort karyawan
            karyawan.sort(function(a, b) {
                var iA = urutanDivisi.indexOf(a.divisi); if (iA === -1) iA = 999;
                var iB = urutanDivisi.indexOf(b.divisi); if (iB === -1) iB = 999;
                if (iA !== iB) return iA - iB;
                return (a.nama || '').localeCompare(b.nama || '');
            });

            // 5. Build data per hari (Hari 1 s/d Hari 7)
            //    Untuk setiap karyawan, hitung tanggal masing-masing Hari 1-7 berdasarkan hari_masuk-nya
            var hariSections = [];
            for (var h = 1; h <= 7; h++) {
                hariSections.push({
                    hariKe: h,
                    namaHari: '',
                    tanggal: null,
                    karyawan: []
                });
            }

            karyawan.forEach(function(k) {
                var hariMasukArr = k.hari_masuk || ['senin','selasa','rabu','kamis','jumat','sabtu'];
                var list7 = hitungTanggal7Hari(hari1Date, hariMasukArr);

                list7.forEach(function(item, idx) {
                    var tglStr = getDateIndonesia(item.tanggal);
                    var abs = absenMap[k.id + '|' + tglStr];
                    var isLibur = isTanggalLibur(tglStr, k.divisi);

                    var status = 'alfa', statusText = 'Alfa';
                    var jamMasuk = '-', jamPulang = '-', keterangan = '-';

                    if (isLibur) {
                        status = 'libur'; statusText = 'Libur';
                    } else if (abs) {
                        jamMasuk = abs.jam_masuk || '-';
                        jamPulang = abs.jam_pulang || '-';
                        keterangan = abs.keterangan || '-';
                        var sDb = String(abs.status || '').toLowerCase().trim();
                        if (sDb === 'izin' || sDb === 'sakit' || sDb === 'dinas') {
                            status = 'izin'; statusText = 'Izin';
                        } else if (sDb === 'libur') {
                            status = 'libur'; statusText = 'Libur';
                        } else if (sDb === 'hadir' || jamMasuk !== '-') {
                            status = 'hadir'; statusText = 'Hadir';
                        }
                    }

                    // Simpan info hari (untuk header)
                    if (!hariSections[idx].tanggal) {
                        hariSections[idx].namaHari = item.namaHari;
                        hariSections[idx].tanggal = item.tanggal;
                    }

                    hariSections[idx].karyawan.push({
                        nama: k.nama || k.id,
                        divisi: k.divisi || '-',
                        jamMasuk: jamMasuk,
                        jamPulang: jamPulang,
                        status: status,
                        statusText: statusText,
                        keterangan: keterangan
                    });
                });
            });

            renderLaporan(hariSections, tglMin, getDateIndonesia(periode7[periode7.length - 1].tanggal), divisiFilter);

        } catch(e) {
            console.error('Error:', e);
            container.innerHTML = '<div class="empty-text"><i class="fas fa-exclamation-triangle"></i> Gagal memuat data</div>';
            showToast('Gagal memuat data!', 'error');
        }
    }

    // ============================================================
    // RENDER LAPORAN
    // ============================================================
    function renderLaporan(hariSections, tglMulai, tglSelesai, divisiFilter) {
        var container = document.getElementById('laporanContainer');
        var logoUrl = 'https://zcaqqybonpfishwkmffg.supabase.co/storage/v1/object/public/logo/Logo_Badan_Gizi_Nasional_(2024)%20(1).png';

        var dStart = parseDateIndonesia(tglMulai);
        var dEnd = parseDateIndonesia(tglSelesai);
        var periode = dStart.getDate() + ' ' + bulanNama[dStart.getMonth()] + ' ' + dStart.getFullYear() +
                      ' - ' + dEnd.getDate() + ' ' + bulanNama[dEnd.getMonth()] + ' ' + dEnd.getFullYear();

        var now = new Date();
        var tglCetak = now.getDate() + ' ' + bulanNama[now.getMonth()] + ' ' + now.getFullYear();

        var html = '<div class="laporan-preview" id="laporanContent">';

        // KOP
        html += '<div class="kop">';
        html += '<div class="header-wrapper">';
        html += '<div class="logo-container">';
        html += '<img src="' + logoUrl + '" alt="Logo" class="logo-img" onerror="this.style.display=\'none\'">';
        html += '</div>';
        html += '<div class="teks">';
        html += '<div class="instansi">SATUAN PELAYANAN PEMENUHAN GIZI</div>';
        html += '<div class="instansi-2">SPPG KEDIRI PARE PELEM 5</div>';
        html += '<div class="yayasan-sub">YAYASAN RIHLAH CAHAYA BANGSA</div>';
        html += '<div class="alamat">Jl Langkat, Singgahan Pelem Kec. Pare, Kab. Kediri, Prov. Jatim 64212</div>';
        html += '<div class="email">Email : sppgpelem10@gmail.com</div>';
        html += '</div>';
        html += '</div>';
        html += '<div class="garis-kop"></div>';
        html += '<div class="judul">LAPORAN PENGGAJIAN HARIAN</div>';
        html += '<div class="periode">Periode: ' + periode + ' (7 Hari)</div>';
        html += '<div class="tgl-cetak">Dicetak pada: ' + tglCetak + (divisiFilter ? ' | Divisi: ' + divisiFilter : '') + '</div>';
        html += '</div>';

        // 7 Hari Sections
        hariSections.forEach(function(sec) {
            var tglStr = sec.tanggal ? (sec.tanggal.getDate() + ' ' + bulanNama[sec.tanggal.getMonth()] + ' ' + sec.tanggal.getFullYear()) : '-';
            var hariLabel = sec.namaHari ? (sec.namaHari + ', ' + tglStr) : tglStr;

            html += '<div class="hari-section">';
            html += '<div class="hari-header">';
            html += '<span>PENGGAJIAN HARI ' + sec.hariKe + '</span>';
            html += '<span class="hari-label">' + hariLabel + '</span>';
            html += '</div>';

            html += '<table>';
            html += '<thead><tr>';
            html += '<th style="width:30px;">No</th>';
            html += '<th style="width:140px;">Nama</th>';
            html += '<th style="width:110px;">Divisi</th>';
            html += '<th style="width:70px;">Jam Masuk</th>';
            html += '<th style="width:70px;">Jam Pulang</th>';
            html += '<th style="width:70px;">Status</th>';
            html += '<th>Gaji Harian</th>';
            html += '</tr></thead><tbody>';

            sec.karyawan.forEach(function(k, idx) {
                html += '<tr>';
                html += '<td>' + (idx + 1) + '</td>';
                html += '<td class="nama">' + k.nama + '</td>';
                html += '<td class="divisi">' + k.divisi + '</td>';
                html += '<td>' + k.jamMasuk + '</td>';
                html += '<td>' + k.jamPulang + '</td>';
                html += '<td><span class="status-label ' + k.status + '">' + k.statusText + '</span></td>';
                html += '<td class="gaji">___________</td>';
                html += '</tr>';
            });

            html += '</tbody></table>';
            html += '</div>';
        });

        // TTD
        html += '<div class="ttd">';
        html += '<div class="ttd-box">';
        html += '<div class="label">Mengetahui,</div>';
        html += '<div class="jabatan">Kepala SPPG Pelem 5</div>';
        html += '<div class="line"></div>';
        html += '<div class="nama">Daryanto Hasan</div>';
        html += '</div>';
        html += '<div class="ttd-box">';
        html += '<div class="label">Dibuat Oleh,</div>';
        html += '<div class="jabatan">Asisten Lapangan 2</div>';
        html += '<div class="line"></div>';
        html += '<div class="nama">Ikhwanul Muchlisin</div>';
        html += '</div>';
        html += '</div>';

        html += '<div class="footer">Pencatatan dilakukan secara realtime</div>';
        html += '</div>';

        container.innerHTML = html;
    }

    function cetakLaporan() {
        if (!document.getElementById('laporanContent')) {
            showToast('Tampilkan laporan terlebih dahulu sebelum mencetak!', 'warning');
            return;
        }
        window.print();
    }
</script>
