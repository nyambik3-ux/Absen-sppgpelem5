<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Laporan Absensi • Smart Presence</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            min-height: 100vh;
            color: #e2e8f0;
            padding: 20px;
        }
        body.light-mode { background: #f1f5f9; color: #1e293b; }

        .navbar {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 16px;
            max-width: 1400px;
            margin: 0 auto 20px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        body.light-mode .navbar { background: rgba(255,255,255,0.85); border-color: rgba(0,0,0,0.06); }

        .logo h2 {
            font-size: 20px;
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .logo span { font-size: 12px; color: #64748b; }

        .nav-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .nav-actions button {
            padding: 8px 16px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .nav-actions button:active { transform: scale(0.95); }
        .btn-logout { background: #ef4444; color: white; }
        .btn-logout:hover { background: #dc2626; }
        .btn-back { background: #6366f1; color: white; }
        .btn-back:hover { background: #4f46e5; }
        .btn-theme { background: #1e293b; color: #e2e8f0; }
        body.light-mode .btn-theme { background: #e2e8f0; color: #1e293b; }

        .container { max-width: 1400px; margin: 0 auto; }

        /* FILTER */
        .filter-card {
            background: rgba(255,255,255,0.04);
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.06);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 14px;
        }
        body.light-mode .filter-card { background: white; border-color: rgba(0,0,0,0.06); }

        .filter-card label { font-size: 13px; font-weight: 600; color: #94a3b8; }
        .filter-card select,
        .filter-card input[type="date"] {
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.3);
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            min-width: 150px;
        }
        body.light-mode .filter-card select,
        body.light-mode .filter-card input[type="date"] { background: #f1f5f9; color: #1e293b; border-color: #cbd5e1; }

        .filter-card .btn-primary {
            padding: 10px 24px;
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
        }
        .filter-card .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(168,85,247,0.4); }
        .filter-card .btn-success { padding: 10px 20px; background: #10b981; border: none; border-radius: 10px; color: white; font-weight: 700; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 13px; }
        .filter-card .btn-success:hover { background: #059669; }
        .filter-card .btn-danger { padding: 10px 20px; background: #ef4444; border: none; border-radius: 10px; color: white; font-weight: 700; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 13px; }
        .filter-card .btn-danger:hover { background: #dc2626; }
        .filter-card .btn-refresh { padding: 10px 20px; background: #6366f1; border: none; border-radius: 10px; color: white; font-weight: 700; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 13px; }
        .filter-card .btn-refresh:hover { background: #4f46e5; }

        /* CARD STATISTIK */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: rgba(255,255,255,0.04);
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.06);
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
        }
        body.light-mode .stat-card { background: white; border-color: rgba(0,0,0,0.06); }
        .stat-card .number {
            display: block;
            font-size: 26px;
            font-weight: 800;
            color: white;
            margin-top: 6px;
        }
        body.light-mode .stat-card .number { color: #1e293b; }
        .stat-card.hadir .number { color: #34d399; }
        .stat-card.telat .number { color: #fb923c; }
        .stat-card.alfa .number { color: #f87171; }
        .stat-card.izin .number { color: #60a5fa; }
        .stat-card.libur .number { color: #a855f7; }

        /* TABLE */
        .table-container {
            background: rgba(255,255,255,0.04);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.06);
            overflow-x: auto;
        }
        body.light-mode .table-container { background: white; border-color: rgba(0,0,0,0.06); }
        .table-container h3 { font-size: 16px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }

        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.06); }
        body.light-mode th, body.light-mode td { border-bottom-color: #e2e8f0; }
        th {
            font-weight: 600;
            color: #94a3b8;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: sticky;
            top: 0;
            background: rgba(15,23,42,0.95);
        }
        body.light-mode th { background: #f8fafc; color: #64748b; }

        .badge-divisi { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; background: rgba(168,85,247,0.15); color: #a855f7; }
        .badge-nama { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; background: rgba(59,130,246,0.15); color: #60a5fa; }

        .loading-text { text-align: center; color: #64748b; padding: 40px 0; font-size: 14px; }
        .empty-text { text-align: center; color: #64748b; padding: 30px 0; font-size: 14px; }

        .toast-custom {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: white;
            padding: 14px 28px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 14px;
            z-index: 9999;
            border-left: 4px solid #10b981;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            animation: slideUp 0.3s ease;
            max-width: 90%;
            font-family: 'Inter', sans-serif;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(30px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* PRINT STYLES */
        @media print {
            body { background: white; color: black; padding: 0; }
            .navbar, .filter-card { display: none !important; }
            .table-container { border: none; padding: 0; background: white; }
            table, th, td { border-color: #000 !important; color: black !important; }
            th { background: #ddd !important; color: black !important; }
            .stats-grid { display: none; }
            .badge-divisi { background: #ddd; color: black; }
            .badge-nama { background: #ddd; color: black; }
            .toast-custom { display: none; }
        }

        @media (max-width: 768px) {
            .navbar { flex-wrap: wrap; gap: 10px; padding: 12px 16px; }
            .filter-card { flex-direction: column; align-items: stretch; }
            .filter-card select, .filter-card input[type="date"] { width: 100%; min-width: auto; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .nav-actions { flex-wrap: wrap; }
            .filter-card .btn-success, .filter-card .btn-danger, .filter-card .btn-refresh { width: 100%; }
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="logo">
        <h2>📋 RelawanTrack</h2>
        <span>Laporan Absensi</span>
    </div>
    <div class="nav-actions">
        <button class="btn-back" onclick="window.location.href='admin_dashboard.html'">
            <i class="fas fa-arrow-left"></i> Dashboard
        </button>
        <button class="btn-theme" onclick="toggleTheme()">
            <i class="fas fa-moon" id="themeIcon"></i>
        </button>
        <span id="adminName" style="font-weight:600;font-size:14px;">Admin</span>
        <button class="btn-logout" onclick="doLogout()">
            <i class="fas fa-sign-out-alt"></i> Keluar
        </button>
    </div>
</nav>

<div class="container">

    <!-- FILTER -->
    <div class="filter-card">
        <label><i class="fas fa-calendar-alt"></i> Periode:</label>
        <input type="date" id="startDate">
        <span style="color:#64748b;">s/d</span>
        <input type="date" id="endDate">

        <label><i class="fas fa-users"></i> Divisi:</label>
        <select id="filterDivisi">
            <option value="">Semua Divisi</option>
        </select>

        <button class="btn-primary" onclick="loadLaporan()">
            <i class="fas fa-chart-bar"></i> Hitung Laporan
        </button>
        <button class="btn-success" onclick="exportExcel()">
            <i class="fas fa-file-excel"></i> Excel
        </button>
        <button class="btn-danger" onclick="exportPDF()">
            <i class="fas fa-file-pdf"></i> PDF
        </button>
        <button class="btn-refresh" onclick="refreshData()">
            <i class="fas fa-sync-alt"></i>
        </button>
    </div>

    <!-- STATISTIK -->
    <div class="stats-grid">
        <div class="stat-card hadir">
            <span>🟢 Hadir</span>
            <span class="number" id="statHadir">0</span>
        </div>
        <div class="stat-card telat">
            <span>🟡 Telat</span>
            <span class="number" id="statTelat">0</span>
        </div>
        <div class="stat-card izin">
            <span>🔵 Izin</span>
            <span class="number" id="statIzin">0</span>
        </div>
        <div class="stat-card libur">
            <span>🟣 Libur</span>
            <span class="number" id="statLibur">0</span>
        </div>
        <div class="stat-card alfa">
            <span>🔴 Alfa</span>
            <span class="number" id="statAlfa">0</span>
        </div>
    </div>

    <!-- TABLE 1: REKAP PER DIVISI -->
    <div class="table-container" style="margin-bottom: 24px;">
        <h3><i class="fas fa-building" style="color:#a855f7;"></i> Rekapitulasi Absensi per Divisi</h3>
        <div id="tableWrapperDivisi">
            <div class="loading-text"><i class="fas fa-spinner fa-pulse"></i> Memuat laporan...</div>
        </div>
    </div>

    <!-- TABLE 2: REKAP PER KARYAWAN (BY NAME) -->
    <div class="table-container">
        <h3><i class="fas fa-users" style="color:#60a5fa;"></i> Rekapitulasi Absensi per Karyawan</h3>
        <div id="tableWrapperKaryawan">
            <div class="loading-text"><i class="fas fa-spinner fa-pulse"></i> Memuat laporan...</div>
        </div>
    </div>

</div>

<script>
    // ============================================================
    // KONFIGURASI SUPABASE
    // ============================================================
    var SUPABASE_URL = 'https://zcaqqybonpfishwkmffg.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpjYXFxeWJvbnBmaXNod2ttZmZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2Mjc2NDgsImV4cCI6MjEwMzIwMzY0OH0.pBk5nwJI3u9n08onTNmvcOFxtCXQvv-ipYIu2f_iAiQ';

    // ============================================================
    // CEK LOGIN
    // ============================================================
    if (!localStorage.getItem('admin_logged_in')) window.location.href = 'admin_login.html';
    document.getElementById('adminName').textContent = localStorage.getItem('admin_username') || 'Admin';

    // ============================================================
    // VARIABLES
    // ============================================================
    var allKaryawan = [];
    var divisiList = [];
    var currentTableDivisiHtml = '';
    var currentTableKaryawanHtml = '';

    // ============================================================
    // FUNGSI TANGGAL
    // ============================================================
    function getTodayIndonesia() {
        var now = new Date();
        var offset = 7 * 60 * 60 * 1000;
        return new Date(now.getTime() + offset).toISOString().split('T')[0];
    }

    function getDateIndonesia(date) {
        var offset = 7 * 60 * 60 * 1000;
        return new Date(date.getTime() + offset).toISOString().split('T')[0];
    }

    function setDefaultDates() {
        var today = new Date();
        var offset = 7 * 60 * 60 * 1000;
        var localToday = new Date(today.getTime() + offset);
        var startDate = new Date(localToday);
        startDate.setDate(startDate.getDate() - 6);
        var start = getDateIndonesia(startDate);
        var end = getTodayIndonesia();
        document.getElementById('startDate').value = start;
        document.getElementById('endDate').value = end;
    }
    setDefaultDates();

    // ============================================================
    // THEME & TOAST
    // ============================================================
    function toggleTheme() {
        document.body.classList.toggle('light-mode');
        document.getElementById('themeIcon').className = document.body.classList.contains('light-mode') ? 'fas fa-sun' : 'fas fa-moon';
    }

    function showToast(msg, type) {
        type = type || 'success';
        var existing = document.querySelector('.toast-custom');
        if (existing) existing.remove();
        var toast = document.createElement('div');
        toast.className = 'toast-custom';
        var colors = { success: '#10b981', error: '#ef4444', warning: '#f59e0b', info: '#3b82f6' };
        toast.style.borderLeftColor = colors[type] || '#10b981';
        var icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
        toast.innerHTML = (icons[type] || 'ℹ️') + ' ' + msg;
        document.body.appendChild(toast);
        setTimeout(function() { toast.remove(); }, 3000);
    }

    function doLogout() {
        if (confirm('Yakin ingin keluar?')) {
            localStorage.removeItem('admin_logged_in');
            localStorage.removeItem('admin_username');
            window.location.href = 'admin_login.html';
        }
    }

    // ============================================================
    // LOAD DIVISI (DARI TABEL DIVISI)
    // ============================================================
    async function loadDivisi() {
        try {
            var response = await fetch(SUPABASE_URL + '/rest/v1/divisi?select=nama&order=nama', {
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
            });
            var data = await response.json();
            if (!Array.isArray(data)) return;
            divisiList = data.map(function(d) { return d.nama; }).sort();

            var select = document.getElementById('filterDivisi');
            select.innerHTML = '<option value="">Semua Divisi</option>';
            divisiList.forEach(function(d) {
                select.innerHTML += '<option value="' + d + '">' + d + '</option>';
            });
        } catch(e) { console.error(e); }
    }

    // ============================================================
    // LOAD LAPORAN (REKAP PER DIVISI + PER KARYAWAN)
    // ============================================================
    async function loadLaporan() {
        var start = document.getElementById('startDate').value;
        var end = document.getElementById('endDate').value;
        var divisiFilter = document.getElementById('filterDivisi').value;

        if (!start || !end) {
            showToast('Pilih periode dulu!', 'warning');
            return;
        }

        var wrapperDivisi = document.getElementById('tableWrapperDivisi');
        var wrapperKaryawan = document.getElementById('tableWrapperKaryawan');
        wrapperDivisi.innerHTML = '<div class="loading-text"><i class="fas fa-spinner fa-pulse"></i> Memuat laporan...</div>';
        wrapperKaryawan.innerHTML = '<div class="loading-text"><i class="fas fa-spinner fa-pulse"></i> Memuat laporan...</div>';

        try {
            // Ambil semua karyawan
            var kRes = await fetch(SUPABASE_URL + '/rest/v1/karyawan?select=id,nama,divisi', {
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
            });
            allKaryawan = await kRes.json();
            var karyawanMap = {};
            allKaryawan.forEach(function(k) { karyawanMap[k.id] = k; });

            // Ambil semua absensi dalam periode
            var absenQuery = SUPABASE_URL + '/rest/v1/absensi?select=*&tanggal=gte.' + start + '&tanggal=lte.' + end;
            var absenRes = await fetch(absenQuery, {
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
            });
            var absensi = await absenRes.json();

            // Hitung total status
            var totalHadir = 0, totalTelat = 0, totalIzin = 0, totalLibur = 0, totalAlfa = 0;

            // Grouping per divisi
            var divisiMap = {};
            divisiList.forEach(function(d) { divisiMap[d] = { hadir: 0, telat: 0, izin: 0, libur: 0, alfa: 0, jumlahKaryawan: 0 }; });

            // Grouping per karyawan (by name)
            var karyawanMapRekap = {};
            allKaryawan.forEach(function(k) {
                karyawanMapRekap[k.id] = { nama: k.nama, divisi: k.divisi, hadir: 0, telat: 0, izin: 0, libur: 0, alfa: 0, totalAbsensi: 0 };
            });

            // Hitung jumlah karyawan per divisi
            allKaryawan.forEach(function(k) {
                if (k.divisi && divisiMap[k.divisi]) divisiMap[k.divisi].jumlahKaryawan++;
            });

            // Proses setiap absensi (Logika Baru dengan status)
            absensi.forEach(function(a) {
                var k = karyawanMap[a.karyawan_id];
                var divisi = k ? k.divisi : '-';
                if (divisiFilter && divisi !== divisiFilter) return;

                if (!divisiMap[divisi]) divisiMap[divisi] = { hadir: 0, telat: 0, izin: 0, libur: 0, alfa: 0, jumlahKaryawan: 0 };

                // Buat untuk per karyawan
                if (!karyawanMapRekap[a.karyawan_id]) karyawanMapRekap[a.karyawan_id] = { nama: a.karyawan_id, divisi: divisi, hadir: 0, telat: 0, izin: 0, libur: 0, alfa: 0, totalAbsensi: 0 };

                var status = 'alfa';
                // LOGIKA PENTING: BACA STATUS DARI DATABASE
                if (a.status === 'libur') {
                    status = 'libur';
                } else if (a.status === 'izin') {
                    status = 'izin';
                } else if (a.jam_masuk && a.jam_pulang) {
                    status = 'hadir';
                } else if (a.jam_masuk) {
                    var targetJam = k ? (k.jam_masuk || '08:00') : '08:00';
                    status = a.jam_masuk <= targetJam ? 'hadir' : 'telat';
                }

                // Tambahkan ke total & divisi & karyawan
                if (status === 'hadir') { totalHadir++; divisiMap[divisi].hadir++; karyawanMapRekap[a.karyawan_id].hadir++; }
                else if (status === 'telat') { totalTelat++; divisiMap[divisi].telat++; karyawanMapRekap[a.karyawan_id].telat++; }
                else if (status === 'izin') { totalIzin++; divisiMap[divisi].izin++; karyawanMapRekap[a.karyawan_id].izin++; }
                else if (status === 'libur') { totalLibur++; divisiMap[divisi].libur++; karyawanMapRekap[a.karyawan_id].libur++; }
                else { totalAlfa++; divisiMap[divisi].alfa++; karyawanMapRekap[a.karyawan_id].alfa++; }

                karyawanMapRekap[a.karyawan_id].totalAbsensi++;
            });

            // Update stats
            document.getElementById('statHadir').textContent = totalHadir;
            document.getElementById('statTelat').textContent = totalTelat;
            document.getElementById('statIzin').textContent = totalIzin;
            document.getElementById('statLibur').textContent = totalLibur;
            document.getElementById('statAlfa').textContent = totalAlfa;

            // Render Tabel Rekap Per Divisi
            var htmlDivisi = '<table><thead><tr>';
            htmlDivisi += '<th>No</th><th>Divisi</th><th>Karyawan</th><th>Hadir</th><th>Telat</th><th>Izin</th><th>Libur</th><th>Alfa</th><th>Total Absensi</th>';
            htmlDivisi += '</tr></thead><tbody>';

            var keys = divisiFilter ? [divisiFilter] : divisiList;
            if (keys.length === 0) {
                htmlDivisi += '<tr><td colspan="9" style="text-align:center;padding:20px;">Belum ada data divisi</td></tr>';
            }

            keys.forEach(function(divisi, idx) {
                var d = divisiMap[divisi];
                if (!d) return;
                var totalAbsensi = d.hadir + d.telat + d.izin + d.libur + d.alfa;
                var jumlahKaryawan = d.jumlahKaryawan;

                htmlDivisi += '<tr>';
                htmlDivisi += '<td>' + (idx + 1) + '</td>';
                htmlDivisi += '<td><span class="badge-divisi">' + divisi + '</span></td>';
                htmlDivisi += '<td>' + jumlahKaryawan + '</td>';
                htmlDivisi += '<td style="color:#34d399;font-weight:700;">' + d.hadir + '</td>';
                htmlDivisi += '<td style="color:#fb923c;font-weight:700;">' + d.telat + '</td>';
                htmlDivisi += '<td style="color:#60a5fa;font-weight:700;">' + d.izin + '</td>';
                htmlDivisi += '<td style="color:#a855f7;font-weight:700;">' + d.libur + '</td>';
                htmlDivisi += '<td style="color:#f87171;font-weight:700;">' + d.alfa + '</td>';
                htmlDivisi += '<td>' + totalAbsensi + '</td>';
                htmlDivisi += '</tr>';
            });

            htmlDivisi += '</tbody></table>';
            wrapperDivisi.innerHTML = htmlDivisi;
            currentTableDivisiHtml = htmlDivisi;

            // Render Tabel Rekap Per Karyawan (By Name)
            var htmlKaryawan = '<table><thead><tr>';
            htmlKaryawan += '<th>No</th><th>Nama</th><th>Divisi</th><th>Hadir</th><th>Telat</th><th>Izin</th><th>Libur</th><th>Alfa</th><th>Total</th>';
            htmlKaryawan += '</tr></thead><tbody>';

            var karyawanKeys = Object.keys(karyawanMapRekap).sort(function(a, b) {
                return karyawanMapRekap[a].nama.localeCompare(karyawanMapRekap[b].nama);
            });

            if (karyawanKeys.length === 0) {
                htmlKaryawan += '<tr><td colspan="9" style="text-align:center;padding:20px;">Belum ada data karyawan</td></tr>';
            }

            karyawanKeys.forEach(function(id, idx) {
                var data = karyawanMapRekap[id];
                if (!data) return;
                var total = data.hadir + data.telat + data.izin + data.libur + data.alfa;

                htmlKaryawan += '<tr>';
                htmlKaryawan += '<td>' + (idx + 1) + '</td>';
                htmlKaryawan += '<td><span class="badge-nama">' + data.nama + '</span></td>';
                htmlKaryawan += '<td>' + (data.divisi || '-') + '</td>';
                htmlKaryawan += '<td style="color:#34d399;font-weight:700;">' + data.hadir + '</td>';
                htmlKaryawan += '<td style="color:#fb923c;font-weight:700;">' + data.telat + '</td>';
                htmlKaryawan += '<td style="color:#60a5fa;font-weight:700;">' + data.izin + '</td>';
                htmlKaryawan += '<td style="color:#a855f7;font-weight:700;">' + data.libur + '</td>';
                htmlKaryawan += '<td style="color:#f87171;font-weight:700;">' + data.alfa + '</td>';
                htmlKaryawan += '<td>' + total + '</td>';
                htmlKaryawan += '</tr>';
            });

            htmlKaryawan += '</tbody></table>';
            wrapperKaryawan.innerHTML = htmlKaryawan;
            currentTableKaryawanHtml = htmlKaryawan;

        } catch(e) {
            console.error('Error:', e);
            wrapperDivisi.innerHTML = '<div class="empty-text">Gagal memuat laporan</div>';
            wrapperKaryawan.innerHTML = '<div class="empty-text">Gagal memuat laporan</div>';
            showToast('Gagal memuat laporan!', 'error');
        }
    }

    // ============================================================
    // EXPORT EXCEL (CSV)
    // ============================================================
    function exportExcel() {
        var start = document.getElementById('startDate').value;
        var end = document.getElementById('endDate').value;

        var csv = 'Laporan Absensi ' + start + ' - ' + end + '\n\n';
        csv += '=== REKAP PER DIVISI ===\n';
        csv += 'No,Divisi,Karyawan,Hadir,Telat,Izin,Libur,Alfa,Total Absensi\n';
        if (currentTableDivisiHtml) {
            var table1 = document.querySelector('#tableWrapperDivisi table');
            var rows1 = table1.querySelectorAll('tr');
            for (var i = 1; i < rows1.length; i++) {
                var cols = rows1[i].querySelectorAll('td');
                if (cols.length === 0) continue;
                csv += cols[0].innerText + ',' + cols[1].innerText + ',' + cols[2].innerText + ',' + cols[3].innerText + ',' + cols[4].innerText + ',' + cols[5].innerText + ',' + cols[6].innerText + ',' + cols[7].innerText + ',' + cols[8].innerText + '\n';
            }
        }

        csv += '\n\n=== REKAP PER KARYAWAN ===\n';
        csv += 'No,Nama,Divisi,Hadir,Telat,Izin,Libur,Alfa,Total\n';
        if (currentTableKaryawanHtml) {
            var table2 = document.querySelector('#tableWrapperKaryawan table');
            var rows2 = table2.querySelectorAll('tr');
            for (var i = 1; i < rows2.length; i++) {
                var cols = rows2[i].querySelectorAll('td');
                if (cols.length === 0) continue;
                csv += cols[0].innerText + ',' + cols[1].innerText + ',' + cols[2].innerText + ',' + cols[3].innerText + ',' + cols[4].innerText + ',' + cols[5].innerText + ',' + cols[6].innerText + ',' + cols[7].innerText + ',' + cols[8].innerText + '\n';
            }
        }

        var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        var link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'Laporan_Absensi_' + start + '_' + end + '.csv';
        link.click();
        showToast('📥 Excel berhasil didownload!', 'success');
    }

    // ============================================================
    // EXPORT PDF (PRINT)
    // ============================================================
    function exportPDF() {
        if (!currentTableDivisiHtml && !currentTableKaryawanHtml) { showToast('Tidak ada data', 'warning'); return; }
        window.print();
    }

    // ============================================================
    // REFRESH
    // ============================================================
    function refreshData() {
        showToast('🔄 Memperbarui...', 'info');
        loadLaporan();
        setTimeout(function() { showToast('✅ Diperbarui!', 'success'); }, 500);
    }

    // ============================================================
    // INIT
    // ============================================================
    loadDivisi();
    setTimeout(function() { loadLaporan(); }, 300);
    console.log('📊 Laporan Absensi loaded!');
</script>

</body>
</html>
