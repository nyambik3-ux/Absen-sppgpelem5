    function getTodayIndonesia() {
        var now = new Date();
        var offset = 7 * 60 * 60 * 1000;
        return new Date(now.getTime() + offset).toISOString().split('T')[0];
    }

    function getYesterdayIndonesia() {
        var now = new Date();
        var offset = 7 * 60 * 60 * 1000;
        var yesterday = new Date(now.getTime() + offset);
        yesterday.setDate(yesterday.getDate() - 1);
        return yesterday.toISOString().split('T')[0];
    }

    function getDateIndonesia(date) {
        var offset = 7 * 60 * 60 * 1000;
        return new Date(date.getTime() + offset).toISOString().split('T')[0];
    }

    function getBulanSekarang() {
        var now = new Date();
        var offset = 7 * 60 * 60 * 1000;
        var date = new Date(now.getTime() + offset);
        return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0');
    }

    function getTanggalSekarang() {
        var now = new Date();
        var offset = 7 * 60 * 60 * 1000;
        var date = new Date(now.getTime() + offset);
        return date.toISOString().split('T')[0];
    }

    function formatTime(val) {
        if (!val) return '--:--';
        if (typeof val === 'string' && val.includes('T')) {
            var date = new Date(val);
            return date.getHours().toString().padStart(2,'0') + ':' + date.getMinutes().toString().padStart(2,'0');
        }
        return val;
    }

    function updateProgress() {
        var now = new Date();
        var jamSekarang = now.getHours() * 60 + now.getMinutes();

        var targetMasuk = parseTime(user.jamMasuk || '08:00');
        if (targetMasuk) {
            var selisih = jamSekarang - targetMasuk;
            var progress = 0, status = '', statusClass = '';

            if (statusData.isLibur || !statusData.isHariKerja) {
                progress = 100;
                status = '🔵 Libur';
                statusClass = 'on-time';
            } else if (window.izinHariIniStatus === 'disetujui') {
                progress = 100;
                status = '📝 Izin';
                statusClass = 'on-time';
            } else if (statusData.sudahMasuk) {
                progress = 100;
                if (selisih <= 5) { status = '✅ On Time'; statusClass = 'on-time'; }
                else if (selisih <= 30) { status = '⏰ +' + selisih + "'"; statusClass = 'late'; }
                else { status = '⚠️ +' + selisih + "'"; statusClass = 'very-late'; }
            } else {
                if (jamSekarang <= targetMasuk) {
                    progress = Math.min(100, ((targetMasuk - jamSekarang) / 60) * 100);
                    status = '⏳ ' + Math.ceil((targetMasuk - jamSekarang)) + "' lagi";
                    statusClass = 'on-time';
                } else {
                    progress = 100;
                    status = '⏰ Telat ' + (jamSekarang - targetMasuk) + "'";
                    statusClass = 'late';
                }
            }

            document.getElementById('progressMasuk').style.width = Math.min(100, progress) + '%';
            document.getElementById('statusMasukText').textContent = status;
            document.getElementById('statusMasukText').className = 'status-text ' + statusClass;
        }

        var targetPulang = parseTime(user.jamPulang || '17:00');
        if (targetPulang) {
            var progress = 0, status = '', statusClass = '';

            if (statusData.isLibur || !statusData.isHariKerja) {
                progress = 100;
                status = '🔵 Libur';
                statusClass = 'on-time';
            } else if (window.izinHariIniStatus === 'disetujui') {

                status = '📝 Izin';
                statusClass = 'on-time';
            } else if (statusData.sudahPulang) {
                progress = 100;
                status = '✅ Selesai';
                statusClass = 'on-time';
            } else if (statusData.sudahMasuk) {
                var selisih = jamSekarang - targetPulang;
                if (selisih < 0) {
                    progress = Math.min(100, ((targetPulang - jamSekarang) / 60) * 100);
                    status = '⏳ ' + Math.ceil((targetPulang - jamSekarang)) + "' lagi";
                    statusClass = 'on-time';
                } else {
                    progress = 100;
                    status = '⚠️ +' + selisih + "'";
                    statusClass = 'very-late';
                }
            } else {
                progress = 0;
                status = '⏳ Belum masuk';
                statusClass = '';
            }

            document.getElementById('progressPulang').style.width = Math.min(100, progress) + '%';
            document.getElementById('statusPulangText').textContent = status;
            document.getElementById('statusPulangText').className = 'status-text ' + statusClass;
        }
    }

    function parseTime(str) {
        if (!str) return null;
        var parts = str.split(':');
        if (parts.length === 2) return parseInt(parts[0]) * 60 + parseInt(parts[1]);
        return null;
    }

    // ============================================================
    // HANDLE ABSEN - UDAH DIPERBAIKI ⭐
    // ============================================================
    var isProcessing = false;

    function hitungJarak(lat1, lon1, lat2, lon2) {
        var R = 6371e3;
        var dLat = (lat2 - lat1) * Math.PI / 180;
        var dLon = (lon2 - lon1) * Math.PI / 180;
        var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    async function handleAbsenClick(action) {

        } else {

        if (isProcessing) return;
        isProcessing = true;

        var btn = document.getElementById('fabAbsen');
        btn.classList.add('loading');
        btn.disabled = true;

        showToast('📡 Mengambil lokasi GPS...', 'info');

        var lat = 0, lng = 0;
        try {
            var position = await new Promise(function(resolve, reject) {
                navigator.geolocation.getCurrentPosition(resolve, reject, {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 0
                });
            });
            lat = position.coords.latitude;
            lng = position.coords.longitude;
        } catch(err) {
            showToast('❌ Gagal ambil lokasi. Pastikan GPS aktif!', 'error');
            btn.classList.remove('loading');
            btn.disabled = false;
            isProcessing = false;
            return;
        }

        var jarak = hitungJarak(lat, lng, KANTOR.lat, KANTOR.lng);
        if (jarak > KANTOR.rad) {
            showToast('📍 Kejauhan! Jarak: ' + Math.round(jarak) + 'm (Max: ' + KANTOR.rad + 'm)', 'error');
            btn.classList.remove('loading');
            btn.disabled = false;
            isProcessing = false;
            return;
        }

        showToast('📤 Mengirim absen...', 'info');

        try {
            var today = getTodayIndonesia();
            var now = new Date();
            var jam = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

            if (action === 'DATANG') {
                var checkRes = await fetch(
                    SUPABASE_URL + '/rest/v1/absensi?select=*&karyawan_id=eq.' + user.id + '&tanggal=eq.' + today,
                    {
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
                        }
                    }
                );
                var existing = await checkRes.json();
                var record = existing[0] || null;

                if (record && record.jam_masuk) {
                    showToast('⚠️ Anda sudah absen masuk hari ini!', 'warning');
                    btn.classList.remove('loading');
                    btn.disabled = false;
                    isProcessing = false;
                    return;
                }

                var payload = {
                    karyawan_id: user.id,
                    tanggal: today,
                    jam_masuk: jam,
                    lat: lat,
                    lng: lng,
                    status: 'hadir'
                };

                var res;
                if (record) {
                    res = await fetch(
                        SUPABASE_URL + '/rest/v1/absensi?karyawan_id=eq.' + user.id + '&tanggal=eq.' + today,
                        {
                            method: 'PATCH',
                            headers: {
                                'apikey': SUPABASE_ANON_KEY,
                                'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(payload)
                        }
                    );
                } else {
                    res = await fetch(
                        SUPABASE_URL + '/rest/v1/absensi',
                        {
                            method: 'POST',
                            headers: {
                                'apikey': SUPABASE_ANON_KEY,
                                'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(payload)
                        }
                    );
                }

                var responseText = await res.text();

                if (res.ok) {
                    showToast('✅ Absen masuk berhasil!', 'success');
                    if (navigator.vibrate) navigator.vibrate(50);
                    await sendTelegram('📢 <b>ABSEN MASUK</b>\n👤 ' + user.nama + '\n🆔 ' + user.id + '\n⏰ ' + jam + '\n📅 ' + today);
                    clearCache();
                    await loadStatus(true);
                    updateFabButton();
                } else {
                    showToast('❌ Gagal: ' + responseText, 'error');
                }

            } else if (action === 'PULANG') {
                // CEK ABSEN HARI INI
                var checkRes = await fetch(
                    SUPABASE_URL + '/rest/v1/absensi?select=*&karyawan_id=eq.' + user.id + '&tanggal=eq.' + today,
                    {
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
                        }
                    }
                );
                var existing = await checkRes.json();
                var record = existing[0] || null;

                // KALO GA KETEMU HARI INI, CEK KEMARIN
                if (!record) {
                    var yesterdayStr = getYesterdayIndonesia();
                    checkRes = await fetch(
                        SUPABASE_URL + '/rest/v1/absensi?select=*&karyawan_id=eq.' + user.id + '&tanggal=eq.' + yesterdayStr,
                        {
                            headers: {
                                'apikey': SUPABASE_ANON_KEY,
                                'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
                            }
                        }
                    );
                    existing = await checkRes.json();
                    record = existing[0] || null;
                }

                if (!record || !record.jam_masuk) {
                    showToast('❌ Anda belum absen masuk! (cek hari ini & kemarin)', 'error');
                    btn.classList.remove('loading');
                    btn.disabled = false;
                    isProcessing = false;
                    return;
                }

                if (record.jam_pulang) {
                    showToast('⚠️ Anda sudah absen pulang!', 'warning');
                    btn.classList.remove('loading');
                    btn.disabled = false;
                    isProcessing = false;
                    return;
                }

                var res = await fetch(
                    SUPABASE_URL + '/rest/v1/absensi?id=eq.' + record.id,
                    {
                        method: 'PATCH',
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            jam_pulang: jam,
                            status: 'pulang'
                        })
                    }
                );

                var responseText = await res.text();

                if (res.ok) {
                    showToast('✅ Absen pulang berhasil!', 'success');
                    if (navigator.vibrate) navigator.vibrate(50);
                    await sendTelegram('📢 <b>ABSEN PULANG</b>\n👤 ' + user.nama + '\n🆔 ' + user.id + '\n⏰ ' + jam + '\n📅 ' + record.tanggal);
                    clearCache();
                    await loadStatus(true);
                    updateFabButton();
                } else {
                    showToast('❌ Gagal: ' + responseText, 'error');
                }
            }

        } catch(e) {
            console.error('Absen error:', e);
            showToast('❌ Gagal koneksi ke server! ' + e.message, 'error');
        }

        btn.classList.remove('loading');
        btn.disabled = false;
        isProcessing = false;
    }

    // ============================================================
    // FITUR IZIN
    // ============================================================
    var izinCount = 0;
    var maxIzinPerBulan = 2;

    function toggleIzinForm() {
        var container = document.getElementById('izinFormContainer');
        var icon = document.getElementById('izinToggleIcon');
        if (container.style.display === 'none' || container.style.display === '') {
            container.style.display = 'block';
            icon.className = 'fas fa-chevron-up';
        } else {
            container.style.display = 'none';
            icon.className = 'fas fa-chevron-down';
        }
    }

    async function loadRiwayatIzin() {
        var container = document.getElementById('izinRiwayatContainer');
        var bulan = getBulanSekarang();

        try {
            var response = await fetch(
                SUPABASE_URL + '/rest/v1/izin?select=*&karyawan_id=eq.' + user.id + '&order=tanggal.desc',
                {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
                    }
                }
            );
            var data = await response.json();

            var izinBulanIni = data.filter(function(item) {
                return item.tanggal && item.tanggal.startsWith(bulan) && item.status === 'disetujui';
            });
            izinCount = izinBulanIni.length;

            document.getElementById('izinCountLabel').textContent = '(' + izinCount + '/' + maxIzinPerBulan + ' bulan ini)';

            if (!data || data.length === 0) {
                container.innerHTML = '<div style="text-align:center;color:#64748b;font-size:12px;padding:8px 0;">Belum ada riwayat izin</div>';
                return;
            }

            var html = '';
            var shown = 0;
            for (var i = 0; i < data.length && shown < 5; i++) {
                var item = data[i];
                shown++;

                var statusClass = '';
                var statusLabel = '';
                var statusColor = '';

                if (item.status === 'pending') {
                    statusClass = 'pending';
                    statusLabel = '⏳ Pending';
                    statusColor = '#f59e0b';
                } else if (item.status === 'disetujui') {
                    statusClass = 'disetujui';
                    statusLabel = '✅ Disetujui';
                    statusColor = '#34d399';
                } else if (item.status === 'ditolak') {
                    statusClass = 'ditolak';
                    statusLabel = '❌ Ditolak';
                    statusColor = '#f87171';
                }

                var tglDisplay = item.tanggal ? formatTanggalIzin(item.tanggal) : '-';

                html += '<div class="izin-item">';
                html += '<div class="info"><strong>' + tglDisplay + '</strong> <span class="alasan">' + (item.alasan || '-') + '</span></div>';
                html += '<div><span class="status ' + statusClass + '">' + statusLabel + '</span>';
                if (item.status === 'ditolak' && item.alasan_tolak) {
                    html += '<div class="tolak-msg">⚠️ ' + item.alasan_tolak + '</div>';
                }
                html += '</div></div>';
            }

            if (data.length > 5) {
                html += '<div style="text-align:center;color:#64748b;font-size:10px;padding:4px 0;">+ ' + (data.length - 5) + ' lagi</div>';
            }

            container.innerHTML = html;

            var tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            var tglDefault = tomorrow.toISOString().split('T')[0];
            document.getElementById('izinTanggal').value = tglDefault;

        } catch(e) {
            console.error('Error load izin:', e);
            container.innerHTML = '<div style="text-align:center;color:#64748b;font-size:12px;padding:8px 0;">Gagal memuat riwayat izin</div>';
        }
    }

    async function ajukanIzin() {
        var tanggal = document.getElementById('izinTanggal').value;
        var alasan = document.getElementById('izinAlasan').value;

        if (!tanggal) {
            showToast('Pilih tanggal izin!', 'error');
            return;
        }

        if (!alasan) {
            showToast('Pilih alasan izin!', 'error');
            return;
        }

        // Cek kuota
        if (izinCount >= maxIzinPerBulan) {
            showToast('⚠️ Kuota izin bulan ini sudah habis (maksimal ' + maxIzinPerBulan + 'x)!', 'error');
            return;
        }

        // Cek tanggal tidak boleh hari ini atau kemarin
        var today = getTanggalSekarang();
        if (tanggal <= today) {
            showToast('⚠️ Izin harus diajukan minimal H-1 (besok atau setelahnya)!', 'error');
            return;
        }

        try {
            var checkRes = await fetch(
                SUPABASE_URL + '/rest/v1/izin?select=id&karyawan_id=eq.' + user.id + '&tanggal=eq.' + tanggal,
                {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
                    }
                }
            );
            var existing = await checkRes.json();

            if (existing && existing.length > 0) {
                showToast('⚠️ Anda sudah mengajukan izin untuk tanggal ini!', 'warning');
                return;
            }

            var payload = {
                karyawan_id: user.id,
                tanggal: tanggal,
                alasan: alasan,
                status: 'pending'
            };

            var response = await fetch(SUPABASE_URL + '/rest/v1/izin', {
                method: 'POST',
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                showToast('✅ Pengajuan izin berhasil dikirim! Menunggu persetujuan admin.', 'success');
                document.getElementById('izinAlasan').value = '';
                document.getElementById('izinFormContainer').style.display = 'none';
                document.getElementById('izinToggleIcon').className = 'fas fa-chevron-down';
                loadRiwayatIzin();
                await sendTelegram('📢 <b>PENGAJUAN IZIN</b>\n👤 ' + user.nama + '\n🆔 ' + user.id + '\n📅 ' + tanggal + '\n📝 ' + alasan + '\n⏳ Status: PENDING');
            } else {
                var error = await response.text();
                showToast('❌ Gagal mengajukan izin: ' + error, 'error');
            }
        } catch(e) {
            console.error('Error ajukan izin:', e);
            showToast('❌ Gagal koneksi!', 'error');
        }
    }

    // ============================================================
    // LOAD RANKING
    // ============================================================
    async function loadRanking(force) {
        force = force || false;
        var cacheKey = 'cache_ranking_' + user.id;

        if (!force) {
            var cached = getCache(cacheKey);
            if (cached) {
                statusData.ranking = cached;
                renderRanking();
                return true;
            }
        }

        try {
            var userRes = await fetch(
                SUPABASE_URL + '/rest/v1/karyawan?select=divisi&id=eq.' + user.id,
                {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
                    }
                }
            );
            var userData = await userRes.json();
            var divisi = userData[0]?.divisi;
            if (!divisi) {
                setCache(cacheKey, [], 300000);
                statusData.ranking = [];
                renderRanking();
                return [];
            }

            var anggotaRes = await fetch(
                SUPABASE_URL + '/rest/v1/karyawan?select=id,nama,divisi&divisi=eq.' + encodeURIComponent(divisi),
                {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
                    }
                }
            );
            var anggota = await anggotaRes.json();
            if (!anggota || anggota.length === 0) {
                setCache(cacheKey, [], 300000);
                statusData.ranking = [];
                renderRanking();
                return [];
            }

            var today = getTodayIndonesia();
            var ranking = [];

            for (var i = 0; i < anggota.length; i++) {
                var ang = anggota[i];
                var absenRes = await fetch(
                    SUPABASE_URL + '/rest/v1/absensi?select=jam_masuk&karyawan_id=eq.' + ang.id + '&tanggal=eq.' + today,
                    {
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
                        }
                    }
                );
                var absen = await absenRes.json();
                var record = absen[0] || {};

                var keyLibur = today + '|' + ang.divisi;
                var isLibur = hariLiburMap[keyLibur] || false;

                var status = 'alfa';
                var jam = '--:--';
                var selisih = 0;

                if (isLibur) {
                    status = 'libur';
                    jam = '🔵 Libur';
                } else if (record.jam_masuk) {
                    status = 'hadir';
                    jam = record.jam_masuk;
                    var target = '08:00';
                    var targetMin = parseTime(target);
                    var jamMin = parseTime(record.jam_masuk);
                    if (targetMin !== null && jamMin !== null) {
                        selisih = jamMin - targetMin;
                    }
                }

                ranking.push({
                    id: ang.id,
                    nama: ang.nama,
                    jam: jam,
                    status: status,
                    selisih: selisih
                });
            }

            ranking.sort(function(a, b) {
                if (a.status === 'hadir' && b.status !== 'hadir') return -1;
                if (a.status !== 'hadir' && b.status === 'hadir') return 1;
                if (a.status === 'libur' && b.status !== 'libur') return 1;
                if (a.status !== 'libur' && b.status === 'libur') return -1;
                if (a.jam !== '--:--' && b.jam !== '--:--' && a.jam !== '🔵 Libur' && b.jam !== '🔵 Libur') {
                    return a.jam.localeCompare(b.jam);
                }
                return 0;
            });

            setCache(cacheKey, ranking, 300000);
            statusData.ranking = ranking;
            renderRanking();
            return ranking;

        } catch(e) {
            console.error('Load ranking error:', e);
            return [];
        }
    }

    function renderRanking() {
        var container = document.getElementById('rankingList');
        var ranking = statusData.ranking || [];

        if (ranking.length === 0) {
            container.innerHTML = '<div style="text-align:center;color:#64748b;padding:14px 0;font-size:12px;"><i class="fas fa-inbox"></i> Belum ada data ranking</div>';
            return;
        }

        var html = '';
        var userIndex = -1;

        ranking.forEach(function(item, index) {
            var isYou = item.id === user.id;
            if (isYou) userIndex = index;

            var rankClass = 'normal';
            var rankDisplay = '#' + (index + 1);

            if (index === 0) { rankClass = 'gold'; rankDisplay = '🥇'; }
            else if (index === 1) { rankClass = 'silver'; rankDisplay = '🥈'; }
            else if (index === 2) { rankClass = 'bronze'; rankDisplay = '🥉'; }

            var statusBadge = '', statusClass = '';

            if (item.status === 'hadir') {
                var telat = item.selisih || 0;
                if (telat <= 5) { statusBadge = 'On Time'; statusClass = 'on-time'; }
                else if (telat <= 30) { statusBadge = '+' + telat + "'"; statusClass = 'late'; }
                else { statusBadge = '+' + telat + "'"; statusClass = 'very-late'; }
            } else if (item.status === 'libur') {
                statusBadge = '🔵 Libur';
                statusClass = 'liburan';
            } else if (item.status === 'alfa') {
                statusBadge = 'Alfa';
                statusClass = 'alfa';
            }

            var youClass = isYou ? 'is-you' : '';
            var displayName = isYou ? '👤 ' + item.nama : item.nama;

            html += '<div class="ranking-item ' + youClass + '">';
            html += '<div class="rank ' + rankClass + '">' + rankDisplay + '</div>';
            html += '<div class="name">' + displayName + '</div>';
            html += '<div class="time">' + (item.jam || '--:--') + '</div>';
            if (statusBadge) {
                html += '<div class="status-badge ' + statusClass + '">' + statusBadge + '</div>';
            }
            html += '</div>';

            if (isYou && index > 0 && index < ranking.length - 1) {
                html += '<hr class="ranking-divider">';
            }
        });

        container.innerHTML = html;

        if (userIndex >= 0) {
            setTimeout(function() {
                var items = container.querySelectorAll('.ranking-item');
                if (items[userIndex]) {
                    items[userIndex].scrollIntoView({ block: 'center', behavior: 'smooth' });
                }
            }, 300);
        }
    }

    // ============================================================
    // SYNC STATUS
    // ============================================================
    async function syncStatus() {
        await loadHariLibur();
        await loadStatus(false);
        await loadRanking(false);
        await loadRiwayatIzin();
        await checkIzinHariIni();

        setTimeout(async function() {
            await loadStatus(true);
            await loadRanking(true);
        }, 1000);

    function navigateTo(page, event) {
        if (event && event.currentTarget) {
            document.querySelectorAll('.bottom-nav .nav-item').forEach(function(el) {
                el.classList.remove('active');
            });
            event.currentTarget.classList.add('active');
        }
        if (page === 'stats') {
            window.location.href = 'stats.html';
        } else if (page === 'history') {
            window.location.href = 'history.html';

    }

        if (event && event.currentTarget) {
            document.querySelectorAll('.bottom-nav .nav-item').forEach(function(el) {
                el.classList.remove('active');
            });
            event.currentTarget.classList.add('active');

            localStorage.removeItem('user_pelem_5');
            window.location.href = 'login.html';

    // ============================================================
    // HANDLE FOTO UPLOAD
    // ============================================================
    function handleFotoUpload(event) {
        var file = event.target.files[0];
        if (!file) return;

        var allowedTypes = ['image/jpeg', 'image/jpg', 'image/png', 'image/webp'];
        if (!allowedTypes.includes(file.type)) {
            showToast('Format harus JPG, PNG, atau WEBP', 'error');
            event.target.value = '';
            return;
        }

        if (file.size > 2 * 1024 * 1024) {
            showToast('Ukuran maksimal 2MB', 'error');
            event.target.value = '';
            return;
        }

        var readerPreview = new FileReader();
        readerPreview.onload = function(e) {
            var img = document.getElementById('imgAvatar');
            img.src = e.target.result;
            img.style.display = 'block';
            document.getElementById('avatarPlaceholder').style.display = 'none';
        };
        readerPreview.readAsDataURL(file);

        showToast('Mengunggah foto... (belum tersedia di Supabase, hubungi admin)', 'warning');
        event.target.value = '';
    }

    // ============================================================
    // KEYBOARD SHORTCUT
    // ============================================================
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !isProcessing && !statusData.isLibur && statusData.isHariKerja !== false) {
            if (window.izinHariIniStatus === 'disetujui') {
                showToast('📝 Anda sedang izin hari ini!', 'warning');
                return;
            }
            if (!statusData.sudahMasuk) {
                handleAbsenClick('DATANG');
            } else if (!statusData.sudahPulang) {
                handleAbsenClick('PULANG');
            }
        }
    });

    // ============================================================
    // INIT
    // ============================================================
    console.log('🚀 Smart Presence loaded!');
    console.log('👤 User:', user.nama);
    console.log('🏢 Divisi:', user.divisi);

    // Set default tanggal izin = besok
    var tomorrow = new Date();

    document.getElementById('izinTanggal').value = tomorrow.toISOString().split('T')[0];

    // Izin form default hidden
    document.getElementById('izinFormContainer').style.display = 'none';

    (async function() {
        await loadHariLibur();
        await syncStatus();
        setInterval(function() {
            loadStatus(true);
            loadRanking(true);
        }, 60000);
    })();

    window.addEventListener('online', function() {
        document.getElementById('connectionStatus').textContent = 'Online';
        document.getElementById('connectionStatus').style.color = '#34d399';
        syncStatus();
    });
    window.addEventListener('offline', function() {
        document.getElementById('connectionStatus').textContent = 'Offline';
        document.getElementById('connectionStatus').style.color = '#ef4444';
    });

    console.log('✅ App ready!');
    console.log('🗓️ Today (WIB):', getTodayIndonesia());
