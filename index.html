<script>
    var SUPABASE_URL = 'https://zcaqqybonpfishwkmffg.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpjYXFxeWJvbnBmaXNod2ttZmZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2Mjc2NDgsImV4cCI6MjEwMzIwMzY0OH0.pBk5nwJI3u9n08onTNmvcOFxtCXQvv-ipYIu2f_iAiQ';
    var KANTOR = { lat: -7.749989456709709, lng: 112.17422484608356, rad: 250 };
    var TELE_TOKEN = "8752953879:AAEgOYUpFjAz5e5Xh67uhyk31_x7MfGrEHk";
    var TELE_CHAT_ID = "8014458366";

    var user = null;
    try {
        var raw = localStorage.getItem('user_pelem_5');
        if (!raw) throw new Error('No user data');
        user = JSON.parse(raw);
    } catch(e) {
        localStorage.removeItem('user_pelem_5');
        window.location.href = 'login.html';
    }

    function getTodayIndonesia() {
        var now = new Date();
        var offset = 7 * 60 * 60 * 1000;
        return new Date(now.getTime() + offset).toISOString().split('T')[0];
    }

    function getYesterdayIndonesia() {
        var now = new Date();
        var offset = 7 * 60 * 60 * 1000;
        var yesterday = new Date(now.getTime() + offset);
        yesterday.setDate(yesterday.getDate() - 1);
        return yesterday.toISOString().split('T')[0];
    }

    function showToast(msg, type) {
        type = type || 'success';
        var container = document.getElementById('toastContainer');
        container.innerHTML = '';
        var toast = document.createElement('div');
        toast.className = 'toast ' + type;
        toast.innerHTML = msg;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function updateClock() {
        var now = new Date();
        document.getElementById('clock').textContent = now.toTimeString().split(' ')[0];
        document.getElementById('date').textContent = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }
    setInterval(updateClock, 1000); updateClock();

    // ⭐ FUNGSI LOAD USER DATA YANG UDAH ADA FOTO
    function loadUserData() {
        document.getElementById('userName').textContent = user.nama || 'User';
        var divisi = (user.divisi || 'Relawan').split(' - ')[0];
        document.getElementById('userDivisi').textContent = divisi;
        document.getElementById('divisiBadge').textContent = divisi;
        document.getElementById('targetMasuk').textContent = user.jamMasuk || '08:00';
        document.getElementById('targetPulang').textContent = user.jamPulang || '17:00';

        // ⭐ TAMBAH: LOAD FOTO
        var img = document.getElementById('imgAvatar');
        var placeholder = document.getElementById('avatarPlaceholder');
        
        if (user.foto && user.foto !== '' && user.foto !== 'https://via.placeholder.com/150') {
            var url = user.foto;
            if (url.includes('drive.google.com')) {
                var match = url.match(/[-\w]{25,}/);
                if (match) url = 'https://lh3.googleusercontent.com/d/' + match[0];
            }
            img.src = url;
            img.style.display = 'block';
            placeholder.style.display = 'none';
            img.onerror = function() {
                img.style.display = 'none';
                placeholder.style.display = 'flex';
            };
        } else {
            img.style.display = 'none';
            placeholder.style.display = 'flex';
        }
    }
    loadUserData();

    var statusData = { sudahMasuk: false, sudahPulang: false, jamMasuk: null, jamPulang: null, activeRecordId: null };

    async function loadStatus() {
        try {
            var today = getTodayIndonesia();
            var yesterdayStr = getYesterdayIndonesia();

            var response = await fetch(`${SUPABASE_URL}/rest/v1/absensi?select=*&karyawan_id=eq.${user.id}&tanggal=eq.${today}`, {
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
            });
            var data = await response.json();
            var record = data[0] || null;

            if (!record || !record.jam_masuk) {
                var resYesterday = await fetch(`${SUPABASE_URL}/rest/v1/absensi?select=*&karyawan_id=eq.${user.id}&tanggal=eq.${yesterdayStr}&jam_pulang=is.null`, {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
                });
                var dataYesterday = await resYesterday.json();
                if (dataYesterday && dataYesterday.length > 0) {
                    record = dataYesterday[0];
                }
            }

            if (record) {
                statusData.sudahMasuk = !!record.jam_masuk;
                statusData.sudahPulang = !!record.jam_pulang;
                statusData.jamMasuk = record.jam_masuk;
                statusData.jamPulang = record.jam_pulang;
                statusData.activeRecordId = record.id;
            }

            updateUI();
            updateFabButton();
        } catch(e) { console.error(e); }
    }

    function updateUI() {
        document.getElementById('statusMasuk').textContent = statusData.jamMasuk || '--:--';
        document.getElementById('statusMasukSub').textContent = statusData.sudahMasuk ? '✅ Sudah absen' : '⏳ Belum absen';
        document.getElementById('statusPulang').textContent = statusData.jamPulang || '--:--';
        document.getElementById('statusPulangSub').textContent = statusData.sudahPulang ? '✅ Sudah absen' : '⏳ Belum absen';
    }

    function updateFabButton() {
        var btn = document.getElementById('fabAbsen');
        var text = document.getElementById('fabText');
        btn.className = 'fab-btn'; btn.disabled = false;

        if (statusData.sudahMasuk && statusData.sudahPulang) {
            btn.classList.add('btn-selesai'); btn.disabled = true;
            text.textContent = '✅ SELESAI';
        } else if (statusData.sudahMasuk && !statusData.sudahPulang) {
            btn.classList.add('btn-pulang'); text.textContent = '📤 ABSEN PULANG';
        } else {
            btn.classList.add('btn-datang'); text.textContent = '📥 ABSEN MASUK';
        }
    }

    async function handleAbsenClick() {
        var today = getTodayIndonesia();
        var now = new Date();
        var jam = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

        if (!statusData.sudahMasuk) {
            var payload = { karyawan_id: user.id, tanggal: today, jam_masuk: jam, status: 'hadir' };
            await fetch(`${SUPABASE_URL}/rest/v1/absensi`, {
                method: 'POST',
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            showToast('✅ Absen masuk berhasil!', 'success');
        } else if (!statusData.sudahPulang) {
            await fetch(`${SUPABASE_URL}/rest/v1/absensi?id=eq.${statusData.activeRecordId}`, {
                method: 'PATCH',
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({ jam_pulang: jam, status: 'pulang' })
            });
            showToast('✅ Absen pulang berhasil!', 'success');
        }

        loadStatus();
    }

    async function loadRanking() {
        var today = getTodayIndonesia();
        var container = document.getElementById('rankingList');
        
        try {
            var anggotaRes = await fetch(`${SUPABASE_URL}/rest/v1/karyawan?select=id,nama&divisi=eq.${encodeURIComponent(user.divisi)}`, {
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
            });
            var anggota = await anggotaRes.json();
            var ids = anggota.map(a => a.id).join(',');

            var absenRes = await fetch(`${SUPABASE_URL}/rest/v1/absensi?select=karyawan_id,jam_masuk&tanggal=eq.${today}&karyawan_id=in.(${ids})`, {
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
            });
            var absenData = await absenRes.json();
            var absenMap = {};
            (absenData || []).forEach(a => { absenMap[a.karyawan_id] = a; });

            var html = '';
            anggota.forEach((ang, idx) => {
                var rec = absenMap[ang.id] || {};
                var isYou = ang.id === user.id ? 'is-you' : '';
                html += `<div class="ranking-item ${isYou}">
                    <div class="rank">#${idx+1}</div>
                    <div class="name">${ang.nama}</div>
                    <div class="time">${rec.jam_masuk || '--:--'}</div>
                </div>`;
            });
            container.innerHTML = html;
        } catch(e) { console.error(e); }
    }

    function toggleIzinForm() {
        var container = document.getElementById('izinFormContainer');
        var icon = document.getElementById('izinToggleIcon');
        if (container.style.display === 'none' || container.style.display === '') {
            container.style.display = 'block';
            icon.className = 'fas fa-chevron-up';
        } else {
            container.style.display = 'none';
            icon.className = 'fas fa-chevron-down';
        }
    }

    async function ajukanIzin() {
        var tanggal = document.getElementById('izinTanggal').value;
        var alasan = document.getElementById('izinAlasan').value;
        if (!tanggal) { showToast('Pilih tanggal!', 'error'); return; }
        if (!alasan) { showToast('Pilih alasan!', 'error'); return; }

        var today = getTodayIndonesia();
        if (tanggal <= today) { showToast('Izin minimal H-1!', 'error'); return; }

        try {
            var response = await fetch(`${SUPABASE_URL}/rest/v1/izin`, {
                method: 'POST',
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({ karyawan_id: user.id, tanggal: tanggal, alasan: alasan, status: 'pending' })
            });
            if (response.ok) {
                showToast('✅ Izin diajukan! Tunggu approval admin.', 'success');
                document.getElementById('izinFormContainer').style.display = 'none';
                document.getElementById('izinToggleIcon').className = 'fas fa-chevron-down';
                loadRiwayatIzin();
            }
        } catch(e) { showToast('❌ Gagal kirim izin!', 'error'); }
    }

    async function loadRiwayatIzin() {
        var container = document.getElementById('izinRiwayatContainer');
        try {
            var response = await fetch(`${SUPABASE_URL}/rest/v1/izin?select=*&karyawan_id=eq.${user.id}&order=created_at.desc&limit=5`, {
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
            });
            var data = await response.json();
            if (!data || data.length === 0) {
                container.innerHTML = '<div style="text-align:center;color:#64748b;padding:8px 0;">Belum ada riwayat izin</div>';
                return;
            }
            var html = '';
            data.forEach(item => {
                var statusLabel = item.status === 'pending' ? '⏳ Pending' : item.status === 'disetujui' ? '✅ Disetujui' : '❌ Ditolak';
                html += `<div class="izin-item"><div class="info"><strong>${item.tanggal}</strong> <span class="alasan">${item.alasan}</span></div><span class="status ${item.status}">${statusLabel}</span></div>`;
            });
            container.innerHTML = html;
        } catch(e) { console.error(e); }
    }

    function navigateTo(page, event) {
        if (event && event.currentTarget) {
            document.querySelectorAll('.bottom-nav .nav-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }
        if (page === 'stats') window.location.href = 'stats.html';
        if (page === 'history') window.location.href = 'history.html';
    }

    function doLogout(event) {
        if (event && event.currentTarget) {
            document.querySelectorAll('.bottom-nav .nav-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }
        if (confirm('Yakin ingin keluar?')) {
            localStorage.removeItem('user_pelem_5');
            window.location.href = 'login.html';
        }
    }

    function handleFotoUpload(event) {
        var file = event.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(e) {
            var img = document.getElementById('imgAvatar');
            img.src = e.target.result;
            img.style.display = 'block';
            document.getElementById('avatarPlaceholder').style.display = 'none';
        };
        reader.readAsDataURL(file);
        showToast('📸 Foto diperbarui (lokal)', 'success');
        event.target.value = '';
    }

    // INIT
    loadStatus();
    loadRanking();
    loadRiwayatIzin();

    // Set default tanggal izin = besok
    var tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    document.getElementById('izinTanggal').value = tomorrow.toISOString().split('T')[0];
    document.getElementById('izinFormContainer').style.display = 'none';
</script>
