<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Absensi Relawan • Smart Presence</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 10% 20%, #0a0f2a, #030617);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .glass-card {
            max-width: 500px;
            width: 100%;
            background: rgba(15, 25, 45, 0.55);
            backdrop-filter: blur(16px);
            border-radius: 48px;
            padding: 32px 24px 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.08);
            transition: all 0.3s;
        }
        .profile {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 28px;
        }
        .avatar {
            width: 70px;
            height: 70px;
            background: linear-gradient(145deg, #a855f7, #3b82f6);
            border-radius: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
            box-shadow: 0 8px 20px rgba(168, 85, 247, 0.3);
        }
        .avatar img {
            width: 70px;
            height: 70px;
            border-radius: 35px;
            object-fit: cover;
        }
        .info h2 {
            font-size: 22px;
            font-weight: 700;
            color: white;
            letter-spacing: -0.3px;
        }
        .info p {
            font-size: 13px;
            color: #64748b;
            margin-top: 4px;
            font-weight: 500;
        }
        .time-panel {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 36px;
            padding: 24px 20px;
            text-align: center;
            margin-bottom: 28px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .clock {
            font-size: 56px;
            font-weight: 800;
            font-family: monospace;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #f0f9ff, #c7d2fe);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }
        .date {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 10px;
            font-weight: 500;
        }
        .schedule {
            display: flex;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.04);
            padding: 16px 20px;
            border-radius: 32px;
            margin-bottom: 32px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .schedule div {
            color: #cbd5e1;
        }
        .schedule span {
            color: #ffffff;
            font-weight: 700;
            margin-left: 6px;
        }
        .btn-group {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }
        button {
            flex: 1;
            padding: 18px 0;
            border: none;
            border-radius: 28px;
            font-size: 16px;
            font-weight: 800;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.06);
            color: #64748b;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        button.active-masuk {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            box-shadow: 0 10px 20px -5px rgba(16, 185, 129, 0.4);
        }
        button.active-pulang {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
            box-shadow: 0 10px 20px -5px rgba(249, 115, 22, 0.4);
        }

            transform: scale(0.97);
        }
