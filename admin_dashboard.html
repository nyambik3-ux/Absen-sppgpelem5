<!-- ===== BULK EDIT ===== -->
<div class="bulk-edit-section" style="background:rgba(0,0,0,0.15);border-radius:16px;padding:20px;margin-bottom:20px;border:1px solid rgba(255,255,255,0.06);">
    <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-bottom:16px;">
        <label style="font-weight:600;color:#94a3b8;">👤 Pilih Karyawan:</label>
        <select id="bulkKaryawan" style="padding:10px 16px;border-radius:10px;background:rgba(0,0,0,0.3);color:white;border:1px solid rgba(255,255,255,0.1);font-family:'Inter',sans-serif;flex:1;min-width:200px;">
            <option value="">-- Pilih Karyawan --</option>
        </select>
        <button class="btn-success" onclick="bulkSimpan()" style="padding:10px 20px;">
            <i class="fas fa-save"></i> Simpan Semua
        </button>
        <button class="btn-danger" onclick="bulkReset()" style="padding:10px 20px;">
            <i class="fas fa-undo"></i> Reset Alfa
        </button>
    </div>
    <div id="bulkGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:8px;">
        <div style="text-align:center;color:#64748b;padding:20px 0;grid-column:1/-1;">Pilih karyawan untuk mulai edit</div>
    </div>
    <div style="margin-top:12px;font-size:11px;color:#64748b;">
        💡 Klik kotak untuk toggle status (✅ Hadir / ❌ Alfa)
    </div>
</div>
