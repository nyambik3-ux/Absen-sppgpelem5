<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Dashboard • Smart Presence</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            min-height: 100vh;
            color: #e2e8f0;
            padding: 20px;
        }
        body.light-mode { background: #f1f5f9; color: #1e293b; }
        
        .navbar {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 16px;
            max-width: 1400px;
            margin: 0 auto 20px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        body.light-mode .navbar { background: rgba(255,255,255,0.85); border-color: rgba(0,0,0,0.06); }
        
        .logo h2 {
            font-size: 20px;
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .logo span { font-size: 12px; color: #64748b; }
        
        .nav-actions { display: flex; gap: 12px; align-items: center; }
        .nav-actions button {
            padding: 8px 16px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .nav-actions button:active { transform: scale(0.95); }
        .btn-logout { background: #ef4444; color: white; }
        .btn-logout:hover { background: #dc2626; }
        .btn-theme { background: #1e293b; color: #e2e8f0; }
        body.light-mode .btn-theme { background: #e2e8f0; color: #1e293b; }
        
        .container { max-width: 1400px; margin: 0 auto; }
        
        .filter-card {
            background: rgba(255,255,255,0.04);
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.06);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 16px;
        }
        body.light-mode .filter-card { background: white; border-color: rgba(0,0,0,0.06); }
        
        .filter-card label { font-size: 13px; font-weight: 600; color: #94a3b8; }
        .filter-card input[type="date"] {
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.3);
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
        }
        body.light-mode .filter-card input[type="date"] { background: #f1f5f9; color: #1e293b; border-color: #cbd5e1; }
        .filter-card .btn-primary {
            padding: 10px 24px;
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
        }
        .filter-card .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(168,85,247,0.4); }
        .filter-card .btn-success {
            padding: 10px 20px;
            background: #10b981;
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
        }
        .filter-card .btn-danger {
            padding: 10px 20px;
            background: #ef4444;
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
        }
        .filter-card .btn-refresh {
            padding: 10px 20px;
            background: #6366f1;
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
        }
        
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }
        .summary-card {
            background: rgba(255,255,255,0.04);
            border-radius: 14px;
            padding: 16px 20px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        body.light-mode .summary-card { background: white; border-color: rgba(0,0,0,0.06); }
        .summary-card .num { font-size: 28px; font-weight: 800; }
        .summary-card .label { font-size: 12px; color: #64748b; font-weight: 500; margin-top: 2px; }
        .summary-card .num.hadir { color: #34d399; }
        .summary-card .num.telat { color: #fb923c; }
        .summary-card .num.alfa { color: #f87171; }
        .summary-card .num.total { color: #60a5fa; }
        
        .table-container {
            background: rgba(255,255,255,0.04);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.06);
            overflow-x: auto;
        }
        body.light-mode .table-container { background: white; border-color: rgba(0,0,0,0.06); }
        
        .table-container h3 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.06); }
        body.light-mode th, body.light-mode td { border-bottom-color: #e2e8f0; }
        
        th {
            font-weight: 600;
            color: #94a3b8;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: sticky;
            top: 0;
            background: rgba(15,23,42,0.95);
        }
        body.light-mode th { background: #f8fafc; color: #64748b; }
        
        td .status-icon {
            font-size: 18px;
            display: inline-block;
            width: 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            padding: 4px 8px;
            border-radius: 8px;
        }
        td .status-icon:hover {
            transform: scale(1.2);
            background: rgba(255,255,255,0.1);
        }
        td .status-icon.hadir { color: #34d399; }
        td .status-icon.telat { color: #fb923c; }
        td .status-icon.alfa { color: #f87171; }
        td .status-icon.izin { color: #60a5fa; }
        
        .clickable-name {
            color: #60a5fa;
            cursor: pointer;
            font-weight: 600;
        }
        .clickable-name:hover { text-decoration: underline; }
        
        .badge-akum {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
        }
        .badge-akum.high { background: rgba(16,185,129,0.2); color: #34d399; }
        .badge-akum.medium { background: rgba(251,146,60,0.2); color: #fb923c; }
        .badge-akum.low { background: rgba(239,68,68,0.2); color: #f87171; }
        
        /* Quick Edit Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .modal-overlay.active { display: flex; }
        
        .modal-card {
            background: #1e293b;
            border-radius: 24px;
            padding: 32px;
            width: 90%;
            max-width: 480px;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        body.light-mode .modal-card { background: white; border-color: rgba(0,0,0,0.06); }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .modal-header h2 { font-size: 18px; font-weight: 700; }
        .modal-close {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 24px;
            cursor: pointer;
        }
        .modal-close:hover { color: white; }
        
        .quick-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 16px 0;
        }
        .quick-options .opt-btn {
            padding: 16px;
            border: 2px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            background: rgba(0,0,0,0.2);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
            text-align: center;
        }
        .quick-options .opt-btn:active { transform: scale(0.95); }
        .quick-options .opt-btn.hadir { border-color: #34d399; color: #34d399; }
        .quick-options .opt-btn.hadir:hover { background: rgba(16,185,129,0.2); }
        .quick-options .opt-btn.telat { border-color: #fb923c; color: #fb923c; }
        .quick-options .opt-btn.telat:hover { background: rgba(251,146,60,0.2); }
        .quick-options .opt-btn.alfa { border-color: #f87171; color: #f87171; }
        .quick-options .opt-btn.alfa:hover { background: rgba(239,68,68,0.2); }
        .quick-options .opt-btn.izin { border-color: #60a5fa; color: #60a5fa; }
        .quick-options .opt-btn.izin:hover { background: rgba(96,165,250,0.2); }
        
        .modal-footer {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,0.06);
            justify-content: flex-end;
        }
        .modal-footer button {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: all 0.2s;
        }
        .modal-footer button:active { transform: scale(0.95); }
        .btn-cancel { background: #1e293b; color: #94a3b8; }
        .btn-cancel:hover { background: #334155; }
        body.light-mode .btn-cancel { background: #e2e8f0; color: #64748b; }
        body.light-mode .btn-cancel:hover { background: #cbd5e1; }
        
        .loading-text { text-align: center; color: #64748b; padding: 40px 0; font-size: 14px; }
        .empty-text { text-align: center; color: #64748b; padding: 30px 0; font-size: 14px; }
        
        @media (max-width: 768px) {
            .navbar { flex-wrap: wrap; gap: 10px; padding: 12px 16px; }
            .nav-actions { flex-wrap: wrap; }
            .filter-card { flex-direction: column; align-items: stretch; }
            .filter-card input[type="date"] { width: 100%; }
            .summary-grid { grid-template-columns: 1fr 1fr; }
            .modal-card { padding: 20px; margin: 10px; }
            table { font-size: 11px; }
            th, td { padding: 6px 8px; }
            td .status-icon { font-size: 14px; width: 18px; }
            .quick-options { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 480px) {
            .summary-grid { grid-template-columns: 1fr; }
            .quick-options { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="logo">
        <h2>📋 RelawanTrack</h2>
        <span>Admin Dashboard</span>
    </div>
    <div class="nav-actions">
        <button class="btn-theme" onclick="toggleTheme()">
            <i class="fas fa-moon" id="themeIcon"></i>
        </button>
        <span id="adminName" style="font-weight:600;font-size:14px;">Admin</span>
        <button class="btn-logout" onclick="doLogout()">
            <i class="fas fa-sign-out-alt"></i> Keluar
        </button>
    </div>
</nav>

<div class="container">

    <!-- FILTER -->
    <div class="filter-card">
        <label><i class="fas fa-calendar-alt"></i> Periode:</label>
        <input type="date" id="startDate">
        <span style="color:#64748b;">s/d</span>
        <input type="date" id="endDate">
        <button class="btn-primary" onclick="loadRekap()">
            <i class="fas fa-search"></i> Tampilkan
        </button>
        <button class="btn-success" onclick="exportExcel()">
            <i class="fas fa-file-excel"></i> Excel
        </button>
        <button class="btn-danger" onclick="exportPDF()">
            <i class="fas fa-file-pdf"></i> PDF
        </button>
        <button class="btn-refresh" onclick="refreshData()">
            <i class="fas fa-sync-alt"></i>
        </button>
    </div>

    <!-- SUMMARY -->
    <div class="summary-grid" id="summaryGrid">
        <div class="summary-card">
            <div class="num total" id="totalKaryawan">0</div>
            <div class="label">👥 Total Karyawan</div>
        </div>
        <div class="summary-card">
            <div class="num hadir" id="totalHadir">0</div>
            <div class="label">✅ Total Hadir</div>
        </div>
        <div class="summary-card">
            <div class="num telat" id="totalTelat">0</div>
            <div class="label">⏰ Total Telat</div>
        </div>
        <div class="summary-card">
            <div class="num alfa" id="totalAlfa">0</div>
            <div class="label">❌ Total Alfa</div>
        </div>
    </div>

    <!-- TABLE -->
    <div class="table-container">
        <h3><i class="fas fa-table" style="color:#a855f7;"></i> Rekapitulasi Absensi</h3>
        <div id="tableWrapper">
            <div class="loading-text"><i class="fas fa-spinner fa-pulse"></i> Memuat data...</div>
        </div>
    </div>
</div>

<!-- QUICK EDIT MODAL -->
<div class="modal-overlay" id="modalEdit">
    <div class="modal-card">
        <div class="modal-header">
            <h2 id="modalTitle">✏️ Edit Absensi</h2>
            <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body" id="modalBody">
            <p style="color:#94a3b8;font-size:14px;margin-bottom:12px;" id="modalInfo">Pilih status untuk <strong id="modalNama"></strong> - <span id="modalTanggal"></span></p>
            <div class="quick-options">
                <button class="opt-btn hadir" onclick="quickUpdate('hadir')">✅ Hadir</button>
                <button class="opt-btn telat" onclick="quickUpdate('telat')">⏰ Telat</button>
                <button class="opt-btn alfa" onclick="quickUpdate('alfa')">❌ Alfa</button>
                <button class="opt-btn izin" onclick="quickUpdate('izin')">📝 Izin</button>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-cancel" onclick="closeModal()">Tutup</button>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // KONFIGURASI SUPABASE
    // ============================================================
    const SUPABASE_URL = 'https://zcaqqybonpfishwkmffg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpjYXFxeWJvbnBmaXNod2ttZmZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2Mjc2NDgsImV4cCI6MjEwMzIwMzY0OH0.pBk5nwJI3u9n08onTNmvcOFxtCXQvv-ipYIu2f_iAiQ';

    // ============================================================
    // CEK LOGIN
    // ============================================================
    if (!localStorage.getItem('admin_logged_in')) {
        window.location.href = 'admin_login.html';
    }
    document.getElementById('adminName').textContent = localStorage.getItem('admin_username') || 'Admin';

    // ============================================================
    // VARIABLES
    // ============================================================
    let currentData = [];
    let currentEdit = null; // { id, karyawan_id, tanggal, jam_masuk, jam_pulang, status }

    // ============================================================
    // THEME
    // ============================================================
    function toggleTheme() {
        document.body.classList.toggle('light-mode');
        const icon = document.getElementById('themeIcon');
        icon.className = document.body.classList.contains('light-mode') ? 'fas fa-sun' : 'fas fa-moon';
    }

    // ============================================================
    // TOAST
    // ============================================================
    function showToast(msg, type = 'success') {
        const existing = document.querySelector('.toast-custom');
        if (existing) existing.remove();
        const toast = document.createElement('div');
        toast.className = 'toast-custom';
        const colors = { success: '#10b981', error: '#ef4444', warning: '#f59e0b', info: '#3b82f6' };
        toast.style.cssText = `
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #1e293b; color: white; padding: 14px 28px; border-radius: 16px;
            font-weight: 600; font-size: 14px; z-index: 9999;
            border-left: 4px solid ${colors[type] || '#10b981'};
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            animation: slideUp 0.3s ease; max-width: 90%;
            font-family: 'Inter', sans-serif;
        `;
        const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
        toast.innerHTML = `${icons[type] || 'ℹ️'} ${msg}`;
        document.body.appendChild(toast);
        setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateX(-50%) translateY(20px)'; setTimeout(() => toast.remove(), 300); }, 3000);
    }

    // ============================================================
    // SET DEFAULT DATE
    // ============================================================
    function setDefaultDates() {
        const today = new Date();
        const end = today.toISOString().split('T')[0];
        const start = new Date(today);
        start.setDate(start.getDate() - 6);
        document.getElementById('startDate').value = start.toISOString().split('T')[0];
        document.getElementById('endDate').value = end;
    }
    setDefaultDates();

    // ============================================================
    // LOAD REKAP
    // ============================================================
    async function loadRekap() {
        const start = document.getElementById('startDate').value;
        const end = document.getElementById('endDate').value;
        if (!start || !end) { showToast('Pilih tanggal!', 'warning'); return; }

        const wrapper = document.getElementById('tableWrapper');
        wrapper.innerHTML = '<div class="loading-text"><i class="fas fa-spinner fa-pulse"></i> Memuat data...</div>';

        try {
            // 1. Karyawan
            const karyawanRes = await fetch(`${SUPABASE_URL}/rest/v1/karyawan?select=id,nama,divisi`, {
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
            });
            const karyawan = await karyawanRes.json();

            // 2. Absensi periode
            const absenRes = await fetch(
                `${SUPABASE_URL}/rest/v1/absensi?select=*&tanggal=gte.${start}&tanggal=lte.${end}`,
                {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                }
            );
            const absensi = await absenRes.json();

            // 3. Build map
            const absenMap = {};
            absensi.forEach(a => {
                const key = a.karyawan_id + '|' + a.tanggal;
                absenMap[key] = a;
            });

            // 4. Date list
            const dateList = [];
            const dStart = new Date(start);
            const dEnd = new Date(end);
            for (let d = new Date(dStart); d <= dEnd; d.setDate(d.getDate() + 1)) {
                dateList.push(d.toISOString().split('T')[0]);
            }

            // 5. Build data
            currentData = [];
            let totalHadir = 0, totalTelat = 0, totalAlfa = 0;

            karyawan.forEach(k => {
                const row = {
                    id: k.id,
                    nama: k.nama || k.id,
                    divisi: k.divisi || '-',
                    dates: [],
                    akumulasi: 0
                };

                dateList.forEach(tgl => {
                    const key = k.id + '|' + tgl;
                    const abs = absenMap[key];
                    let status = 'alfa';
                    let jamMasuk = '-', jamPulang = '-';
                    let absId = null;
                    
                    if (abs) {
                        absId = abs.id;
                        jamMasuk = abs.jam_masuk || '-';
                        jamPulang = abs.jam_pulang || '-';
                        if (abs.status === 'izin') {
                            status = 'izin';
                        } else if (abs.jam_pulang && abs.jam_pulang !== '') {
                            status = 'hadir';
                        } else if (abs.jam_masuk && abs.jam_masuk !== '') {
                            status = 'telat';
                        }
                    }
                    
                    row.dates.push({ 
                        tanggal: tgl, 
                        status, 
                        jamMasuk, 
                        jamPulang, 
                        id: absId,
                        absenId: absId
                    });
                    
                    if (status === 'hadir') { row.akumulasi++; totalHadir++; }
                    else if (status === 'telat') { totalTelat++; }
                    else if (status === 'alfa') { totalAlfa++; }
                });

                currentData.push(row);
            });

            renderTable(dateList);
            renderSummary(karyawan.length, totalHadir, totalTelat, totalAlfa);

        } catch(e) {
            console.error('Error:', e);
            wrapper.innerHTML = '<div class="empty-text"><i class="fas fa-exclamation-triangle"></i> Gagal memuat data</div>';
            showToast('Gagal memuat data!', 'error');
        }
    }

    // ============================================================
    // RENDER TABLE
    // ============================================================
    function renderTable(dateList) {
        const wrapper = document.getElementById('tableWrapper');
        if (currentData.length === 0) {
            wrapper.innerHTML = '<div class="empty-text"><i class="fas fa-inbox"></i> Tidak ada data</div>';
            return;
        }

        let html = '<table><thead><tr><th>No</th><th>Nama</th><th>Divisi</th>';
        dateList.forEach(tgl => {
            const d = new Date(tgl + 'T00:00:00');
            html += `<th>${d.getDate()}/${d.getMonth()+1}</th>`;
        });
        html += '<th>Akumulasi</th></tr></thead><tbody>';

        currentData.forEach((row, idx) => {
            html += `<tr>
                <td>${idx + 1}</td>
                <td><span class="clickable-name" onclick="openQuickEdit('${row.id}')">${row.nama}</span></td>
                <td>${row.divisi}</td>`;
            
            row.dates.forEach(d => {
                let icon, cls;
                if (d.status === 'hadir') { icon = '✅'; cls = 'hadir'; }
                else if (d.status === 'telat') { icon = '⏰'; cls = 'telat'; }
                else if (d.status === 'izin') { icon = '📝'; cls = 'izin'; }
                else { icon = '❌'; cls = 'alfa'; }
                
                // Klik icon untuk edit cepat
                html += `<td><span class="status-icon ${cls}" onclick="openQuickEditDate('${row.id}','${d.tanggal}')" title="Klik untuk edit">${icon}</span></td>`;
            });

            const akum = row.akumulasi;
            const totalDays = row.dates.length;
            const pct = (akum / totalDays) * 100;
            let badgeClass = 'low';
            if (pct >= 80) badgeClass = 'high';
            else if (pct >= 50) badgeClass = 'medium';
            
            html += `<td><span class="badge-akum ${badgeClass}">${akum}/${totalDays}</span></td>`;
            html += '</tr>';
        });

        html += '</tbody></table>';
        wrapper.innerHTML = html;
    }

    // ============================================================
    // RENDER SUMMARY
    // ============================================================
    function renderSummary(total, hadir, telat, alfa) {
        document.getElementById('totalKaryawan').textContent = total;
        document.getElementById('totalHadir').textContent = hadir;
        document.getElementById('totalTelat').textContent = telat;
        document.getElementById('totalAlfa').textContent = alfa;
    }

    // ============================================================
    // OPEN QUICK EDIT (klik nama)
    // ============================================================
    function openQuickEdit(id) {
        const karyawan = currentData.find(k => k.id === id);
        if (!karyawan) { showToast('Data tidak ditemukan', 'error'); return; }
        
        // Cari tanggal yang belum diisi atau alfa
        const firstDate = karyawan.dates.find(d => d.status === 'alfa' || d.status === 'izin');
        if (firstDate) {
            openQuickEditDate(id, firstDate.tanggal);
        } else {
            // Cari tanggal terakhir
            const lastDate = karyawan.dates[karyawan.dates.length - 1];
            if (lastDate) {
                openQuickEditDate(id, lastDate.tanggal);
            } else {
                showToast('Tidak ada data untuk diedit', 'warning');
            }
        }
    }

    // ============================================================
    // OPEN QUICK EDIT DATE (klik icon status)
    // ============================================================
    function openQuickEditDate(id, tanggal) {
        const karyawan = currentData.find(k => k.id === id);
        if (!karyawan) { showToast('Data tidak ditemukan', 'error'); return; }
        
        const dateData = karyawan.dates.find(d => d.tanggal === tanggal);
        if (!dateData) { showToast('Data tidak ditemukan', 'error'); return; }
        
        // Cari absen ID
        let absenId = dateData.absenId;
        const d = new Date(tanggal + 'T00:00:00');
        const tglDisplay = `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
        
        currentEdit = {
            id: absenId,
            karyawan_id: id,
            tanggal: tanggal,
            jam_masuk: dateData.jamMasuk !== '-' ? dateData.jamMasuk : '',
            jam_pulang: dateData.jamPulang !== '-' ? dateData.jamPulang : '',
            status: dateData.status
        };
        
        document.getElementById('modalNama').textContent = karyawan.nama;
        document.getElementById('modalTanggal').textContent = tglDisplay;
        document.getElementById('modalTitle').textContent = `✏️ Edit Absensi - ${karyawan.nama}`;
        document.getElementById('modalEdit').classList.add('active');
    }

    // ============================================================
    // QUICK UPDATE (langsung simpan)
    // ============================================================
    async function quickUpdate(newStatus) {
        if (!currentEdit) { showToast('Tidak ada data yang diedit', 'error'); return; }
        
        // Mapping status ke jam
        let jamMasuk = currentEdit.jam_masuk || null;
        let jamPulang = currentEdit.jam_pulang || null;
        
        if (newStatus === 'hadir') {
            // Jika belum ada jam, set default 08:00 dan 17:00
            if (!jamMasuk || jamMasuk === '') jamMasuk = '08:00';
            if (!jamPulang || jamPulang === '') jamPulang = '17:00';
        } else if (newStatus === 'telat') {
            if (!jamMasuk || jamMasuk === '') jamMasuk = '09:00';
            if (!jamPulang || jamPulang === '') jamPulang = '17:00';
        } else if (newStatus === 'izin') {
            jamMasuk = null;
            jamPulang = null;
        } else { // alfa
            jamMasuk = null;
            jamPulang = null;
        }
        
        const payload = {
            jam_masuk: jamMasuk,
            jam_pulang: jamPulang,
            status: newStatus
        };
        
        try {
            let response;
            
            if (currentEdit.id) {
                // Update existing
                response = await fetch(
                    `${SUPABASE_URL}/rest/v1/absensi?id=eq.${currentEdit.id}`,
                    {
                        method: 'PATCH',
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    }
                );
            } else {
                // Insert new
                const insertPayload = {
                    karyawan_id: currentEdit.karyawan_id,
                    tanggal: currentEdit.tanggal,
                    ...payload
                };
                response = await fetch(
                    `${SUPABASE_URL}/rest/v1/absensi`,
                    {
                        method: 'POST',
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(insertPayload)
                    }
                );
            }
            
            if (response.ok) {
                const statusLabel = { hadir: 'Hadir', telat: 'Telat', alfa: 'Alfa', izin: 'Izin' };
                showToast(`✅ Status diubah menjadi ${statusLabel[newStatus] || newStatus}!`, 'success');
                closeModal();
                loadRekap();
            } else {
                showToast('❌ Gagal menyimpan data', 'error');
            }
        } catch(e) {
            showToast('❌ Gagal koneksi ke server', 'error');
        }
    }

    // ============================================================
    // CLOSE MODAL
    // ============================================================
    function closeModal() {
        document.getElementById('modalEdit').classList.remove('active');
        currentEdit = null;
    }

    // ============================================================
    // EXPORT
    // ============================================================
    function exportExcel() {
        if (currentData.length === 0) { showToast('Tidak ada data', 'warning'); return; }
        const start = document.getElementById('startDate').value;
        const end = document.getElementById('endDate').value;
        let csv = `Rekapitulasi Absensi ${start} - ${end}\n\nNo,Nama,Divisi,`;
        const dateList = currentData[0]?.dates.map(d => d.tanggal) || [];
        dateList.forEach(tgl => {
            const d = new Date(tgl + 'T00:00:00');
            csv += `${d.getDate()}/${d.getMonth()+1},`;
        });
        csv += 'Akumulasi\n';
        
        currentData.forEach((row, idx) => {
            csv += `${idx+1},${row.nama},${row.divisi},`;
            row.dates.forEach(d => {
                const status = d.status === 'hadir' ? 'Hadir' : d.status === 'telat' ? 'Telat' : d.status === 'izin' ? 'Izin' : 'Alfa';
                csv += `${status},`;
            });
            csv += `${row.akumulasi}\n`;
        });
        
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `Rekap_Absensi_${start}_${end}.csv`;
        link.click();
        showToast('📥 Excel berhasil didownload!', 'success');
    }

    function exportPDF() {
        if (currentData.length === 0) { showToast('Tidak ada data', 'warning'); return; }
        window.print();
    }

    function refreshData() {
        loadRekap();
        showToast('🔄 Data diperbarui!', 'info');
    }

    function doLogout() {
        if (confirm('Yakin ingin keluar?')) {
            localStorage.removeItem('admin_logged_in');
            localStorage.removeItem('admin_username');
            window.location.href = 'admin_login.html';
        }
    }

    // ============================================================
    // INIT
    // ============================================================
    setTimeout(() => loadRekap(), 100);
    console.log('🛡️ Admin Dashboard loaded!');
</script>

</body>
