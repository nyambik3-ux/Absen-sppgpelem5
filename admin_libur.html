<script>
    // ============================================================
    // KONFIGURASI SUPABASE (SUDAH KAMU KASIH, PASTIKAN TIDAK SALAH KETIK)
    // ============================================================
    var SUPABASE_URL = 'https://zcaqqybonpfishwkmffg.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpjYXFxeWJvbnBmaXNod2ttZmZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2Mjc2NDgsImV4cCI6MjEwMzIwMzY0OH0.pBk5nwJI3u9n08onTNmvcOFxtCXQvv-ipYIu2f_iAiQ';

    // CEK LOGIN
    if (!localStorage.getItem('admin_logged_in')) window.location.href = 'admin_login.html';
    document.getElementById('adminName').textContent = localStorage.getItem('admin_username') || 'Admin';

    var divisiList = [];
    var hariList = ['senin', 'selasa', 'rabu', 'kamis', 'jumat', 'sabtu', 'minggu'];
    var hariLabel = {'senin':'Sen','selasa':'Sel','rabu':'Rab','kamis':'Kam','jumat':'Jum','sabtu':'Sab','minggu':'Min'};
    var hariIcon = {'senin':'🌙','selasa':'🌙','rabu':'🌙','kamis':'🌙','jumat':'🌙','sabtu':'☀️','minggu':'☀️'};

    // THEME
    function toggleTheme() { document.body.classList.toggle('light-mode'); document.getElementById('themeIcon').className = document.body.classList.contains('light-mode') ? 'fas fa-sun' : 'fas fa-moon'; }

    // TOAST
    function showToast(msg, type) {
        type = type || 'success'; var existing = document.querySelector('.toast-custom'); if (existing) existing.remove();
        var toast = document.createElement('div'); toast.className = 'toast-custom';
        var colors = { success: '#10b981', error: '#ef4444', warning: '#f59e0b', info: '#3b82f6' };
        toast.style.borderLeftColor = colors[type] || '#10b981';
        var icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
        toast.innerHTML = (icons[type] || 'ℹ️') + ' ' + msg; document.body.appendChild(toast);
        setTimeout(function() { toast.style.opacity = '0'; toast.style.transform = 'translateX(-50%) translateY(20px)'; setTimeout(function() { toast.remove(); }, 300); }, 3000);
    }

    // LOGOUT
    function doLogout() { if (confirm('Yakin ingin keluar?')) { localStorage.removeItem('admin_logged_in'); localStorage.removeItem('admin_username'); window.location.href = 'admin_login.html'; } }

    // TABS
    function switchTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(function(el) { el.classList.remove('active'); });
        document.querySelectorAll('.tabs button').forEach(function(el) { el.classList.remove('active'); });
        document.getElementById(tabId).classList.add('active'); btn.classList.add('active');
        if (tabId === 'tabHariKerja') loadHariKerjaAll();
    }

    // DATE HELPERS
    function getDaysInMonth(month, year) { return new Date(year, month, 0).getDate(); }
    function padZero(num) { return String(num).padStart(2, '0'); }
    function formatTanggalDisplay(dateStr) {
        var d = new Date(dateStr + 'T00:00:00'); var bulan = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
        return d.getDate() + ' ' + bulan[d.getMonth()] + ' ' + d.getFullYear();
    }

    // RADIO PERIODE
    document.querySelectorAll('input[name="periode"]').forEach(function(radio) {
        radio.addEventListener('change', function() {
            document.querySelectorAll('.radio-group label').forEach(function(label) { label.classList.toggle('active', label.querySelector('input').checked); });
            var val = document.querySelector('input[name="periode"]:checked').value;
            document.getElementById('opsiTanggal').classList.toggle('hidden', val !== 'tanggal');
            document.getElementById('opsiRentang').classList.toggle('hidden', val !== 'rentang');
            document.getElementById('opsiBulan').classList.toggle('hidden', val !== 'bulan');
        });
    });

    // LOAD DIVISI (DARI TABEL KARYAWAN, PALING AMAN)
    async function loadDivisi() {
        try {
            var response = await fetch(SUPABASE_URL + '/rest/v1/karyawan?select=divisi', {
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
            });
            var data = await response.json();

            if (!Array.isArray(data)) { console.error('Data tidak valid:', data); return; }

            var divisiSet = new Set();
            data.forEach(function(k) { if (k.divisi) divisiSet.add(k.divisi); });
            divisiList = Array.from(divisiSet).sort();

            var selectLibur = document.getElementById('pilihDivisiLibur');
            selectLibur.innerHTML = '<option value="__semua">Semua Divisi</option>';
            divisiList.forEach(function(d) { selectLibur.innerHTML += '<option value="' + d + '">' + d + '</option>'; });

            var selectHariKerja = document.getElementById('pilihDivisiHariKerja');
            selectHariKerja.innerHTML = '<option value="">-- Pilih Divisi --</option>';
            divisiList.forEach(function(d) { selectHariKerja.innerHTML += '<option value="' + d + '">' + d + '</option>'; });

        } catch(e) { console.error('Gagal load divisi:', e); }
    }

    // POPULATE TAHUN
    function populateTahun() {
        var select = document.getElementById('inputTahun'); var currentYear = new Date().getFullYear();
        for (var y = currentYear - 2; y <= currentYear + 1; y++) select.innerHTML += '<option value="' + y + '" ' + (y === currentYear ? 'selected' : '') + '>' + y + '</option>';
    }
    populateTahun();

    // ================= TAB LIBUR =================
    async function loadLibur() {
        var wrapper = document.getElementById('tableWrapperLibur'); wrapper.innerHTML = '<div class="loading-text"><i class="fas fa-spinner fa-pulse"></i> Memuat data...</div>';
        var divisi = document.getElementById('pilihDivisiLibur').value;
        try {
            var query = SUPABASE_URL + '/rest/v1/hari_libur?select=*&order=tanggal.desc';
            if (divisi !== '__semua') query += '&divisi=eq.' + encodeURIComponent(divisi);
            var response = await fetch(query, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY } });
            var allLibur = await response.json();
            document.getElementById('divisiLabelLibur').textContent = divisi === '__semua' ? '- Semua Divisi' : '- ' + divisi;

            if (!allLibur || allLibur.length === 0) { wrapper.innerHTML = '<div class="empty-text"><i class="fas fa-calendar-times"></i> Belum ada data libur</div>'; return; }
            var html = '<table><thead><tr><th>No</th><th>Tanggal</th><th>Divisi</th><th>Keterangan</th><th>Aksi</th></tr></thead><tbody>';
            allLibur.forEach(function(item, idx) {
                html += '<tr><td>' + (idx + 1) + '</td><td>' + formatTanggalDisplay(item.tanggal) + '</td><td><span class="badge-divisi">' + item.divisi + '</span></td><td>' + (item.keterangan || '-') + '</td><td><button class="btn-delete-small" onclick="hapusLibur(' + item.id + ')"><i class="fas fa-trash"></i> Hapus</button></td></tr>';
            });
            html += '</tbody></table>'; wrapper.innerHTML = html;
        } catch(e) { console.error('Error:', e); wrapper.innerHTML = '<div class="empty-text">Gagal memuat data</div>'; }
    }

    async function tambahLibur() {
        var divisi = document.getElementById('pilihDivisiLibur').value;
        var periode = document.querySelector('input[name="periode"]:checked').value;
        var keterangan = document.getElementById('inputKeterangan').value.trim() || 'Libur';
        var tanggalList = [];

        if (periode === 'tanggal') {
            var tanggal = document.getElementById('inputTanggal').value;
            if (!tanggal) { showToast('Pilih tanggal!', 'error'); return; }
            tanggalList.push(tanggal);
        } else if (periode === 'rentang') {
            var mulai = document.getElementById('inputTanggalMulai').value; var selesai = document.getElementById('inputTanggalSelesai').value;
            if (!mulai || !selesai) { showToast('Pilih rentang tanggal!', 'error'); return; }
            if (mulai > selesai) { showToast('Tanggal mulai harus sebelum selesai!', 'error'); return; }
            var d = new Date(mulai + 'T00:00:00'); var end = new Date(selesai + 'T00:00:00');
            while (d <= end) { tanggalList.push(d.toISOString().split('T')[0]); d.setDate(d.getDate() + 1); }
        } else {
            var bulan = parseInt(document.getElementById('inputBulan').value); var tahun = parseInt(document.getElementById('inputTahun').value);
            var days = getDaysInMonth(bulan, tahun);
            for (var i = 1; i <= days; i++) tanggalList.push(tahun + '-' + padZero(bulan) + '-' + padZero(i));
        }

        var divisiTarget = divisi === '__semua' ? divisiList : [divisi];
        if (divisiTarget.length === 0) { showToast('Tidak ada divisi yang dipilih!', 'error'); return; }

        var dataToInsert = [];
        for (var d = 0; d < divisiTarget.length; d++) for (var t = 0; t < tanggalList.length; t++) dataToInsert.push({ tanggal: tanggalList[t], divisi: divisiTarget[d], keterangan: keterangan });

        try {
            var response = await fetch(SUPABASE_URL + '/rest/v1/hari_libur', {
                method: 'POST', headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates' },
                body: JSON.stringify(dataToInsert)
            });
            if (response.ok) { showToast('✅ ' + dataToInsert.length + ' data libur berhasil ditambahkan!', 'success'); loadLibur(); }
            else { var err = await response.json(); showToast('❌ Gagal menambahkan: ' + (err.message || 'Unknown error'), 'error'); }
        } catch(e) { showToast('❌ Gagal koneksi!', 'error'); }
    }

    async function hapusLibur(id) {
        if (!confirm('Yakin ingin menghapus libur ini?')) return;
        try {
            var response = await fetch(SUPABASE_URL + '/rest/v1/hari_libur?id=eq.' + id, { method: 'DELETE', headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY } });
            if (response.ok) { showToast('🗑️ Libur berhasil dihapus!', 'success'); loadLibur(); }
        } catch(e) { showToast('❌ Gagal koneksi!', 'error'); }
    }

    async function hapusSemuaLibur() {
        var divisi = document.getElementById('pilihDivisiLibur').value; var divisiLabel = divisi === '__semua' ? 'Semua Divisi' : divisi;
        if (!confirm('Yakin ingin menghapus SEMUA data libur untuk ' + divisiLabel + '?')) return;
        try {
            var query = SUPABASE_URL + '/rest/v1/hari_libur'; if (divisi !== '__semua') query += '?divisi=eq.' + encodeURIComponent(divisi);
            var response = await fetch(query, { method: 'DELETE', headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY } });
            if (response.ok) { showToast('🗑️ Semua libur untuk ' + divisiLabel + ' berhasil dihapus!', 'success'); loadLibur(); }
        } catch(e) { showToast('❌ Gagal koneksi!', 'error'); }
    }

    // ================= TAB HARI KERJA (Menggunakan tabel KARYAWAN) =================
    
    async function loadHariKerjaDivisi() {
        var divisi = document.getElementById('pilihDivisiHariKerja').value;
        if (!divisi) {
            document.getElementById('hariKerjaContainer').innerHTML = '<div class="empty-text"><i class="fas fa-arrow-up" style="font-size:24px;display:block;margin-bottom:8px;"></i>Pilih divisi di atas untuk mulai mengatur hari kerja</div>';
            return;
        }

        try {
            // Ambil data dari tabel 'karyawan' untuk divisi ini
            var response = await fetch(SUPABASE_URL + '/rest/v1/karyawan?select=hari_masuk&divisi=eq.' + encodeURIComponent(divisi) + '&limit=1', {
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
            });
            var data = await response.json();

            var hariArray = [];
            if (data && data.length > 0 && data[0].hari_masuk) {
                try {
                    hariArray = typeof data[0].hari_masuk === 'string' ? JSON.parse(data[0].hari_masuk) : data[0].hari_masuk;
                } catch(e) { hariArray = []; }
            }

            if (!Array.isArray(hariArray) || hariArray.length === 0) hariArray = ['senin', 'selasa', 'rabu', 'kamis', 'jumat', 'sabtu', 'minggu'];

            renderHariKerjaForm(divisi, hariArray);

        } catch(e) { showToast('Gagal memuat data hari kerja!', 'error'); }
    }

    function renderHariKerjaForm(divisi, hariArray) {
        var container = document.getElementById('hariKerjaContainer');
        var html = '<div class="form-group"><label>📅 Hari Kerja untuk: <strong>' + divisi + '</strong></label><div class="hari-grid" id="hariKerjaGrid">';
        hariList.forEach(function(h) {
            var isChecked = hariArray.indexOf(h) !== -1;
            html += '<label class="' + (isChecked ? 'active' : '') + '" data-hari="' + h + '"><input type="checkbox" ' + (isChecked ? 'checked' : '') + '><span class="icon">' + hariIcon[h] + '</span><span class="text">' + hariLabel[h] + '</span></label>';
        });
        html += '</div><div class="form-hint">Centang hari kerja untuk divisi ' + divisi + '</div></div>';
        html += '<div class="btn-actions"><button class="btn-primary" onclick="simpanHariKerja()"><i class="fas fa-save"></i> Simpan</button><button class="btn-warning" onclick="resetHariKerja()"><i class="fas fa-undo"></i> Reset ke Default (7 hari)</button></div>';
        container.innerHTML = html;

        document.querySelectorAll('#hariKerjaGrid label').forEach(function(label) {
            label.addEventListener('click', function(e) {
                var checkbox = this.querySelector('input[type="checkbox"]'); checkbox.checked = !checkbox.checked; this.classList.toggle('active', checkbox.checked);
            });
        });
    }

    // Simpan hari kerja ke tabel 'karyawan' (Update semua karyawan di divisi itu)
    async function simpanHariKerja() {
        var divisi = document.getElementById('pilihDivisiHariKerja').value;
        if (!divisi) { showToast('Pilih divisi dulu!', 'warning'); return; }

        var labels = document.querySelectorAll('#hariKerjaGrid label');
        var hariArray = [];
        labels.forEach(function(label) {
            var checkbox = label.querySelector('input[type="checkbox"]');
            if (checkbox && checkbox.checked) hariArray.push(label.dataset.hari);
        });
        if (hariArray.length === 0) { showToast('Minimal 1 hari kerja harus dipilih!', 'error'); return; }

        try {
            // Update semua karyawan di divisi itu
            var response = await fetch(SUPABASE_URL + '/rest/v1/karyawan?divisi=eq.' + encodeURIComponent(divisi), {
                method: 'PATCH',
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({ hari_masuk: hariArray })
            });

            if (response.ok) {
                showToast('✅ Hari kerja untuk ' + divisi + ' berhasil disimpan!', 'success');
                loadHariKerjaAll();
                loadHariKerjaDivisi();
            } else { showToast('❌ Gagal menyimpan!', 'error'); }
        } catch(e) { showToast('❌ Gagal koneksi!', 'error'); }
    }

    async function resetHariKerja() {
        var divisi = document.getElementById('pilihDivisiHariKerja').value;
        if (!divisi) { showToast('Pilih divisi dulu!', 'warning'); return; }
        if (!confirm('Reset hari kerja untuk ' + divisi + ' ke default (Senin-Minggu)?')) return;

        var defaultHari = ['senin', 'selasa', 'rabu', 'kamis', 'jumat', 'sabtu', 'minggu'];
        try {
            var response = await fetch(SUPABASE_URL + '/rest/v1/karyawan?divisi=eq.' + encodeURIComponent(divisi), {
                method: 'PATCH', headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({ hari_masuk: defaultHari })
            });
            if (response.ok) { showToast('🔄 Hari kerja untuk ' + divisi + ' direset!', 'success'); loadHariKerjaAll(); loadHariKerjaDivisi(); }
        } catch(e) { showToast('❌ Gagal koneksi!', 'error'); }
    }

    // Load tabel semua divisi dari tabel 'karyawan'
    async function loadHariKerjaAll() {
        var wrapper = document.getElementById('tableWrapperHariKerja');
        wrapper.innerHTML = '<div class="loading-text"><i class="fas fa-spinner fa-pulse"></i> Memuat data...</div>';

        try {
            var response = await fetch(SUPABASE_URL + '/rest/v1/karyawan?select=divisi,hari_masuk', {
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
            });
            var data = await response.json();

            if (!Array.isArray(data) || data.length === 0) { wrapper.innerHTML = '<div class="empty-text">Belum ada data divisi</div>'; return; }

            var divisiMap = {};
            data.forEach(function(k) {
                if (!k.divisi) return;
                if (!divisiMap[k.divisi]) divisiMap[k.divisi] = [];
                var hariArray = [];
                try { hariArray = typeof k.hari_masuk === 'string' ? JSON.parse(k.hari_masuk) : (k.hari_masuk || []); } catch(e) { hariArray = []; }
                divisiMap[k.divisi].push(hariArray);
            });

            var html = '<table><thead><tr><th>No</th><th>Divisi</th><th>Hari Kerja</th><th>Jumlah Karyawan</th></tr></thead><tbody>';
            var keys = Object.keys(divisiMap).sort();
            if (keys.length === 0) { html += '<tr><td colspan="4" style="text-align:center;padding:20px;">Belum ada data</td></tr>'; }

            keys.forEach(function(divisi, idx) {
                var hariCount = {};
                divisiMap[divisi].forEach(function(arr) {
                    arr.forEach(function(h) { hariCount[h] = (hariCount[h] || 0) + 1; });
                });

                var totalKaryawan = divisiMap[divisi].length;
                var hariKerja = [];
                hariList.forEach(function(h) {
                    var count = hariCount[h] || 0;
                    var pct = Math.round((count / totalKaryawan) * 100);
                    if (pct > 50) hariKerja.push(h);
                });

                if (hariKerja.length === 0) hariKerja = ['senin', 'selasa', 'rabu', 'kamis', 'jumat', 'sabtu', 'minggu'];

                var hariHtml = '';
                hariList.forEach(function(h) {
                    var active = hariKerja.indexOf(h) !== -1;
                    hariHtml += '<span class="hari-badge' + (active ? '' : ' off') + '">' + hariLabel[h] + '</span>';
                });

                html += '<tr><td>' + (idx + 1) + '</td><td><span class="badge-divisi">' + divisi + '</span></td><td style="font-size:11px;">' + hariHtml + '</td><td>' + totalKaryawan + ' karyawan</td></tr>';
            });

            html += '</tbody></table>';
            wrapper.innerHTML = html;
        } catch(e) { console.error('Error:', e); wrapper.innerHTML = '<div class="empty-text">Gagal memuat data</div>'; }
    }

    // INIT
    loadDivisi();
    setTimeout(function() { loadLibur(); loadHariKerjaAll(); }, 300);
</script>
