<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelola Karyawan - RelawanTrack</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

  <div class="max-w-7xl mx-auto px-4 py-8">
    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">Manajemen Data Karyawan</h1>
        <p class="text-slate-500 text-sm">Kelola profil, divisi, dan pola hari kerja karyawan</p>
      </div>
      <div class="flex gap-2">
        <a href="admin_dashboard.html" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg text-sm font-medium transition">
          ← Kembali ke Dashboard
        </a>
        <button onclick="openModal()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition">
          + Tambah Karyawan
        </button>
      </div>
    </div>

    <!-- Filter & Pencarian -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-col sm:flex-row gap-4 justify-between">
      <input type="text" id="searchInput" oninput="renderTable()" placeholder="Cari nama atau divisi..." class="px-3 py-2 border rounded-lg text-sm w-full sm:w-64 focus:outline-none focus:ring-2 focus:ring-blue-500">
      <select id="filterDivisi" onchange="renderTable()" class="px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value="">Semua Divisi</option>
      </select>
    </div>

    <!-- Tabel Karyawan -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-100 border-b border-slate-200 text-slate-600 font-semibold uppercase text-xs">
            <tr>
              <th class="p-4">Nama / Foto</th>
              <th class="p-4">Divisi</th>
              <th class="p-4">Jam Kerja</th>
              <th class="p-4">Hari Masuk</th>
              <th class="p-4">PIN</th>
              <th class="p-4 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="employeeTableBody" class="divide-y divide-slate-100">
            <tr><td colspan="6" class="p-4 text-center text-slate-400">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal Form (Tambah/Edit) -->
  <div id="modalForm" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 max-h-[90vh] overflow-y-auto">
      <h2 id="modalTitle" class="text-lg font-bold text-slate-900 mb-4">Tambah Karyawan</h2>
      
      <form id="karyawanForm" onsubmit="saveKaryawan(event)" class="space-y-4">
        <input type="hidden" id="empId">

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Lengkap</label>
          <input type="text" id="empNama" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Divisi</label>
          <input type="text" id="empDivisi" required placeholder="Contoh: Logistik, Admin" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Jam Masuk</label>
            <input type="time" id="empJamMasuk" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Jam Pulang</label>
            <input type="time" id="empJamPulang" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Hari Kerja (Hari Masuk)</label>
          <div class="grid grid-cols-2 gap-2 text-sm pt-1">
            <label class="flex items-center gap-2"><input type="checkbox" name="hari_masuk" value="minggu" class="rounded"> Minggu</label>
            <label class="flex items-center gap-2"><input type="checkbox" name="hari_masuk" value="senin" class="rounded"> Senin</label>
            <label class="flex items-center gap-2"><input type="checkbox" name="hari_masuk" value="selasa" class="rounded"> Selasa</label>
            <label class="flex items-center gap-2"><input type="checkbox" name="hari_masuk" value="rabu" class="rounded"> Rabu</label>
            <label class="flex items-center gap-2"><input type="checkbox" name="hari_masuk" value="kamis" class="rounded"> Kamis</label>
            <label class="flex items-center gap-2"><input type="checkbox" name="hari_masuk" value="jumat" class="rounded"> Jumat</label>
            <label class="flex items-center gap-2"><input type="checkbox" name="hari_masuk" value="sabtu" class="rounded"> Sabtu</label>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">PIN Absen (4-6 Digit)</label>
          <input type="text" id="empPin" maxlength="6" placeholder="1234" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">URL Foto (Opsional)</label>
          <input type="url" id="empFoto" placeholder="https://..." class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div class="flex justify-end gap-2 pt-4 border-t">
          <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg">Batal</button>
          <button type="submit" class="px-4 py-2 text-sm font-medium bg-blue-600 hover:bg-blue-700 text-white rounded-lg">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Inisialisasi Supabase
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let listKaryawan = [];

    document.addEventListener("DOMContentLoaded", fetchKaryawan);

    // Fetch Data
    async function fetchKaryawan() {
      const { data, error } = await supabase.from('karyawan').select('*').order('nama', { ascending: true });
      if (error) {
        alert("Gagal mengambil data karyawan: " + error.message);
        return;
      }
      listKaryawan = data || [];
      populateDivisiFilter();
      renderTable();
    }

    // Populate Filter Divisi
    function populateDivisiFilter() {
      const select = document.getElementById('filterDivisi');
      const divisiSet = new Set(listKaryawan.map(k => k.divisi).filter(Boolean));
      select.innerHTML = '<option value="">Semua Divisi</option>';
      divisiSet.forEach(d => {
        select.innerHTML += `<option value="${d}">${d}</option>`;
      });
    }

    // Render Tabel
    function renderTable() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const filterDivisi = document.getElementById('filterDivisi').value;
      const tbody = document.getElementById('employeeTableBody');

      const filtered = listKaryawan.filter(item => {
        const matchSearch = item.nama?.toLowerCase().includes(search) || item.divisi?.toLowerCase().includes(search);
        const matchDivisi = !filterDivisi || item.divisi === filterDivisi;
        return matchSearch && matchDivisi;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400">Tidak ada data ditemukan.</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(k => {
        // Parse JSONB hari_masuk
        const hariArr = Array.isArray(k.hari_masuk) ? k.hari_masuk : [];
        const hariBadges = hariArr.map(h => `<span class="inline-block bg-slate-100 text-slate-700 text-[10px] px-1.5 py-0.5 rounded capitalize mr-1">${h}</span>`).join('');

        return `
          <tr class="hover:bg-slate-50 transition">
            <td class="p-4 font-medium flex items-center gap-3">
              <img src="${k.foto || 'https://via.placeholder.com/40'}" class="w-8 h-8 rounded-full object-cover border">
              <span>${k.nama}</span>
            </td>
            <td class="p-4 text-slate-600">${k.divisi || '-'}</td>
            <td class="p-4 text-slate-600">${k.jam_masuk || '--:--'} - ${k.jam_pulang || '--:--'}</td>
            <td class="p-4">${hariBadges || '<span class="text-slate-300">-</span>'}</td>
            <td class="p-4 text-slate-600 font-mono">${k.pin || '****'}</td>
            <td class="p-4 text-center space-x-2">
              <button onclick="editKaryawan('${k.id}')" class="text-blue-600 hover:text-blue-800 text-xs font-semibold">Edit</button>
              <button onclick="resetPin('${k.id}')" class="text-amber-600 hover:text-amber-800 text-xs font-semibold">Reset PIN</button>
              <button onclick="deleteKaryawan('${k.id}', '${k.nama}')" class="text-rose-600 hover:text-rose-800 text-xs font-semibold">Hapus</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    // Modal Control
    function openModal() {
      document.getElementById('karyawanForm').reset();
      document.getElementById('empId').value = '';
      document.getElementById('modalTitle').innerText = 'Tambah Karyawan';
      document.getElementById('modalForm').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modalForm').classList.add('hidden');
    }

    // Simpan Data (Insert/Update)
    async function saveKaryawan(e) {
      e.preventDefault();
      const id = document.getElementById('empId').value;
      const nama = document.getElementById('empNama').value;
      const divisi = document.getElementById('empDivisi').value;
      const jam_masuk = document.getElementById('empJamMasuk').value;
      const jam_pulang = document.getElementById('empJamPulang').value;
      const pin = document.getElementById('empPin').value || '1234';
      const foto = document.getElementById('empFoto').value;

      // Tangkap Checkbox Hari (Format Array untuk JSONB)
      const checkedHari = Array.from(document.querySelectorAll('input[name="hari_masuk"]:checked'))
                               .map(cb => cb.value.toLowerCase());

      const payload = {
        nama,
        divisi,
        jam_masuk,
        jam_pulang,
        hari_masuk: checkedHari, // Masuk ke kolom jsonb Supabase
        pin,
        foto
      };

      let error;
      if (id) {
        ({ error } = await supabase.from('karyawan').update(payload).eq('id', id));
      } else {
        ({ error } = await supabase.from('karyawan').insert([payload]));
      }

      if (error) {
        alert("Gagal menyimpan data: " + error.message);
      } else {
        closeModal();
        fetchKaryawan();
      }
    }

    // Edit Karyawan
    function editKaryawan(id) {
      const k = listKaryawan.find(item => item.id == id);
      if (!k) return;

      document.getElementById('empId').value = k.id;
      document.getElementById('empNama').value = k.nama || '';
      document.getElementById('empDivisi').value = k.divisi || '';
      document.getElementById('empJamMasuk').value = k.jam_masuk || '';
      document.getElementById('empJamPulang').value = k.jam_pulang || '';
      document.getElementById('empPin').value = k.pin || '';
      document.getElementById('empFoto').value = k.foto || '';

      // Populate Hari Checkboxes
      const hariArr = Array.isArray(k.hari_masuk) ? k.hari_masuk : [];
      document.querySelectorAll('input[name="hari_masuk"]').forEach(cb => {
        cb.checked = hariArr.includes(cb.value.toLowerCase());
      });

      document.getElementById('modalTitle').innerText = 'Edit Karyawan';
      document.getElementById('modalForm').classList.remove('hidden');
    }

    // Reset PIN default (1234)
    async function resetPin(id) {
      if (confirm("Reset PIN karyawan ini ke standar '1234'?")) {
        const { error } = await supabase.from('karyawan').update({ pin: '1234' }).eq('id', id);
        if (error) alert("Gagal reset PIN: " + error.message);
        else fetchKaryawan();
      }
    }

    // Hapus Karyawan
    async function deleteKaryawan(id, nama) {
      if (confirm(`Yakin ingin menghapus karyawan "${nama}"?`)) {
        const { error } = await supabase.from('karyawan').delete().eq('id', id);
        if (error) alert("Gagal menghapus: " + error.message);
        else fetchKaryawan();
      }
    }
  </script>
</body>
</html>
